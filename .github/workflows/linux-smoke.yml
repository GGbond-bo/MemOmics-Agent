# Linux Smoke Test — MemOmics 发行包真机冒烟（先测后修路线）
#
# 目的：用 GitHub Actions 的真实 Ubuntu 跑「用户拿到的正版 Linux 包」，
# 收集 Linux 端从未被真机验证过的失败证据，供修复使用。
# 证据点：
#   1. 开箱启动（start.sh 建 venv + 装依赖 + WebUI 可访问）
#   2. 打包的 environment.json 在启动后是否仍为空（探测未运行？）
#   3. venv 里 Python 生信包是否齐全（scvelo/scrublet/leidenalg 等）
#   4. 装了最小 R（r-base + jsonlite）后，持久 R kernel 能否跨调用复用变量
#   5. 持久 Python kernel 同测
#
# 手动触发: Actions → Linux Smoke Test → Run workflow

name: Linux Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/linux-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download shipped Linux package from Release
        run: |
          curl -fsSL -o MemOmics-Linux.tar.gz \
            https://github.com/GGbond-bo/MemOmics-Agent/releases/download/v2026-08-16/MemOmics-Linux.tar.gz
          ls -lh MemOmics-Linux.tar.gz

      - name: Extract package
        run: |
          tar -xzf MemOmics-Linux.tar.gz
          ls MemOmics | head -40
          echo '--- shipped start.sh ---'
          head -20 MemOmics/start.sh

      - name: Baseline - shipped environment.json
        run: cat MemOmics/environment.json

      - name: Baseline - R availability out of the box
        run: |
          which Rscript && Rscript --version || echo "RESULT: Rscript NOT FOUND — 包不管理 R，开箱即无 R"
          python3 --version

      - name: Boot server via shipped start.sh (venv + deps + WebUI)
        run: |
          cd MemOmics
          chmod +x start.sh
          nohup ./start.sh 8899 > boot.log 2>&1 &
          BOOTED=0
          for i in $(seq 1 240); do
            if curl -fsS -o /dev/null --max-time 5 http://localhost:8899/ 2>/dev/null; then
              BOOTED=1; break
            fi
            sleep 5
          done
          echo "SERVER_BOOTED=$BOOTED"
          if [ "$BOOTED" != "1" ]; then
            echo '--- boot.log tail ---'
            tail -100 boot.log
            exit 1
          fi
          echo '--- boot.log tail ---'
          tail -40 boot.log
          echo '--- environment.json after boot (探测是否回填了 paths?) ---'
          cat environment.json

      - name: Probe - WebUI HTTP
        run: |
          curl -sS -o /dev/null -w 'root HTTP %{http_code}\n' http://localhost:8899/
          curl -sS http://localhost:8899/ | head -c 200; echo

      - name: Probe - Python bio packages in venv
        run: |
          cd MemOmics
          for p in scanpy anndata scvelo scrublet leidenalg igraph umap rapidocr_onnxruntime opencv; do
            ./.venv/bin/python -c "import $p" 2>/dev/null && echo "OK   $p" || echo "MISS $p"
          done

      - name: Probe - what Rscript would the kernel resolve to
        run: |
          cd MemOmics
          ./.venv/bin/python - <<'PYEOF'
          import shutil, json, os
          print("which Rscript ->", shutil.which("Rscript"))
          try:
              env = json.load(open("environment.json", encoding="utf-8"))
              print("paths.r ->", env.get("paths", {}).get("r", {}))
          except Exception as e:
              print("environment.json read error:", e)
          PYEOF

      - name: Install minimal R (simulate user providing R; r-base + jsonlite)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base r-cran-jsonlite
          Rscript --version
          Rscript -e 'cat("libPaths:", .libPaths(), sep="\n"); cat("\njsonlite:", requireNamespace("jsonlite", quietly=TRUE), "\n")'

      - name: Test - persistent R kernel reuse (变量跨调用存活 = 持久化)
        run: |
          cd MemOmics
          export HERMES_HOME="$PWD/hermes_home"
          export PYTHONPATH="$PWD:$PWD/hermes-agent"
          ./.venv/bin/python - <<'PYEOF'
          from tools.persistent_kernel import KERNEL_POOL
          r1 = KERNEL_POOL.execute('x <- 42; cat("defined x =", x, "\n")', 'smoke-r', timeout=120, language='r')
          r2 = KERNEL_POOL.execute('cat("second call sees x =", x, "\n")', 'smoke-r', timeout=120, language='r')
          o1 = (r1.get("result") or r1.get("error") or "")[:300]
          o2 = (r2.get("result") or r2.get("error") or "")[:300]
          ok = r1.get("status") == "ok" and r2.get("status") == "ok" and "42" in (r2.get("result") or "")
          print("R call1:", r1.get("status"), "|", o1)
          print("R call2:", r2.get("status"), "|", o2)
          print("R_PERSISTENT:", "OK" if ok else "FAILED")
          PYEOF

      - name: Test - persistent Python kernel reuse
        run: |
          cd MemOmics
          export HERMES_HOME="$PWD/hermes_home"
          export PYTHONPATH="$PWD:$PWD/hermes-agent"
          ./.venv/bin/python - <<'PYEOF'
          from tools.persistent_kernel import KERNEL_POOL
          r1 = KERNEL_POOL.execute('x = 7\nprint("defined x =", x)', 'smoke-py', timeout=120, language='python')
          r2 = KERNEL_POOL.execute('print("second call sees x =", x)', 'smoke-py', timeout=120, language='python')
          o1 = (r1.get("result") or r1.get("error") or "")[:300]
          o2 = (r2.get("result") or r2.get("error") or "")[:300]
          ok = r1.get("status") == "ok" and r2.get("status") == "ok" and "7" in (r2.get("result") or "")
          print("PY call1:", r1.get("status"), "|", o1)
          print("PY call2:", r2.get("status"), "|", o2)
          print("PY_PERSISTENT:", "OK" if ok else "FAILED")
          PYEOF

      - name: Upload evidence (boot log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke-evidence
          path: MemOmics/boot.log
          if-no-files-found: ignore
