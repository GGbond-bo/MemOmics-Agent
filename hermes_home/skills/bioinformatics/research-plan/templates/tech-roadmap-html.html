<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术路线图 — {{TITLE}}</title>
<style>
  :root { --blue:#1565c0; --red:#c62828; --yellow:#f9a825; --green:#2e7d32; --bg:#fafafa; --card:#fff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:#333;line-height:1.6;padding:40px 20px}
  .container{max-width:1100px;margin:0 auto}
  h1{font-size:2rem;text-align:center;color:var(--red);border-bottom:3px solid var(--red);padding-bottom:12px;margin-bottom:8px}
  .subtitle{text-align:center;color:#666;font-size:.95rem;margin-bottom:36px}
  .pipeline{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:stretch;margin-bottom:40px}
  .phase{background:var(--card);border-radius:12px;padding:20px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex:1 1 180px;min-width:170px;border-top:4px solid #ccc;position:relative}
  .phase.red{border-top-color:var(--red)} .phase.yel{border-top-color:var(--yellow)} .phase.green{border-top-color:var(--green);background:#e8f5e9}
  .phase h3{font-size:.85rem;color:#888;margin-bottom:6px;text-transform:uppercase}
  .phase h2{font-size:1.05rem;margin-bottom:8px}
  .phase ul{list-style:none;font-size:.85rem} .phase li{padding:3px 0;border-bottom:1px solid #f0f0f0} .phase li:last-child{border-bottom:none}
  .arrow{display:flex;align-items:center;font-size:1.5rem;color:#999;flex-shrink:0}
  .detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:32px}
  .card{background:var(--card);border-radius:10px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.05);border-left:5px solid var(--red)}
  .card.yel{border-left-color:var(--yellow)} .card h3{font-size:1.1rem;margin-bottom:10px}
  .card table{width:100%;font-size:.82rem;border-collapse:collapse}
  .card td,.card th{padding:6px 8px;text-align:left;border-bottom:1px solid #eee}
  .card th{color:#888;font-weight:500;white-space:nowrap}
  .figure-layout{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:32px}
  .figure-layout h2{color:var(--green);margin-bottom:16px;text-align:center}
  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .panel{border:2px dashed #ccc;border-radius:8px;padding:12px;font-size:.82rem;text-align:center;min-height:60px;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .panel.single{grid-column:1/-1} .panel.half{grid-column:span 1}
  .panel.done{background:#e8f5e9;border-color:var(--green)} .panel.new{background:#ffebee;border-color:var(--red)}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;margin-left:4px}
  .tag.old{background:#e8f5e9;color:#2e7d32} .tag.new{background:#ffebee;color:#c62828}
  hr{border:none;border-top:2px solid #eee;margin:32px 0}
  .footer{text-align:center;color:#aaa;font-size:.8rem}
</style>
</head>
<body>
<div class="container">
<h1>{{TITLE}}</h1>
<p class="subtitle">{{SUBTITLE}}</p>

<h2 style="text-align:center;margin-bottom:16px;">🧭 分析流水线</h2>
<div class="pipeline">
  {{PIPELINE_PHASES}}  <!-- Repeat: <div class="phase red|yel"><h3>Phase N</h3><h2>Name</h2><ul><li>...</li></ul></div> with <div class="arrow">→</div> between -->
</div>

<hr>
<h2 style="margin-bottom:16px;">📋 各阶段详细说明</h2>
<div class="detail-grid">
  {{DETAIL_CARDS}}  <!-- Repeat: <div class="card [yel]"><h3>Phase N · Name</h3><table>...</table></div> -->
</div>

<hr>
<div class="figure-layout">
  <h2>🎨 最终 Figure 布局</h2>
  <div class="panel-grid">
    {{PANEL_ITEMS}}  <!-- <div class="panel half|single done|new">content<span class="tag old|new">Phase</span></div> -->
  </div>
</div>

<hr>
<h2 style="margin-bottom:16px;">📊 数据流</h2>
<table style="width:100%;font-size:.85rem;border-collapse:collapse;">
  <thead><tr style="background:#f5f5f5;"><th style="padding:10px;">Phase</th><th style="padding:10px;">输入</th><th style="padding:10px;">操作</th><th style="padding:10px;">输出到</th><th style="padding:10px;">Panel</th></tr></thead>
  <tbody>{{DATAFLOW_ROWS}}</tbody>
</table>

<hr>
<h2 style="text-align:center;color:var(--red);">⏭️ 下一步</h2>
<div style="text-align:center;padding:20px;">
  <p style="font-size:1.1rem;">{{NEXT_STEPS}}</p>
</div>
<p class="footer">MemOmics Agent · {{DATE}}</p>
</div>
</body>
</html>
