  - HIF1A：NSCLC肿瘤细胞，up，缺氧下积累，促进VEGF等

  - CDKN1B：NSCLC肿瘤细胞，down，在队列中为有利预后特征

  - CSNK2A1：NSCLC肿瘤细胞，up，Subtype 4中激酶活性显著上调

  - GSK3B：NSCLC肿瘤细胞，up，Subtype 4中激酶活性显著上调

  - SLK：NSCLC肿瘤细胞，up，S347磷酸化位点，Subtype 4不良预后标志物

  - LRRFIP1：NSCLC肿瘤细胞，up，S581磷酸化位点，Subtype 4不良预后标志物

