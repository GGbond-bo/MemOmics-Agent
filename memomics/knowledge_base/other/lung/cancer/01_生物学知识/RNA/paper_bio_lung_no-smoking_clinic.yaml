  ## 基因 Marker

  - EGFR：LUAD，na，Subtype 1和Subtype 2中常见EGFR突变；Subtype 2 EGFR突变49%（22/45）；两个亚型均见EGFR通路上调

  - TP53：LUAD，na，Subtype 1常见TP53突变；Subtype 2 TP53突变频率低（6%，OR 0.04，P=3.1e-9）

  - CDKN2A：LUAD，down，Subtype 1显著富集CDKN2A拷贝数缺失（OR 3.63，P=2.35e-2）

  - TP53：肿瘤细胞，down，抑癌基因改变：截断突变/拷贝数丢失；Fig.1c-d

  - CDKN2A：肿瘤细胞，down，其他抑癌基因，拷贝数丢失；Fig.1c

  - STK11：肿瘤细胞，down，其他抑癌基因；Fig.1c

  - KEAP1：肿瘤细胞，down，其他抑癌基因；Fig.1c

  - RB1：肿瘤细胞，down，其他抑癌基因；Fig.1c

