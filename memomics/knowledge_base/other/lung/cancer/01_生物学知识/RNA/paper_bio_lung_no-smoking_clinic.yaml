  - MET：肿瘤细胞，up，外显子跳跃；Fig.1c

  - ALK：肿瘤细胞，up，基因融合；Fig.1c

  - RET：肿瘤细胞，up，基因融合；Fig.1c

  - ROS1：肿瘤细胞，up，基因融合；Fig.1c

