  - SMARCA4：肿瘤细胞，down，其他抑癌基因；Fig.1c

  - EGFR：肿瘤细胞，up，驱动基因改变：L858R、外显子19缺失、其他SNV；Fig.1c-d

  - KRAS：肿瘤细胞，up，驱动基因改变：KRAS或KRAS+PIK3CA；Fig.1c-d

