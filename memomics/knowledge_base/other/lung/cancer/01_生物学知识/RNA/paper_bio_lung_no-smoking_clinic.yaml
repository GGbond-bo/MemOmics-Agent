content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L2]** 非小细胞肺癌可通过组织学与多组学分析划分为五种分子亚型。　（验证：韩国NSCLC队列 n=229；既往多组学研究 n=462 ｜ 位置：Abstract）

  - **[L2]** 存在一种PI3K-Akt通路上调的NSCLC亚型，无论组织学类型如何，均表现出高转移比例和较差生存结局。　（验证：韩国NSCLC队列 n=229；既往多组学研究
  n=462 ｜ 位置：Abstract）

  - **[L2]** LUAD和LSCC中存在增殖性亚型，其与全基因组倍增（WGD）事件强相关。　（验证：韩国NSCLC队列 n=229；既往多组学研究 n=462
  ｜ 位置：Abstract）

  - **[L2]** 不同分子亚型具有不同的免疫细胞组成和新生抗原负荷，并可预测不同预后。　（验证：韩国NSCLC队列 n=229；既往多组学研究 n=462
  ｜ 位置：Abstract）

  - **[L2]** 免疫学亚型呈热肿瘤富集状态，且辅助治疗疗效更高。　（验证：韩国NSCLC队列 n=229；既往多组学研究 n=462 ｜ 位置：Abstract）

  - **[L2]** 通过整合蛋白质组、磷酸化蛋白质组和乙酰化蛋白质组数据并进行NMF聚类，在229例韩国NSCLC患者中鉴定出五个多组学亚型：代谢型、肺泡样型、增殖型、缺氧型和免疫原性型。　（验证：对229例NSCLC肿瘤样本进行蛋白质组、磷酸化蛋白质组和乙酰化蛋白质组检测，并整合后进行NMF聚类（Results
  第3段/Fig.1c） ｜ 位置：Results 第3段 / Fig.1c）

  - **[L2]** Subtype 1以LUAD女性、EGFR和TP53突变、全基因组倍增事件及CDKN2A拷贝数缺失富集为特征，提示染色体不稳定共驱动亚型。　（验证：WES检测突变/拷贝数、临床表型及分子通路分析（Fig.1c,d；Supplementary
  Data 1b-d） ｜ 位置：Results 第3段 / Fig.1c,d）

  - **[L2]** Subtype 2主要为LUAD、EGFR突变且无全基因组倍增，TP53突变频率低、TMB低，提示染色体稳定癌基因驱动亚型。　（验证：WES/RNA-seq/蛋白质组分析；TMB与TP53突变频率统计（Fig.1c,d；Supplementary
  Fig.1b,c） ｜ 位置：Results 第3段 / Fig.1c,d；Supplementary Fig.1b,c）

  - **[L2]** Subtype 1显著上调氧化磷酸化、线粒体基质和细胞呼吸相关蛋白。　（验证：蛋白质组/磷酸化蛋白质组/乙酰化蛋白质组检测及通路富集分析（Fig.1e；Results
  第3段） ｜ 位置：Results 第3段 / Fig.1e）

  - **[L1]** NSCLC多组学研究面临临床转化挑战：既往多聚焦单一亚型、传统预后因素之外的生存预测不足、术后辅助化疗反应分子基础研究少且缺乏共识生物标志物。　（位置：Introduction
  第2段）

  - **[L1]** TCGA曾将LSCC分为classical、basal、secretory、primitive亚型，将LUAD分为terminal respiratory
  unit、proximal inflammatory、proximal proliferative亚型。　（位置：Introduction 第1段）

  - **[L3]** 在韩国NSCLC患者多组学队列中，通过NMF聚类鉴定出5个多组学亚型（Subtype 1–5）。　（验证：韩国NSCLC患者队列n=229，多组学特征在<30%缺失值过滤后进入NMF聚类；Fig.1c
  ｜ 位置：Fig.1c, Caption）

  - **[L2]** 5个多组学亚型与组织学、TNM分期、病理N状态、复发状态、辅助治疗、免疫簇、全基因组倍增及驱动基因改变等临床/分子特征相关。　（验证：Fig.1d临床变量富集分析，P<0.05，双侧Fisher精确检验，队列n=229
  ｜ 位置：Fig.1d）

  - **[L2]** 5个多组学亚型在TNFα/NF-κB、同种移植排斥、PI3K-Akt、缺氧、中性粒细胞脱颗粒、分泌颗粒、G2M检查点、E2F靶点、CDK2、Notch、IL33、EGFR1、细胞呼吸、氧化磷酸化、线粒体基质等通路/特征上呈富集差异。　（验证：GSVA和PTM-SEA，FDR<0.05，permutation，正富集z-score；Fig.1e
  ｜ 位置：Fig.1e）

  - **[L1]** ANGPT2在缺氧环境中升高，并通过HIF-1积累促进VEGF等促血管生成细胞因子释放。　（验证：文献转述（原文称 known），未展示本研究湿实验验证
  ｜ 位置：正文 ANGPT2 段）

  - **[L1]** TIMP3 K65乙酰化增加，可能参与ANGPT2诱导的高血压反应。　（验证：磷酸化/乙酰化蛋白组观察，Fig.2g 通路网络 ｜ 位置：正文
  TIMP3 段 / Fig.2g）

  - **[L2]** CDKN1B显著下调，并在本研究队列中表现为有利预后特征。　（验证：队列差异表达 adjusted P=7.1×10−11, two-sided
  t-test, Supplementary Data 3a；生存 log-rank P=1.3×10−4, Supplementary Data 2d ｜ 位置：正文
  CDKN1B 段 / Supplementary Data 2d,3a）

  - **[L2]** 联合NMF将NSCLC分为5个亚型，其中Subtype 4与不良生存相关。　（验证：NMF分型与生存分析；Fig.2h log-rank，Subtype
  4 n=43 vs others n=186；CPTAC验证 Fig.2f ｜ 位置：Fig.2a-h）

  - **[L1]** Subtype 4中CSNK2A1和GSK3B激酶活性显著上调（FDR<0.05）。　（验证：磷酸化蛋白组+PHONEMeS激酶活性估计，FDR<0.05，Fig.2d
  ｜ 位置：Fig.2d）

  - **[L2]** SLK S347和LRRFIP1 S581是Subtype 4相关的不良预后标志物，其表达在Subtype 4中较高并与生存相关。　（验证：Wilcoxon
  rank-sum Fig.2e；log-rank生存 Fig.2f；本研究与CPTAC队列验证 ｜ 位置：Fig.2e-f）

  - **[L1]** Subtype 4的不良预后与HIF-1、VEGF、PI3K-AKT和NF-κB信号通路及血管生成/高血压/细胞凋亡等过程相关。　（验证：通路网络图整合差异表达/磷酸化位点，Fig.2g
  ｜ 位置：Fig.2g）

  - **[L2]** 在韩国NSCLC队列中，Subtype 4患者的生存率显著低于其他亚型（P=8.4×10−3, log-rank test, Fig.2h），且非转移Subtype
  4患者也显示显著生存劣势（P=2.6×10−2, Fig.2j）；但在合并CPTAC队列中Subtype 4与其他亚型总生存无显著差异（P=7.9×10−1,
  Supplementary Fig.2j）。　（验证：韩国NSCLC队列生存分析，log-rank检验，Fig.2h,j；CPTAC队列总生存分析，log-rank检验，Supplementary
  Fig.2j ｜ 位置：Results: clinical significance of Subtype 4 / Fig.2h,j, Supplementary
  Fig.2j）

  - **[L3]** Subtype 4具有五个亚型中最高的转移率，但Subtype 4内有/无转移患者生存率无差异（P=9.5×10−1, Fig.2i），提示转移可能不是导致其预后差的唯一机制。　（验证：临床队列生存率比较，log-rank
  test，Fig.2i；转移率来自分型临床特征 ｜ 位置：Results: clinical significance of Subtype 4 / Fig.2i）

  - **[L1]** CDKN1B表达降低可能与Subtype 4晚期表型相关，因既往报道CDKN1B缺失增加癌症转移风险。　（位置：Results 第1段 /
  关于Subtype 4）

  - **[L1]** 基于整合scRNA-seq，Subtype 1和3的亚型特异性DEG分别富集于LUAD/LUAD有丝分裂和LSCC/LSCC有丝分裂肿瘤细胞类型，提示活跃增殖的肿瘤细胞成分。　（验证：整合scRNA-seq
  DEG富集置换检验，FDR<0.01，Fig.3a，Supplementary Fig.3b ｜ 位置：Results: Cellular landscape
  / Fig.3a, Supplementary Fig.3b）

  - **[L1]** Subtype 2、4、5的亚型特异性DEG富集于中性粒细胞；Subtype 4和5富集肿瘤相关中性粒细胞（TAN），Subtype 4比例最高。　（验证：scRNA-seq
  DEG置换检验，FDR<0.01，Supplementary Data 3e ｜ 位置：Results: Cellular landscape / Supplementary
  Data 3e）

  - **[L1]** Subtype 2的DEG富集于肺泡型成纤维细胞和内皮细胞，提示其肿瘤间质成分类似正常肺泡间质。　（验证：scRNA-seq DEG富集分析，Supplementary
  Data 3e ｜ 位置：Results: Cellular landscape / Supplementary Data 3e）

  - **[L2]** 组织病理学与分子分型一致：Subtype 1/2以well-to-moderately differentiated腺癌为主，Subtype
  2 lepidic模式更广泛且淋巴血管侵犯和淋巴结转移较少；Subtype 3主要为鳞癌及实性为主腺癌，伴高核异型、高有丝分裂和坏死；Subtype 4有中至大量促结缔组织增生间质，Subtype
  5约半数病例高免疫细胞浸润。　（验证：组织病理学图像/评估，Fig.3b–m ｜ 位置：Results: Cellular landscape / Fig.3b–m）

  - **[L2]** Subtype 3是一个以全基因组倍增（WGD）为特征的增殖亚型：韩国NSCLC队列中75%（39/52）发生WGD，合并CPTAC队列中64%（41/64）；与CN14签名显著关联（OR=8.4），并富集3q扩增及SOX2扩增与TP53突变共现（OR=16.4），TMB高于其他亚型。　（验证：韩国NSCLC队列n=52及合并CPTAC队列n=64的拷贝数/WGD分析，Fisher精确检验，Wilcoxon秩和检验，Fig.4a–d
  ｜ 位置：Results: Proteogenomic features underlying WGD / Fig.4a–d）

  - **[L2]** Subtype 3显示细胞周期通路相关蛋白、PTM和激酶上调，关键包括SRSF1（S199/K179）、SRSF2（T25/S26）和XPO1（K693）。　（验证：proteogenomic/proteomic/PTM/kinase分析，Fig.4e,f，Supplementary
  Fig.4f,g ｜ 位置：Results: Proteogenomic features underlying WGD / Fig.4e,f）

  - **[L1]** 增殖亚型在NSCLC中常见，主要表现为细胞周期通路（E2F targets、G2M checkpoint、MYC targets v1/v2）上调；既往LUAD和LSCC研究报道增殖亚型分别占27%和16%–44%。　（验证：引用既往proteogenomic研究，Supplementary
  Fig.4a,b ｜ 位置：Results: Proteogenomic features underlying WGD / Supplementary Fig.4a,b）

  - **[L2]** XPO1 在该亚型中蛋白及乙酰化蛋白水平上调；靶向 XPO1 的 selinexor 对 WGD 阳性 LSCC 类器官表现出更高药物敏感性，提示其可能成为
  LSCC 伴 WGD 肿瘤的潜在治疗策略。　（验证：Fig. 4g 显示 XPO1 蛋白/乙酰化蛋白上调；Fig. 4h 和 Supplementary Data
  4k 显示 WGD 阳性 LSCC 肿瘤类器官经 selinexor 处理后药物敏感性更高。 ｜ 位置：Fig. 4g, Fig. 4h, Supplementary
  Data 4k）

  - **[L1]** SRSF2 等原癌基因可调节肿瘤抑制基因、激酶及激酶受体的剪接模式，使其转向致癌异构体，从而促进细胞周期活动。　（验证：原文转述文献 34，未在本片段中提供实验验证描述。
  ｜ 位置：Fig. 4g 前）

  - **[L1]** WGD 定义了 NSCLC 的两个主要亚型，但不同亚型可能具有不同驱动基因和潜在通路。　（验证：基于 Fig. 4i 和 Supplementary
  Data 4l 的基因组/通路分析，未在本片段中体现湿实验验证。 ｜ 位置：Fig. 4i, Supplementary Data 4l）

  - **[L1]** Subtype 1 中 WGD 占 51%（28/55），显著富集 CN15 信号，主要见于 LUAD，并与 EGFR 及 TP53 或
  CDKN2A 共突变相关。　（验证：Fig. 4a–d 的统计/基因组分析（Fisher 精确检验），未在本片段中体现湿实验验证。 ｜ 位置：Fig. 4a–d）

  - **[L2]** Subtype 2 肿瘤更具早期 LUAD 特征，贴壁型比例较高，淋巴血管侵犯、淋巴结转移和肿瘤坏死较少。　（验证：临床与组织病理队列分析，Subtype
  1 n=55、Subtype 2 n=34/43 等，见图 3e–l。 ｜ 位置：Fig. 3e–l）

  - **[L1]** 大多数免疫调节因子（主要包括癌细胞配体和免疫细胞受体）与HTE肿瘤及大多数免疫细胞正相关，但与上皮细胞无关。　（验证：本队列回归分析（Supplementary
  Fig. 5g 和 Supplementary Data 5h），未描述湿实验验证 ｜ 位置：Results 第1段 / Supplementary Fig.
  5g, Supplementary Data 5h）

  - **[L2]** VEGF-A的表达和活性与HTE肿瘤负相关，并与其他大多数免疫调节因子的模式相反；VEGF-A还与TILs负相关，可能影响癌症风险。　（验证：本队列及CPTAC、Satpathy、Gillette等外部肺癌多组学队列中相关性方向一致（Fig.
  5d, Supplementary Data 5i） ｜ 位置：Fig. 5d / Supplementary Data 5i）

  - **[L2]** 10个免疫调节因子与免疫簇状态显著相关，且在本队列与其他肺癌多组学研究中的相关方向一致。　（验证：本队列与CPTAC/Satpathy/Gillette等外部肺癌多组学队列验证（Fig.
  5d, Supplementary Data 5i） ｜ 位置：Fig. 5d / Supplementary Data 5i）

  - **[L2]** 多组学亚型5在低cryptic MAP负荷和HTE组中富集。　（验证：Fig.6e 多组学亚型富集分析；Supplementary Data
  6d；Fisher精确检验并经Benjamini-Hochberg校正。 ｜ 位置：Fig.6e / Supplementary Data 6d）

  - **[L2]** 用APM和TIL模式替代免疫簇后，得到相似的生存趋势和多组学亚型分布。　（验证：Supplementary Fig.6e–g；Supplementary
  Data 6e,f；与免疫簇分析结果一致。 ｜ 位置：Supplementary Fig.6e–g）

  - **[L2]** Subtype 5患者表现为低cryptic MAP负荷、HTE、激活的APM以及中等生存。　（验证：Fig.6f；Fig.3a–k单细胞和组织病理TIL分析；临床生存分析。
  ｜ 位置：Fig.6f / Fig.3a–k）

  - **[L2]** Subtype 5患者除APM激活外，TNF-α–NF-κB通路活性高。　（验证：Fig.6f 多组学子型5的APM/NF-κB通路及蛋白表达特征（TAP1/2、CD8A、B2M、HLA-G、IL18、TNFAIPs）。
  ｜ 位置：Fig.6f）

  - **[L2]** 复发cryptic MAP患者与无复发者的总体生存差异显著。　（验证：Fig.6b Kaplan-Meier n=204（27例recurrent
  cryptic MAPs vs 178例no recurrent cryptic MAPs），log-rank P=0.017。 ｜ 位置：Fig.6b）

  - **[L2]** 按cryptic MAP负荷和免疫簇分四组后，患者生存模式存在显著差异。　（验证：Fig.6d Kaplan-Meier n=174，log-rank
  P=0.021（Red versus Purple）。 ｜ 位置：Fig.6d）

  - **[L2]** 高neoantigen candidate和高cryptic peptide负荷与更好生存相关。　（验证：Fig.6a 风险比HR及95%
  CI；高负荷与更长总体生存相关。 ｜ 位置：Fig.6a）

  - **[L2]** 在Subtype 5患者中，CTx或CRTx治疗状态与无复发生存显著相关。　（验证：Fig.6g Kaplan-Meier RFS，Subtype
  5 P=0.0016，log-rank检验。 ｜ 位置：Fig.6g）

  - **[L2]** 通过严格的肽段过滤、数据库比对及RNA-Seq证据支持，最终获得1045条新肽序列用于后续分析。　（验证：MS-GF+和Comet搜库、Percolator重打分、FDR
  1%、BLAST过滤、至少1条RNA-Seq read支持（Methods中novel peptides段落） ｜ 位置：Methods: novel peptides...末段）

  - **[L1]** 基于全局蛋白、磷酸化蛋白和乙酰化蛋白的多组学NMF分析可识别患者亚型，并以cophenetic correlation coefficient确定最佳聚类数k。　（位置：Methods:
  NMF clustering analysis for multiomics subtypes）

  - **[L2]** 该研究的多组学NMF亚型可与既往NSCLC多组学研究（Gillette、Satpathy、Lehtio、Xu）定义的亚型进行整合比较，并在包含462例NSCLC的队列中评估分型稳健性。　（验证：与包含462例NSCLC的近期研究进行多组学亚型特征比较，Fisher
  exact检验OR/p（Methods: Combined NMF...） ｜ 位置：Methods: Combined NMF and Comparison
  of NMF subtypes with previous NSCLC subtypes）

  - **[L1]** 选择 MSigDB 的 Hallmark 通路基因集和 PTMsigDB 的修饰位点特异性特征，用于 ssGSEA 和 PTM 特征分析，以识别
  NMF 亚型特征通路。　（验证：仅使用 MSigDB/PTMsigDB 数据库特征集进行生信特征分析，无湿实验验证。 ｜ 位置：For identifying
  NMF subtype feature pathway 段）

  - **[L1]** 使用 CNVkit 检测基因级拷贝数，转为 cytoband 级均值，并通过线性回归模型调整病理诊断分类 DX 后识别各 NMF 亚型的差异富集
  CNV，BH 校正后 adj p<0.05 为显著。　（验证：纯生信分析：CNVkit 转 cytoband，线性回归调整 DX，Benjamini-Hochberg
  校正；无湿实验验证。 ｜ 位置：Identification of differentially enriched copy number variations
  段）

  - **[L1]** 使用 Salmon/tximport/DESeq2 进行差异表达基因分析，模型纳入 Group、DX 和 rna:batch 协变量，BH
  校正后 adj p<0.05 为显著 DEG。　（验证：纯生信分析：Salmon 定量、tximport 汇总、DESeq2 负二项模型，调整 DX 和 RNA
  批次，BH 校正；无湿实验验证。 ｜ 位置：Identification of differentially expressed genes (DEGs) 段）

  - **[L1]** 使用线性回归模型识别差异表达蛋白、磷酸化和乙酰化，模型纳入 Group、DX 和 TMT Batch 协变量，BH 校正后 adj p<0.05
  为显著 DEP。　（验证：纯生信/蛋白质组统计分析：线性回归调整 DX 和 TMT channel 批次，Benjamini-Hochberg 校正；无湿实验验证。
  ｜ 位置：Identification of differentially expressed proteins, phosphorylation, and acetylation
  (DEP) 段）

  - **[L3]** 对 229 例 NSCLC 患者的五个 NMF 亚型进行总生存期比较，采用 Kaplan-Meier 估计和 log-rank 检验，并在
  Fig.2g 展示 pooled p 值。　（验证：229 例 NSCLC 患者 OS 临床队列，Kaplan-Meier/log-rank，pooled p
  展示于 Fig.2g；生存数据见 Supplementary Data 1a。 ｜ 位置：Survival analysis 段 / Fig.2g）

  - **[L3]** 对每个蛋白和 PTM 特征按表达 top 50% 与 bottom 50% 分组进行 feature-wise 生存分析，CPH 模型系数符号判定预后方向，log-rank
  nominal p<0.001 作为显著性标准。　（验证：229 例 NSCLC 患者 OS 临床队列，Kaplan-Meier/log-rank，CPH 模型；nominal
