  ## 基因 Marker

  - EGFR：NSCLC/LUAD tumor cells，na，EGFR mutations are enriched in Subtype 1 and Subtype
  2, and the EGFR pathway is upregulated in both subtypes.

  - TP53：NSCLC/LUAD tumor cells，na，TP53 mutations occur in Subtype 1 and show significantly
  lower frequency in Subtype 2.

  - CDKN2A：NSCLC tumor cells，down，CDKN2A copy number loss is significantly enriched
  in Subtype 1 (OR 3.63, P = 2.35 × 10−2).

  - TP53：NSCLC tumor cells，na，肿瘤抑制基因，改变包括截断突变、拷贝数缺失或两者兼有

  - CDKN2A：NSCLC tumor cells，na，其他肿瘤抑制基因，可为拷贝数缺失

  - STK11：NSCLC tumor cells，na，其他肿瘤抑制基因改变

  - KEAP1：NSCLC tumor cells，na，其他肿瘤抑制基因改变

  - RB1：NSCLC tumor cells，na，其他肿瘤抑制基因改变

  - PPP2R1A：NSCLC tumor cells，na，其他肿瘤抑制基因改变

  - SMARCA4：NSCLC tumor cells，na，其他肿瘤抑制基因改变

  - EGFR：NSCLC tumor cells，na，癌基因改变，包括 L858R、Exon19 del 和其他 SNV

  - KRAS：NSCLC tumor cells，na，其他癌基因改变，包括移码缺失、框内缺失/插入和错义突变，可与 PIK3CA 共变

  - ERBB2：NSCLC tumor cells，na，其他癌基因改变，包括移码缺失、框内缺失/插入和错义突变

  - PIK3CA：NSCLC tumor cells，na，其他癌基因改变，包括移码缺失、框内缺失/插入和错义突变，可与 KRAS 共变

  - MET：NSCLC tumor cells，na，其他癌基因改变，包括外显子跳跃

  - ALK：NSCLC tumor cells，na，其他癌基因改变，包括基因融合

  - ROS1：NSCLC tumor cells，na，其他癌基因改变，包括基因融合

  - RET：NSCLC tumor cells，na，其他癌基因改变，包括基因融合

  - TP53：NSCLC tumor，na，Subtype 3 associated with TP53 mutations (OR 13.5, P=4.6e-10);
  four Subtype 5 cases had concurrent KRAS/TP53 mutation.

  - PIK3CA：NSCLC tumor，na，Subtype 3 associated with PIK3CA mutations (OR 3.89, P=3.16e-2).

  - KRAS：NSCLC tumor，na，Subtype 5 enriched for KRAS mutation (OR 4.51, P=3.53e-2).

  - STK11：NSCLC tumor，na，Subtype 5 had STK11 mutation in 1 case; trend not statistically
  significant.

  - KEAP1：NSCLC tumor，na，Subtype 5 had KEAP1 mutation in 1 case; trend not statistically
  significant.

  - CSNK2A1：NSCLC tumor，up，Kinase activity enriched in Subtype 4 (FDR=2.3e-7); phosphorylates
  PI3K-AKT proteins and activates SLK.

  - GSK3B：NSCLC tumor，up，Kinase activity enriched in Subtype 4 (FDR=1.9e-2); involved
  in PI3K-AKT signaling.

  - SLK (S347)：NSCLC tumor，up，Phosphorylation upregulated in Subtype 4 (adjusted P=8.0e-3);
  associated with poor prognosis (P=3.0e-6); marker phosphorylated by CSNK2A1 and
  downstream of ErbB2/PI3K.

  - LRRFIP1 (S581)：NSCLC tumor，up，Phosphorylation upregulated in Subtype 4 (adjusted
  P=1.3e-2); associated with poor prognosis (P=1.2e-3); may promote EMT via Wnt/β-catenin
  signaling.

  - ANGPT2：na，up，Increased in hypoxic environment; promotes pro-angiogenic cytokines
  such as VEGF through HIF-1 accumulation.

  - TIMP3：na，up，Increased acetylation at K65, presumably involved in ANGPT2-induced
  hypertensive response.

  - CDKN1B：na，down，Significantly downregulated (adjusted P = 7.1 × 10−11); favorable
  prognostic feature (P = 1.3 × 10−4).

  - CSNK2A1：NSCLC Subtype 4，up，Significantly upregulated kinase activity in Subtype
  4 (FDR < 0.05).

  - GSK3B：NSCLC Subtype 4，up，Significantly upregulated kinase activity in Subtype
  4 (FDR < 0.05).

  - SLK：NSCLC Subtype 4，up，Phosphorylated at S347; poor prognosis marker in Subtype
  4.

  - LRRFIP1：NSCLC Subtype 4，up，Phosphorylated at S581; poor prognosis marker in Subtype
  4.

  - CDKN1B：NSCLC tumor, Subtype 4，down，Reduced expression in Subtype 4; loss increases
  cancer metastasis risk and implies advanced phenotype.

  - SOX2：NSCLC tumor, Subtype 3，up，Amplification on chromosome 3q and co-occurrence
  with TP53 mutations compared with other subtypes (OR: 16.4).

  - TP53：NSCLC tumor, Subtype 3，na，Mutations significantly co-occur with SOX2 amplification
  compared with other subtypes (OR: 16.4).

  - SRSF1：NSCLC tumor, Subtype 3，up，Upregulated protein and PTMs S199/K179 in cell
  cycle pathways.

  - SRSF2：NSCLC tumor, Subtype 3，up，Upregulated protein and PTMs T25/S26 in cell cycle
  pathways.

  - XPO1：NSCLC tumor, Subtype 3，up，Upregulated protein K693 in cell cycle pathways.

  - SOX2：Subtype 3 LSCC tumor cells，up，Located in chromosome 3q copy number amplification
  in Subtype 3 WGD; many cell cycle genes reside in this region.

  - ATR：Subtype 3 LSCC tumor cells，up，Located in chromosome 3q copy number amplification
  in Subtype 3 WGD; cell cycle gene.

  - STAG1：Subtype 3 LSCC tumor cells，up，Located in chromosome 3q copy number amplification
  in Subtype 3 WGD; cell cycle gene.

  - GSK3B：Subtype 3 LSCC tumor cells，up，Located in chromosome 3q copy number amplification
