content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L1]** 骨骼肌可塑性使其能适应多种内外部刺激和扰动，收缩活动变化可引发生化、代谢和产力特性的大规模重塑。　（位置：Abstract）

  - **[L1]** 规律体育锻炼可预防和治疗超过35种不同病理状况，并降低全因死亡率及心血管疾病或癌症等疾病特异性死亡率50–75%。　（位置：1 Introduction
  第1段，引用[2-4]）

  - **[L1]** 单次运动作为应激源破坏细胞稳态，许多改变类似衰老；重复训练可诱发适应性过程并增强肌肉及其他组织韧性，即 hormesis。　（位置：1 Introduction
  第2段，引用[7]）

  - **[L1]** 训练肌肉的蛋白质组与中年个体和糖耐量受损者呈负相关；2型糖尿病或代谢综合征中改变的许多基因在运动员中反向调控，6–12个月训练可显著减弱病理转录组指纹。　（位置：1
  Introduction 第2段，引用[8,9]）

  - **[L1]** 训练后的形态、细胞和代谢适应具有训练模式特异性；力量/爆发/冲刺运动员表现为肌肉质量增加和短时爆发力增强，耐力运动员则不同。　（位置：1
  Introduction 第3段，引用[10]）

  - **[L1]** 训练适应的分子机制仍不清楚，信号整合、输出协调、功能冗余以及耐力或抗阻运动刺激依赖性特化机制尚属未知。　（位置：Abstract）

  - **[L1]** 在食物稀缺时，进化选择维持 myostatin 及其他调节因子，促进肌肉量减少。　（位置：1 Introduction 第1段）

  - **[L1]** 抗阻训练通常引起肌纤维横截面积明显增加，而耐力训练主要诱导线粒体生物发生和代谢重塑，提高氧化能力，且对绝对肌肉质量无显著影响。　（验证：原文未做实验验证；综述转述，引用[10]
  ｜ 位置：第1段）

  - **[L1]** 耐力与抗阻训练适应并非严格二分，存在显著重叠；未训练个体中耐力训练也可增肌，抗阻训练也可提高氧化能力。　（验证：原文未做实验验证；综述转述，引用[11,12]
  ｜ 位置：第2段）

  - **[L0]** 训练适应可用持续时间、频率、强度、特异性等原则描述，并以微周期、中周期、大周期组织以在比赛时达到性能峰值。　（位置：第2段）

  - **[L1]** 耐力运动主要由强度（如%V̇O2max、最大心率、峰值功率输出、乳酸阈/临界功率）、训练量和特异性定义，训练形式包括低中强度持续训练、HIIT（通常>80%
  HFmax）和SIT（全力或超最大努力）。　（验证：原文未做实验验证；综述转述，引用[13] ｜ 位置：第2段）

  - **[L0]** 抗阻运动由强度（常以%1RM表示）、持续时间、频率和特异性等决定，并受收缩类型、收缩速度、组间休息等影响；即使在同一范式内，具体执行和响应也可显著不同。　（位置：第2段）

  - **[L1]** 急性运动时骨骼肌分子响应由机械应力、底物和氧可用性变化、循环激素、细胞内钙浓度、代谢和氧化应激及肌肉温度等多类信号驱动，经传感器蛋白启动翻译后修饰和蛋白互作级联，最终调控转录、蛋白合成和降解。　（验证：原文未做实验验证；综述转述，引用[10]
  ｜ 位置：2 Molecular mechanisms during acute exercise 第1段）

  - **[L1]** mTORC1、AMPK和PGC-1α是运动适应研究中的关键因子；AMPK激活和PGC-1α转录常作为耐力运动成功响应指标，mTORC1激活及下游信号常用于理解抗阻运动对肌蛋白合成和肌纤维肥大的影响。　（验证：原文未做实验验证；综述转述，引用[10,14,15]
  ｜ 位置：2 Molecular mechanisms during acute exercise 第2段）

  - **[L1]** 将mTORC1、AMPK、PGC-1α等常规“标志物”作为运动适应指标可能不充分：无偏技术发现大量潜在介质/调控因子，这些因子多为短时激活且长期适应意义不明，且耐力与抗阻训练可共同激活许多传感器/效应蛋白，响应特异性机制未知。　（验证：原文未做实验验证；综述转述，引用[16–19,20,21]
  ｜ 位置：2 Molecular mechanisms during acute exercise 第2段）

  - **[L1]** 运动适应具有冗余性和替代通路，骨骼肌中可能不存在单一的“主调控因子”。　（验证：综述论述并引用[10,15]；片段未展示原始验证图号 ｜
  位置：引言第1段）

  - **[L1]** Ppargc1a/PGC-1α对急性运动或慢性耐力训练的表观基因组、转录组、蛋白质组和磷酸化蛋白质组正常反应不可或缺，但Ppargc1a消融小鼠训练后运动表现仍改善，只是低于野生型。　（验证：综述转述引用[22-25]的小鼠Ppargc1a消融训练实验；片段未展示原始图号
  ｜ 位置：引言第1段）

  - **[L1]** 运动开始前后儿茶酚胺释放通过β2-肾上腺素受体激活cAMP-PKA等信号，引发心率、呼吸、脂解、肝糖输出和肌糖原分解等全身与局部适应。　（验证：综述转述引用[10,26,27]；片段未展示原始图号
  ｜ 位置：2.1 第1段 (Fig. 2)）

  - **[L1]** GH、IGF-1/MGF和睾酮等运动诱导因子通过IGF-1R-IRS-PI3K-Akt-mTORC1和雄激素受体等促进肌肉合成代谢信号，但其训练特异性贡献机制尚不清。　（验证：综述转述引用[15,28,30-33]；片段未展示原始图号
  ｜ 位置：2.1 第2段 (Fig. 2)）

  - **[L1]** Ca2+信号通过CaMKII、钙调磷酸酶A/NFAT和MEF2等促进氧化/慢肌纤维基因程序及PGC-1α表达；CaMKKβ-AMPK轴可在无能量亏缺时被长时间低强度运动激活。　（验证：综述转述引用[10,34-37]；片段未展示原始图号
  ｜ 位置：2.2 第1段 (Fig. 2)）

  - **[L1]** Ca2+峰值幅度在糖酵解/快肌II型纤维高于氧化/慢肌I型纤维，NFAT核转位主要由低频而非高频刺激诱导，但不同运动模式与纤维类型的编码机制尚不清。　（验证：综述转述引用[38-41]；片段未展示原始图号
  ｜ 位置：2.2 第2段）

  - **[L1]** 显著肌纤维类型改变仅见于长期训练适应，而非单次急性运动。　（验证：综述论述并引用[10,41,42]；片段未展示原始图号 ｜ 位置：2.2
  第2段）

  - **[L1]** 训练可改变肌纤维类型分布，通常导致糖酵解/快缩型IIX纤维相对丰度降低。　（位置：2.2 第1段 [43–46]）

  - **[L1]** 耐力精英运动员慢肌纤维比例高，而力量/爆发力精英运动员快肌纤维更多，两种表型整体分布相反。　（位置：2.2 第1段 [10,47–49]）

  - **[L0]** 这些肌纤维分布由训练适应、遗传禀赋和其他预先决定因素决定的程度仍未知。　（位置：2.2 第1段）

  - **[L1]** 过表达PGC-1α或激活型CnA、CaMK的转基因模型中，向氧化/慢肌纤维的转变似乎被限制在约15–30%。　（位置：2.2 第1段 [50–52]）

  - **[L1]** 即使这些因子在所有肌纤维中组成型表达，也只有部分肌纤维收缩特性改变，而氧化代谢改变更明显，提示代谢与收缩纤维类型可分离。　（位置：2.2
  第1段 [53]）

  - **[L1]** 机械应力由机械激活离子通道、整合素及整合素相关蛋白等感知，可导致Ca2+内流并汇聚于mTORC1，与抗阻运动和肥大密切相关。　（位置：2.3
  第1段 [54]）

  - **[L1]** 完全功能的机械激活离子通道是偏心收缩诱导mTORC1激活所必需；FAK与整合素互作并通过mTORC1-p70S6K参与机械转导；DGKζ参与牵张依赖的mTORC1激活。　（位置：2.3
  第1段 [54–56]）

  - **[L1]** 长期卸载诱导“机械-合成代谢抵抗”，表现为运动后mTORC1下游效应器p70S6K磷酸化降低。　（位置：2.3 第1段 [54]）

  - **[L1]** MAPK包括ERK1/2、JNK和p38参与机械转导；原位实验显示ERK1/2和JNK存在张力依赖性磷酸化，偏心收缩后效应最明显。　（位置：2.3
  第1段 [57]）

  - **[L0]** 尽管耐力与抗阻运动的力学不同，许多机械感知通路在两类运动中均被激活；肌肉如何区分短时高负荷与持久低负荷机械应力仍未知。　（位置：2.3 第1段）

  - **[L1]** 长时间肌肉收缩增加ROS/RNS产生，由此产生的氧化应激在训练适应中起关键作用。　（位置：2.4 第1段 [59]）

  - **[L1]** 收缩肌纤维中nNOS是NO的主要贡献者；NOX2是肌肉收缩过程中ROS的主要来源，NOX4主要贡献基础ROS。　（位置：2.4 第1段 [10,59]）

  - **[L1]** 运动诱导的ROS产生增加呈强度和持续时间依赖性，并受肌肉温度影响；最适ROS浓度是最大力生成所需。　（位置：2.4 第1段 [59]）

  - **[L1]** ROS激活p38 MAPK、ERK1/2和JNK及下游转录靶点，并通过KEAP1/NRF2/ARE促进抗氧化系统，还可诱导NRF1和PGC-1α。　（位置：2.4
  第1段 [10,60]）

  - **[L1]** ROS促进NF-κB、HSF1和AP-1转录活性；规律训练增加抗氧化酶并提高肌肉对氧化应激损伤的抵抗力；ROS激活Akt-mTORC1，可能参与肌纤维肥大。　（位置：2.4
  第1段 [10,59]）

  - **[L1]** 耐力训练和抗阻训练均可提高抗氧化酶水平。　（位置：2.5前段/抗氧化适应段；引用[61]）

  - **[L1]** 运动增加细胞ADP:ATP与AMP:ATP比值；AMP结合AMPK γ亚基并经LKB1磷酸化激活AMPK，而糖原结合AMPK β亚基抑制AMPK；长时间运动糖原下降可解除抑制并增强AMPK活性。　（位置：2.5
  Metabolic signaling；引用[35]）

  - **[L1]** AMPK促进ATP生成并抑制合成代谢：促进葡萄糖和脂肪酸摄取/利用，经自噬和泛素-蛋白酶体途径增加蛋白降解，并通过PGC-1α磷酸化和转录诱导促进分解代谢；同时抑制mTORC1和糖原合成酶。　（位置：2.5
  Metabolic signaling；引用[35,62]）

  - **[L1]** AMPK对mTORC1的抑制被视为合成代谢向分解代谢转换的调控枢纽，可能解释耐力训练对抗阻训练的干扰，即AMPK激活削弱依赖mTORC1的肌肉蛋白合成和肌纤维肥大。　（位置：2.5
  Metabolic signaling；引用[35,63]）

  - **[L1]** 大鼠离体肌肉高频刺激特异性激活Akt-mTORC1，低频刺激激活AMPK-PGC-1α；据此提出“AMPK-Akt master switch”可能决定训练特异性。　（位置：2.5
  Metabolic signaling；引用[63]）

  - **[L1]** 真实体内运动反应更复杂：AMPK可在≥60% VO2max运动时激活，也可在极低强度至力竭、HIIT及抗阻运动后激活；耐力与抗阻运动后mTORC1、p70S6K和AMPK磷酸化可同时升高，且不依赖训练状态。　（位置：2.5
  Metabolic signaling；引用[15,16,35,64]；[21]）

  - **[L1]** 线粒体和肌原纤维分数合成率对训练模式有特异性：线粒体分数合成率在未训练者由抗阻和耐力运动增强，在训练者仅由耐力运动增强；肌原纤维分数合成率仅由抗阻运动增强。　（位置：2.5
  Metabolic signaling；引用[21]）

  - **[L1]** 单次抗阻运动比单次耐力运动引起更大的基因表达变化，提示抗阻运动造成更高程度扰动。　（位置：2.6；Fig.3；引用[20,67]）

  - **[L1]** 抗阻运动中离心收缩成分可能解释更大的转录反应：下坡跑（离心为主）比上坡跑（向心为主）在运动后4小时促进至少两倍的基因转录。　（位置：2.6；引用[68]）

  - **[L1]** PGC-1α是耐力训练适应的调控枢纽，通过共激活多种转录因子协调广泛基因程序。　（位置：2.6；引用[10,70–72]）

  - **[L1]** PGC-1α共激活NRF1和NRF2促进核编码线粒体基因及TFAM转录，TFAM随后进入线粒体控制线粒体编码基因转录。　（位置：2.6；引用[73]）

  - **[L1]** PGC-1α与ERRα、PPARs、MEF2、NRF2/NFE2L2等相互作用，协调线粒体生物发生、血管生成、脂肪酸氧化、葡萄糖摄取、纤维类型决定、神经肌肉接头和ROS解毒。　（位置：2.6；引用[10,71,73]）

  - **[L1]** 骨骼肌PGC-1α升高足以诱导耐力训练表型；特异性基因敲除导致病理失活相关不良结局及非生理训练适应。　（位置：2.6；引用[50,75]；[23,76]；[22,27,77]）

  - **[L1]** PGC-1α的转录调控呈运动强度依赖：高强度运动（80% VO2max）后3小时增加约10倍，低强度运动（40% VO2max）后增加约4倍。　（位置：2.6；引用[78]）

  - **[L1]** 抗阻运动也触发PGC-1α表达显著增加，尽管PGC-1α主要与耐力训练适应相关。　（位置：2.6；引用[20,67]）

  - **[L1]** 单次运动后PGC-1α以及JUNB、FOS、EGR1、ATF3、MAFF、NR4As等即刻早期基因和HSPA1A、DNAJA4等热应激相关基因在两种运动模式中均高诱导。　（位置：2.6；引用[18,20,67]）

  - **[L0]** 控制运动适应的分子机制仍了解不足，尤其不同训练模式如何指定细胞、形态和功能变化尚不清楚。　（位置：2.5末段）

  - **[L1]** 急性耐力运动与抗阻运动在未训练骨骼肌中引起显著重叠的转录反应，主要由机械、能量、氧化还原、热、蛋白稳态或氧扰动等一般应激反应驱动。　（位置：第1段/Fig.3）

  - **[L1]** 运动后基因上调数量较多且共性较强，而基因下调更具训练模式特异性；单次耐力运动后约60%的下调基因是耐力运动特异的。　（位置：第1段/Fig.3）

  - **[L1]** 抗阻运动引起的转录变化数量更多，且更多基因是抗阻运动特异性的。　（位置：第1段/Fig.3）

  - **[L1]** 重复运动刺激诱导肌肉适应，表现为运动性肌肉损伤和酸痛症状减轻，即“重复回合效应”，并提示肌肉韧性与修复再生能力增强。　（位置：第3节首段）

  - **[L1]** 经典训练适应模型认为训练肌肉对急性运动的转录反应幅度降低，但该模型主要基于有限数据（如PGC-1α），不能全面描述训练引起的定性和定量变化。　（位置：第3节）

  - **[L1]** 休息状态下，耐力训练运动员骨骼肌蛋白质组改变远多于抗阻训练者（约700–900个蛋白 vs 9个蛋白），且大量差异蛋白参与氧化磷酸化。　（位置：第3.1节/Fig.4A）

  - **[L0]** 抗阻训练中蛋白质组变化可能被低估：纤维肥大可能主要由基础表达蛋白的定量变化驱动，等量上样质谱难以检测；耐力训练肌肉则更多表现为细胞组成改变，导致更多差异蛋白。　（位置：第3.1节）

  - **[L1]** 有氧呼吸/TCA循环相关蛋白的适应在小鼠4周训练或人5周HIIT后已出现；mtDNA和CS活性在仅2周HIIT后即升高。　（位置：3.1
  第1段；引用文献[8,22,91,79]）

  - **[L1]** 耐力运动员静息肌肉存在广泛的蛋白质组重塑，提示训练状态具有独特分子特征；耐力运动员的转录变化多于力量运动员。　（位置：3.1 第2段；Fig.4A；引用文献[9,20]）

  - **[L1]** 训练肌肉静息时转录组变化远少于蛋白质组变化；数周中等持续训练或HIIT后少于2%转录组改变，长期训练者与未训练者相比也仅有少量基因改变。　（位置：3.1
  第2段；引用文献[22,92,93,94,95]）

  - **[L1]** 训练肌肉静息的多数转录本变化幅度较小，倍数变化常低于1.5，因此训练与未训练肌肉静息状态不具有大的转录组指纹差异。　（位置：3.1 第2段；引用文献[9,98]）

  - **[L1]** 耐力训练肌肉静息时改变的基因与能量代谢、细胞呼吸和慢肌纤维相关，而抗阻训练肌肉转录组差异涉及ECM重塑。　（位置：3.1 第2段；引用文献[18,22,95]）

  - **[L1]** 训练肌肉中改变的蛋白质与受调控基因之间重叠极少，提示基因表达与蛋白质水平脱节，可能涉及翻译后修饰、蛋白质稳定性及额外转录支持。　（位置：3.1
  第3段；引用文献[8,22,90]）

  - **[L1]** 耐力与抗阻训练均产生不同的表观遗传谱；训练肌肉存在差异甲基化区域，这些表观标记相对稳定，不同于急性运动引起的短暂修饰，并可能参与肌肉记忆。　（位置：3.1
  第4段；Fig.4A；引用文献[22,99,100,102]）

  - **[L1]** 耐力训练后长期停训研究未能一致证明肌肉记忆增强表现或CS活性；抗阻训练证据更有力，7周停训后肌力增幅更大并伴随表观遗传景观改变。　（位置：3.1
  第4段；引用文献[99,103]）

  - **[L1]** 亚极量运动后最显著的转录变化通常出现在运动后3小时，与运动模式或训练状态无关。　（位置：3.2 第1段；引用文献[20]）

  - **[L1]** 相同绝对强度急性耐力运动后，训练者或2周训练后的个体转录变化少于未训练者，提示训练者亚极量耐力运动扰动减弱。　（位置：3.2 第1段；Figs.4B
  & 5；引用文献[20,68,93]）

  - **[L1]** 相同相对强度下训练者与未训练者代谢挑战不同：未训练者约65% VO2max时血乳酸升高，而训练者在相同相对强度下血乳酸保持低水平；运动后AMPK活性增加在耐力运动员中减弱。　（位置：3.2
  第2段；引用文献[64,104]）

  - **[L1]** 急性抗阻运动未表现耐力运动中训练者转录反应减弱的模式：力量运动员在膝伸运动后3小时转录改变相似或略多，神经刺激抗阻运动中运动后1小时受调控基因数在2、10、20、30天保持相对一致。　（位置：3.2
  第3段；Figs.4B & 5；引用文献[20,105]）

  - **[L1]** 亚极限运动下，训练有素个体的转录反应并非简单减弱；训练肌肉的基因数量变化较少，但幅度变化复杂，存在抑制、放大和不变。　（验证：综述转述，引用[93,20]等；原文片段未展示湿实验验证
  ｜ 位置：3.2节 / Fig.5）

  - **[L1]** 力竭运动时，训练肌肉的转录反应幅度不减弱，总反应可能更大，尤其下调基因更多；训练肌肉反应更快，可能与静息表观遗传标记的持续priming有关。　（验证：综述转述，引用[22]；原文片段未展示湿实验验证
  ｜ 位置：3.3节 / Figs.4C & 5）

  - **[L1]** 训练状态导致转录反应定性特化：耐力训练运动员中仅约55%上调基因和30%下调基因与未训练者共享；力竭运动模型中仅约三分之一上调基因共享；抗阻运动受训练状态影响较小。　（验证：综述转述，引用[20,22]；原文片段未展示湿实验验证
  ｜ 位置：3.4节 / Fig.3）

  - **[L1]** 训练肌肉表现出对反复运动刺激的适应，可能导致对相应扰动的感知、解释和反应发生改变。　（验证：综述转述，引用[20,22,93]；原文片段未展示湿实验验证
  ｜ 位置：3.4节）

  - **[L1]** 骨骼肌具有高度异质性，小鼠中仅40–60%细胞核来自肌纤维，快肌/糖酵解肌中该比例高于慢肌/氧化肌。　（验证：综述转述，引用[108]；本文未做湿实验
  ｜ 位置：Section 4 第1段）

  - **[L1]** 非肌纤维核来自至少10种不同细胞类型，常包含多个亚群；bulk RNA-seq无法区分不同细胞类型对运动的反应。　（验证：综述转述，引用[107–113]；本文未做湿实验
  ｜ 位置：Section 4 第1段）

  - **[L1]** 耐力训练增加产生IL-13的组织驻留2型固有淋巴样细胞比例，该细胞参与训练诱导的氧化型肌表型。　（验证：综述转述，引用[114]；本文未做湿实验
  ｜ 位置：Section 4 第1段）

  - **[L1]** 调节性T细胞参与肌肉生理训练适应，包括耐力表现以及线粒体形态和功能。　（验证：综述转述，引用[115]；本文未做湿实验 ｜ 位置：Section
  4 第1段）

  - **[L1]** 运动可促使特定细胞群偏移，如毛细血管内皮细胞向具有不同血管生成潜能的亚群增加，从而促进组织血管化。　（验证：综述转述，引用[116]；本文未做湿实验
  ｜ 位置：Section 4 第1段）

  - **[L1]** 用单细胞或单核数据反卷积bulk RNA-seq可预测不同细胞类型对整体基因表达反应的贡献，但该分析仅具预测性且显著依赖参考数据。　（验证：综述转述，引用[22]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** 耐力训练中ECM重塑和轴突导向相关基因预测主要表达于肌腱细胞、纤维脂肪祖细胞和胶质细胞，肌纤维中较少。　（验证：综述转述，引用[22]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** 训练后静息肌肉中内皮细胞、平滑肌细胞和单核细胞转录组变化最显著；急性全力冲刺后3 h间充质细胞（可能为FAPs）变化最大，富集再生和伤口愈合相关基因，随后为内皮细胞基因调控。　（验证：综述转述，引用[117,118]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** scRNA-seq与bulk RNA-seq中仅25%的调控基因重叠，提示反卷积挑战以及bulk和scRNA-seq方法的局限。　（验证：综述转述，引用[118]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** 骨骼肌scRNA-seq受解离应激影响，未扰动卫星细胞出现即时早期基因高表达，而单分子RNA荧光原位杂交在冷冻切片中未检测到这些基因，提示常规解离方案诱导应激反应。　（验证：综述转述，引用[119]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** snRNA-seq可减轻解离偏差并同时纳入肌核，因此可能更适合分析急性运动反应；scRNA-seq与snRNA-seq研究结果存在差异。　（验证：综述转述，引用[120,121]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L1]** 亚极限运动40 min（70% V̇O2max）诱导肌核和LUM+ FAP亚群最显著转录变化，FAPs调控基因与轴突导向相关，与bulk
  RNA-seq反卷积预测一致。　（验证：综述转述，引用[121,22]；本文未做湿实验 ｜ 位置：Section 4 第2段）

  - **[L1]** snRNA-seq显示不同肌核群体对运动刺激反应不同：快肌纤维肌核比慢肌纤维肌核变化更多，且运动后与未扰动肌核之间存在转录分歧。　（验证：综述转述，引用[121]；本文未做湿实验
  ｜ 位置：Section 4 第2段）

  - **[L0]** 目前仍缺乏对骨骼肌急性运动与慢性训练多细胞反应的系统全面分析，未来需利用scRNA-seq/snRNA-seq建立运动系统级图谱。　（位置：Section
  4 末段/Section 5）

  - **[L1]** 骨骼肌可塑性远比现有模型复杂，训练范式特异性及短暂信号参与如何整合为长期训练适应的机制仍不清楚。　（位置：Discussion 第1段 /
  In summary）

  - **[L1]** mTORC1在耐力和抗阻训练中均有激活报道，但雷帕霉素抑制mTORC1的后果主要在抗阻试验中测试，耐力适应尤其血管化也可能涉及mTORC1。　（位置：Discussion
  第1段）

  - **[L1]** 训练适应不能由运动习惯化后反应随时间衰减的简单模型解释；急性运动后训练肌与未训练肌之间存在显著定性和定量基因表达差异。　（位置：Discussion
  第1段）

  - **[L1]** 训练强度、负荷、模式、训练状态、性别、年龄、肌纤维类型、活检时间及慢性训练背景均显著影响训练适应相关基因表达和结果。　（位置：Discussion
  第1段 / Fig.6）

  - **[L1]** 应避免仅围绕PGC-1α、AMPK或mTORC1等“常见嫌疑分子”在有限背景下研究，而应采用更广泛的分子机制视角。　（位置：Discussion
  第1段）

  - **[L1]** 实验设计需精确描述参与者和训练方案的多参数特征；人体肌肉活检常取自股外侧肌，采样位置和重复采样可引入变异。　（位置：Discussion
  第1段）

  - **[L1]** 需统一理解急性运动、慢性训练、静息/未扰动状态和训练状态效应对实验解释的影响；上次运动的持续效应可混淆数天，静息窗口和detraining机制仍待确定。　（位置：Discussion
  第1段）

  - **[L1]** scRNA-seq/snRNA-seq结合空间技术将有助于理解运动等背景下骨骼肌组织多细胞串扰动态。　（位置：Discussion 第1段）

  - **[L1]** 多组学整合有助于整合表观遗传、转录组、蛋白质组和磷酸化蛋白质组数据，解释转录本与蛋白质变化之间的脱节。　（位置：Discussion 第1段）

  - **[L1]** 尽管已知大量分子传感器、调节因子和效应器，对骨骼肌急性运动反应及长期训练适应的分子机制理解仍很有限。　（位置：In summary）

  - **[L1]** 耐力与抗阻运动的急性转录反应存在大量重叠，训练特异性产生机制尚不清楚；随训练进展转录反应可能更特异且噪音更少。　（位置：In summary
  / Fig.3 / Fig.6）

  - **[L2]** 大型人体运动试验meta分析提示，许多“训练常识”因素可能次要，例如耐力运动无论强度均有心肺获益，以及高低负荷抗阻训练在某些参数上结果相当。　（验证：大型人体运动试验meta分析
  [137,138] ｜ 位置：In summary）

  - **[L1]** 肌肉生长是否贡献抗阻训练力量增长、卫星细胞是否参与肥大、最佳运动类型以及耐力强度与容量对线粒体含量的影响等基础问题仍有争议。　（位置：In
  summary）

  - **[L1]** 应设计并实施基于科学、个性化且安全的训练策略，并证明其对患者、普通人群和运动员有效。　（位置：文末（Funding 前））

