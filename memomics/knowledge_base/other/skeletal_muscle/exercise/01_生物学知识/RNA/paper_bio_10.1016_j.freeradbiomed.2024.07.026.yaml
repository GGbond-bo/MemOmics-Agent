  ## 基因 Marker

  - MSTN：skeletal muscle，na，文中称为 myostatin，在食物稀缺时经进化选择维持，促进肌肉量减少；未给出表达方向或实验验证。

  - AMPK：骨骼肌细胞，up，耐力运动急性响应中蛋白激活增加，常作为耐力运动成功应答指标；抗阻运动也可激活。

  - PPARGC1A：骨骼肌细胞，up，PGC-1α基因转录增加，参与代谢过程，常作为耐力运动应答指标；抗阻运动也可激活。

  - MTOR：骨骼肌细胞，up，mTORC1复合物激活和下游信号增强，参与抗阻运动诱导的肌肉蛋白合成和肌纤维肥大；耐力运动也可激活。

  - Ppargc1a/PGC-1α：骨骼肌，up，运动、β2-肾上腺素刺激、CaMKII/AMPK-CREB/ATF2、CnA/MEF2等促进其表达，参与氧化/慢肌程序；Ppargc1a消融削弱分子重编程但训练仍改善表现

  - AMPK：骨骼肌，up，CaMKKβ在长时间低强度运动中可提高AMPK活性，并与CaMKII促进PGC-1α表达

  - mTORC1：骨骼肌，up，IGF-1/IRS/PI3K/Akt轴激活mTORC1，促进蛋白质合成

  - ADRB2/β2-adrenergic receptor：骨骼肌，na，儿茶酚胺激动β2受体，激活cAMP-PKA等信号

  - PKA：骨骼肌，up，cAMP-PKA轴激活，支持收缩和糖原分解

  - glycogen phosphorylase：骨骼肌，up，被激活后增强糖原分解

  - GH：肝脏/骨骼肌/全身，up，运动后升高，刺激肝脏IGF-1产生并促进肌肉合成信号；高负荷、短休息、大容量可显著升高

  - IGF-1：肝脏/骨骼肌，up，运动后升高，收缩肌也合成，自分泌/旁分泌激活IGF-1R

  - MGF：骨骼肌，up，IGF-1剪接异构体，收缩肌合成，发挥自分泌/旁分泌合成效应

  - IGF-1 receptor：骨骼肌，up，介导IGF-1/MGF信号，激活IRS-PI3K-Akt-mTORC1

  - IRS：骨骼肌，na，IGF-1R下游衔接，激活PI3K

  - PI3K：骨骼肌，up，IGF-1/IRS下游，激活Akt

  - Akt/PKB：骨骼肌，up，促进蛋白质合成并抑制FoxO介导的蛋白降解

  - FoxO：骨骼肌，down，Akt-FoxO介导的蛋白降解受抑制，使肌蛋白稳态偏向合成

  - androgen receptor：骨骼肌，up，睾酮结合后促进合成代谢通路

  - troponin C：骨骼肌，na，Ca2+结合触发肌动蛋白-肌球蛋白相互作用

  - calmodulin：骨骼肌，na，Ca2+结合钙调蛋白激活CaMKII和CnA

  - CaMKII：骨骼肌，up，激活后通过CREB/ATF2促进PGC-1α表达

  - calcineurin A (CnA)：骨骼肌，up，激活NFAT并支持MEF2，促进氧化/慢肌程序；药理抑制影响动物模型肌肥大

  - NFAT：骨骼肌，up，CnA磷酸化激活后核转位，促进氧化/慢肌基因程序；低频刺激更易诱导

  - MEF2：骨骼肌，up，被CnA/CaMKII参与激活，诱导PGC-1α和氧化/慢肌程序

  - CaMKKβ：骨骼肌，up，长时间低强度运动中介导Ca2+依赖的AMPK激活

  - CREB：骨骼肌，up，转录活性增强，促进PGC-1α表达

  - ATF2：骨骼肌，up，激活后促进PGC-1α表达

  - PPARGC1A：骨骼肌纤维，up，过表达PGC-1α可促进向氧化/慢肌纤维转变，但相对分布转变约限制在15–30%。

  - CnA：骨骼肌纤维，up，激活型CnA在转基因模型中促进向氧化/慢肌纤维转变，转变比例约15–30%。

  - CaMK：骨骼肌纤维，up，激活型CaMK在转基因模型中促进向氧化/慢肌纤维转变，转变比例约15–30%。

  - FAK：骨骼肌纤维，up，FAK与整合素互作，经mTORC1-p70S6K参与机械转导；耐力与抗阻运动后FAK磷酸化增强。

  - ERK1/2：骨骼肌纤维，up，参与机械转导；张力依赖性磷酸化，偏心收缩后最明显，耐力、冲刺和抗阻运动后也可升高。

  - JNK：骨骼肌纤维，up，参与机械转导；张力依赖性磷酸化，偏心收缩后最明显。

  - p38 MAPK：骨骼肌纤维，up，参与机械转导，并可被ROS激活。

  - RPS6KB1：骨骼肌纤维，down，长期卸载诱导机械-合成代谢抵抗，运动后p70S6K磷酸化降低；耐力与抗阻运动后其磷酸化可升高。

  - NFE2L2：骨骼肌纤维，up，ROS促使NRF2从KEAP1释放，核转位后结合ARE增强抗氧化系统基因表达。

  - KEAP1：骨骼肌纤维，na，氧化还原敏感蛋白，结合并抑制NRF2，ROS作用下释放NRF2。

  - NRF1：骨骼肌纤维，up，NRF2诱导NRF1转录，参与氧化代谢和底物利用调控。

  - NFKB1：骨骼肌纤维，up，ROS促进NF-κB转录活性，并参与抗氧化酶转录。

  - HSF1：骨骼肌纤维，up，ROS促进HSF1转录活性，主要触发一般应激和细胞保护反应。

  - AP-1：骨骼肌纤维，up，ROS促进AP-1转录活性，主要触发一般应激和细胞保护反应。

  - NOS1：骨骼肌纤维，na，nNOS是收缩肌纤维中NO的主要贡献者。

  - CYBB：骨骼肌纤维，up，NOX2是肌肉收缩过程中ROS的主要来源。

  - NOX4：骨骼肌纤维，na，NOX4主要贡献基础ROS产生。

  - AMPK：骨骼肌细胞，up，运动/低糖原时经LKB1磷酸化激活；糖原结合β亚基抑制其活性

  - LKB1：骨骼肌细胞，na，上游激酶，磷酸化并激活AMPK

  - PGC-1α：骨骼肌细胞，up，运动后转录诱导，耐力适应调控枢纽，表达呈运动强度依赖

  - mTORC1：骨骼肌细胞，up，抗阻和耐力运动后磷酸化可升高；被AMPK抑制

  - p70S6K：骨骼肌细胞，up，抗阻和耐力运动后磷酸化可同时升高

  - Akt：骨骼肌细胞，up，高频刺激激活Akt-mTORC1通路

  - 糖原合成酶：骨骼肌细胞，down，被AMPK抑制，合成代谢受限

  - NRF1：骨骼肌细胞，up，被PGC-1α共激活，促进核编码线粒体基因和TFAM转录

  - NRF2/GABP：骨骼肌细胞，up，被PGC-1α共激活，参与线粒体基因程序

  - TFAM：骨骼肌细胞，up，转录受PGC-1α/NRF1/NRF2促进，进入线粒体控制线粒体编码基因转录

  - ERRα：骨骼肌细胞，na，PGC-1α相互作用伙伴，协调线粒体生物发生等

  - PPARs：骨骼肌细胞，na，PGC-1α相互作用伙伴，参与脂肪酸氧化等

  - MEF2：骨骼肌细胞，na，PGC-1α相互作用伙伴，参与肌纤维类型决定等

  - NRF2/NFE2L2：骨骼肌细胞，na，PGC-1α相互作用伙伴，参与ROS解毒

  - JUNB：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - FOS：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - EGR1：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - ATF3：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - MAFF：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - NR4As：骨骼肌细胞，up，即刻早期基因，两种运动模式均高诱导

  - HSPA1A：骨骼肌细胞，up，热应激相关基因，两种运动模式均高诱导

  - DNAJA4：骨骼肌细胞，up，热应激相关基因，两种运动模式均高诱导

  - PGC-1α (PPARGC1A)：骨骼肌细胞，na，训练状态和运动模式可影响急性运动后表达；7次HIIT后衰减模型基于PGC-1α，但其他8个基因未显示相同模式；急性耐力运动后训练肌肉中表达可加剧。

  - CS：骨骼肌，up，HIIT 2周后CS活性升高，线粒体适应

  - IL13：2型固有淋巴样细胞(ILC2)，up，耐力训练增加产生IL-13的组织驻留ILC2比例，参与训练诱导的氧化型肌表型 [114]

  - LUM：纤维脂肪祖细胞(FAPs)，na，LUM+ FAP亚群在亚极限运动后转录变化最显著，相关基因富集轴突导向 [121]

  - mTORC1：骨骼肌细胞，up，在耐力和抗阻训练中均有激活报道；抑制后果主要在抗阻试验中测试，耐力适应尤其血管化可能涉及

  - PGC-1α：骨骼肌细胞，na，耐力训练中的常规研究对象，但证据显示其参与范围更广

  - AMPK：骨骼肌细胞，na，耐力训练中的常规研究对象，但证据显示其参与范围更广

  - PPARGC1A/PGC-1α：骨骼肌/慢肌纤维，na，驱动慢肌纤维形成、线粒体生物发生、血管生成、运动表现和糖稳态；运动强度调节其 mRNA 丰度。[50][70-79]

  - NFATc1：骨骼肌，na，核质穿梭受神经活动控制。[40]

  - CAMK：骨骼肌，na，调节线粒体生物发生。[52]

  - DGKZ：骨骼肌，na，DGKζ 和磷脂酸参与机械激活 mTOR 信号与肥大。[56]

  - MTOR：骨骼肌，na，机械激活 mTOR 信号与肥大；PKB-TSC2-mTOR 信号轴。[56][63]

  - MAPK：骨骼肌，na，机械转导中 MAPK 激活与张力定量相关。[57]

  - PRKAA/AMPK：骨骼肌，na，运动适应与组织保留的介导因子。[62][66]

  - AKT/PKB：骨骼肌，na，PKB-TSC2-mTOR 信号轴参与训练样电刺激适应。[63]

  - TSC2：骨骼肌，na，PKB-TSC2-mTOR 信号轴。[63]

  - MYH：骨骼肌纤维，na，肌球蛋白重链组成与力量举运动员快肌比例相关。[45]

  - PPARGC1A：骨骼肌细胞，up，运动诱导人骨骼肌中PGC-1α基因短暂转录激活（[80]）；其亚型结构与生物学功能综述（[81]）

  - HIF1A：骨骼肌细胞，na，HIF-1特征主导HIIT后人骨骼肌转录响应减弱的衰减（[93]）

  - ATF3：内皮细胞，up，运动诱导血管生成依赖代谢预处理的ATF3/4+内皮细胞（[116]）

  - ATF4：内皮细胞，up，运动诱导血管生成依赖代谢预处理的ATF3/4+内皮细胞（[116]）

  - IL13：骨骼肌/免疫微环境，up，白细胞介素-13驱动肌肉耐力运动代谢适应（[114]）

