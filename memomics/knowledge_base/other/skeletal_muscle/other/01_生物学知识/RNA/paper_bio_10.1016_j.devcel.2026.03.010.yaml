content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L2]** 本文构建了小鼠肢体骨骼肌在静息、实验诱导萎缩和肥厚状态下的单核/单细胞转录组图谱，并结合空间图谱揭示肌肉驻留细胞群和肌纤维类型特异性转录反应的变化。　（验证：实验诱导小鼠萎缩/肥厚模型，单核/单细胞转录组、空间转录组及高分辨率3D成像（SUMMARY）
  ｜ 位置：SUMMARY）

  - **[L2]** 神经肌肉接头在萎缩和肥厚状态下发生广泛重塑，出现与状态相关的特化突触肌核（SynM）和终末施万细胞（tSC）。　（验证：高分辨率3D成像和空间转录组学在组织水平确认；去神经和运动人肌肉中观察到类似NMJ改变（SUMMARY）
  ｜ 位置：SUMMARY）

  - **[L2]** 去神经和运动人肌肉中也可见类似神经肌肉接头改变，提示该图谱对人类肌肉可塑性研究及肌病治疗靶点发现具有转化意义。　（验证：人去神经和运动肌肉样本中观察到类似NMJ改变（SUMMARY）
  ｜ 位置：SUMMARY）

  - **[L1]** 骨骼肌驻留细胞间通讯对维持肌肉稳态及协调损伤、机械负荷或神经输入丧失的反应至关重要。　（位置：Introduction 第1段）

  - **[L2]** 该研究通过全肌肉snRNA-seq和FACS富集的scRNA-seq，构建了覆盖静息、去神经萎缩和功能过载肥大状态的骨骼肌转录组图谱。　（验证：小鼠跖肌basal/Den/OVL模型；snRNA-seq获得75,343个核，scRNA-seq获得19,879个细胞；Fig.1C–1F,
  Fig.S1E–S1H ｜ 位置：Results 第2段 / Fig.1C–1F, Fig.S1）

  - **[L2]** 去神经导致小鼠跖肌质量和肌纤维横截面积下降，功能过载导致增加，7天时出现显著变化。　（验证：小鼠Den/OVL模型3或7天；肌肉质量Fig.1B，CSA
  Fig.S1A–S1B ｜ 位置：Results 第1段 / Fig.1B, Fig.S1A–S1B）

  - **[L2]** snRNA-seq无监督聚类鉴定了骨骼肌主要细胞类型以及NMJ和MTJ两个特化肌核域。　（验证：75,343个核的无监督聚类与canonical
  lineage markers注释；Fig.1C–1F ｜ 位置：Results 第2段 / Fig.1C–1F）

  - **[L2]** 功能过载后MuSCs比例增加并呈现增殖/分化状态，3天时免疫细胞更丰富；去神经后肌核减少但MuSCs不扩增，FAPs比例增加。　（验证：sn/scRNA-seq细胞比例与差异表达分析；Fig.1F,
  Fig.S2A–S2B, Table S1 ｜ 位置：Results 第3段 / Fig.1F, Fig.S2）

  - **[L2]** 去神经肌肉中Schwann细胞发生转录重编程并上调轴突再生/迁移相关基因；功能过载中MuSCs、FAPs和ECs分别上调增殖/分化、ECM/机械感知和血管生成相关基因。　（验证：snRNA-seq差异表达分析；Fig.S1J–S1K,
  Table S1 ｜ 位置：Results 第4段 / Fig.S1J–S1K）

  - **[L2]** 去神经MuSCs停留于G1期并表达Islr及ECM相关基因Dcn、Col8a1，提示轴突丢失触发独特转录程序。　（验证：sn/scRNA-seq细胞周期与差异表达分析；Fig.S2A–S2B,
  Table S1 ｜ 位置：Results 第4段 / Fig.S2A–S2B）

  - **[L2]** 41,240个肌核在肌肉萎缩和生长条件下发生显著转录变化，UMAP嵌入尤其萎缩状态明显偏移。　（验证：snRNA-seq聚类与UMAP分析，图1D
  ｜ 位置：Results 第1段 / Figure 1D）

  - **[L2]** Den肌肉中快缩糖酵解IIb（Myh4+）和IIx（Myh1+）肌核比例在7天降至18%，IIa（Myh2+）肌核比例相对稳定。　（验证：snRNA-seq肌核亚群比例分析，图2C、图S2C
  ｜ 位置：Results 第1段 / Figure 2C, Figure S2C）

  - **[L2]** 肌核聚类揭示Myonuc1-3三个亚群，主要见于Den和OVL条件，在未扰动基础状态中极少。　（验证：重新聚类与亚群鉴定，图2A-2C；Table
  S2 ｜ 位置：Results 第2段 / Figure 2A-2C）

  - **[L2]** Myonuc1可能代表去神经支配肌核，表现为肌球蛋白转录本下调和去神经标志物上调，并激活肌肉消耗相关信号。　（验证：snRNA-seq差异表达与通路富集，图2D-2E；Table
  S2，并与既往snRNA-seq去神经亚群一致 ｜ 位置：Results 第2段 / Figure 2D-2E, Table S2）

  - **[L2]** Myonuc2和Myonuc3在OVL中增加，富集肌核融合和肌肉适应相关基因。　（验证：snRNA-seq差异表达分析，图2D-2E、图S2D-S2E；Table
  S2 ｜ 位置：Results 第2段 / Figure 2D-2E, Figure S2D-S2E）

  - **[L2]** Den肌核富集萎缩相关基因，OVL肌核富集肥厚相关基因，但两种条件均导致NMJ分子重塑。　（验证：snRNA-seq萎缩/肥厚评分与通路富集，图2F-2G、图S2G；Table
  S2 ｜ 位置：Results 第3段 / Figure 2F-2G, Figure S2G）

  - **[L2]** 突触肌核SynM仅占约1%总肌核，Den来源SynM在UMAP空间与基础及OVL来源SynM分离。　（验证：snRNA-seq SynM再聚类与UMAP分析，图3A、图S3A；Table
  S3 ｜ 位置：Results 第4段 / Figure 3A, Figure S3A）

  - **[L2]** Den SynM富集萎缩相关基因，OVL SynM富集生长相关转录本，与肌肉质量下降或增加一致。　（验证：snRNA-seq萎缩/肥厚评分，图S3B；肌肉质量数据见图1B
  ｜ 位置：Results 第5段 / Figure S3B, Figure 1B）

  - **[L2]** Den SynM下调肌肉收缩、钙稳态和肌节结构相关基因，OVL SynM富集生长、氨基酸代谢、Wnt信号和神经元迁移相关基因。　（验证：功能富集分析，图3B-3C、图S3C；Table
  S3 ｜ 位置：Results 第6段 / Figure 3B-3C, Figure S3C）

  - **[L2]** Den SynM具有独特转录变化，包括Spp1和Vat1l上调以及Chrne和Colq下调；OVL SynM没有独特调控基因集，但Col13a1和Dcaf8呈上调趋势。　（验证：SynM差异表达分析，图S3D；Table
  S3 ｜ 位置：Results 第7段 / Figure S3D, Table S3）

  - **[L2]** Den肌肉中超过92%的NMJ缺乏可检测的轴突终末接触，平均神经-AChR重叠仅7%，表明NMJ结构重塑。　（验证：CUBIC组织透明化+免疫荧光+高分辨3D全组织共聚焦成像，图3D-3E、图S3E
  ｜ 位置：Results 第8段 / Figure 3D-3E, Figure S3E）

  - **[L2]** 该研究构建了首个同时整合同一肌肉类型中肌萎缩与肌生长状态的骨骼肌适应综合图谱，并以细胞和分子分辨率揭示神经与机械应激下的动态变化。　（验证：结合单核/单细胞转录组、空间转录组与3D成像，并在小鼠去神经/过载模型及人肌组织中进行验证（Discussion
  第1、4段；Fig.6J/K） ｜ 位置：Discussion 第1段、第4段；Fig.6J/K）

  - **[L2]** 去神经与过载诱导NMJ前/后成分协调且相反的适应：SynM去神经后上调Scn5a，肥大时上调Gpc4；突触前SCs出现去神经特异激活的tSC样/aSC1群体。　（验证：单核/单细胞转录组、空间转录组与3D成像；RNAscope验证了萎缩NMJ处Inhba+
  tSCs（Discussion 第2、5段） ｜ 位置：Discussion 第2段、第5段）

  - **[L2]** 去神经肌肉中特异性出现NMJ定位的tSC样/aSC1亚群，表达activin信号组分，提示促萎缩作用；Inhba在长期去神经tSCs中持续表达。　（验证：RNAscope验证Inhba+
  tSCs存在于萎缩NMJ（Discussion 第5段） ｜ 位置：Discussion 第5段）

  - **[L1]** CellChat计算建模提示激活tSCs(aSC1)与去神经SynM的通讯主要由TGFβ/activin信号介导，可能触发肌肉消耗；但TGFβ信号增强尚未直接证明。　（验证：CellChat计算建模；原文指出该增强仍有待直接证明（Discussion
  第5段） ｜ 位置：Discussion 第5段）

  - **[L1]** 肌肉萎缩可能起源于NMJ：突触下核接收来自邻近活化Schwann细胞的促萎缩信号。　（验证：基于CellChat预测和RNAscope存在性验证，但直接证明待完成（Discussion
  第5段） ｜ 位置：Discussion 第5段）

  - **[L2]** 小鼠NMJ发现可在人类周围神经病（PAN相关神经病）和脊髓损伤早期患者肌肉中得到验证，提示NMJ信号轴为治疗靶点；人bulk RNA-seq中趋势一致且对性别差异稳健。　（验证：人PAN神经病患者及脊髓损伤患者肌肉样本；人bulk
  RNA-seq队列（Discussion 第6段；Fig.6J/K） ｜ 位置：Discussion 第6段；Fig.6J/K）

  - **[L1]** 该研究资源可用于研究调节神经肌肉接头功能和对抗肌肉萎缩的治疗策略。　（位置：RESOURCE AVAILABILITY 前一句）

  - **[L2]** 部分发现经免疫荧光或 RNAscope 验证。　（验证：原文说明部分发现通过免疫荧光或 RNAscope 验证；片段未提供具体图号 ｜ 位置：Limitations
  of the Study）

  - **[L2]** 多数见解来自小鼠，但关键观察在小鼠和人样本中均得到确认，提示发现具有跨物种相关性。　（验证：原文说明关键观察在小鼠和人样本中确认；片段未提供具体图号
  ｜ 位置：Limitations of the Study）

  - **[L0]** 仍需进一步研究确定这些分子变化与肌肉可塑性的直接因果贡献。　（位置：Limitations of the Study）

  - **[L1]** 去神经支配可激活纤维脂肪生成祖细胞中的 STAT3–IL-6 信号，促进肌纤维萎缩和纤维化。　（位置：参考文献 11）

  - **[L1]** 单核转录组可揭示骨骼肌细胞的功能区室化及多核肌纤维的转录异质性。　（位置：参考文献 6, 7）

  - **[L1]** 骨骼肌单细胞/单核测序可发现新的肌肉驻留细胞群体及亚突触特异性转录本。　（位置：参考文献 5, 13）

  - **[L1]** 肌肉去神经支配促进胶质细胞与间充质细胞通过 NGFR 和 NGF 发生功能互作。　（位置：参考文献 22）

  - **[L1]** ATF3 在 Wallerian 变性过程中的胶质细胞中上调。　（位置：参考文献 23）

  - **[L1]** SPP1 通过结合 CD44 和 αvβ3 并经 PKCα 促进周围神经损伤后 Schwann 细胞增殖与存活。　（位置：参考文献 33）

  - **[L1]** Schwann 细胞中 COL20A1 缺失会改变神经肌肉接头再生和小鼠运动活动。　（位置：参考文献 29）

  - **[L1]** 胶质细胞 Wingless/Wnt 信号调节果蝇神经肌肉接头的谷氨酸受体聚集和突触生理。　（位置：参考文献 15）

  - **[L1]** Lrp4 调节发育过程中细胞信号通路的细胞外整合。　（位置：参考文献 16）

  - **[L1]** N-cadherin 通过 Slit2/3 介导的运动接触抑制指导神经再生所需的 Schwann 细胞集体迁移。　（位置：参考文献 24）

  - **[L1]** Schwann 细胞利用 TAM 受体介导的吞噬作用和自噬清除神经损伤模型中的髓鞘。　（位置：参考文献 25）

  - **[L1]** 在 SOD1 G37R ALS 小鼠模型中，神经肌肉接头胶质细胞特性与突触修复不相容。　（位置：参考文献 26）

  - **[L1]** CellChat 可用于推断和分析细胞间通讯。　（位置：参考文献 31）

  - **[L2]** 小鼠骨骼肌在萎缩和肥大过程中存在转录组图谱，揭示主要核群体及肌核异质性/状态特异性转录程序。　（验证：snRNA-seq，n=2 mice
  per condition；UMAP/气泡图/功能富集，Fig.1C–F、Fig.2A–G；肌肉重量n=19–22，Fig.1B。 ｜ 位置：Highlights；Fig.1–2）

  - **[L2]** 去神经和超负荷均引起突触肌核(SynM)转录重塑，不同SynM基因程序驱动NMJ重塑。　（验证：SynM重聚类snRNA-seq；NMJ免疫荧光/3D重建/EdU标记，n=3–6
  mice，n=36–178 NMJs，Fig.3A–L。 ｜ 位置：Highlights；Fig.3）

  - **[L1]** 去神经激活NMJ处tSCs (Inhba+)，并通过TGFβ/activin信号作用于SynM。　（位置：Highlights）

  - **[L1]** 去神经和运动人肌肉表现出相似的NMJ相关改变。　（位置：Highlights）

  - **[L2]** 空间转录组可识别萎缩和肥大肌肉中的NMJ阳性区域及突触肌核特征。　（验证：空间转录组，n=2 mice per condition；与相邻切片BTX染色重叠注释NMJ阳性spots，Fig.4A–H。
  ｜ 位置：Fig.4）

  - **[L2]** NMJ阳性空间spots呈现突触基因表达特征，包括Chrng、Chrna1、Scn5a和Gpc4的分布。　（验证：空间转录组，n=2 mice
  per condition；feature/violin plots，Fig.4E–H。 ｜ 位置：Fig.4E–H）

  - **[L2]** 去神经和过载干预后，终末施万细胞数量及其Ki67+增殖比例随时间变化，提示施万细胞对肌肉萎缩/肥大有异质性响应。　（验证：Fig.5A-C：Plp1-tdTomato小鼠plantaris免疫荧光，统计每个NMJ的tSC数（n=73–140
  NMJs）及含Ki67+ tSC的NMJ比例（n=36–68 NMJs） ｜ 位置：Fig.5A-C）

  - **[L2]** DT处理7天使Plp1iDTR小鼠基底plantaris出现NMJ碎片化，并改变肌纤维横截面积分布。　（验证：Fig.5D-G：Plp1WT和Plp1iDTR小鼠免疫荧光/组织学，统计NMJ碎片数（n=76–111
  NMJs）及肌纤维CSA频率分布 ｜ 位置：Fig.5D-G）

  - **[L2]** 整合sc/snRNA-seq鉴定出施万细胞亚群；Ajap1+和Inhba+核在NMJ中的比例及共表达模式经RNAscope验证。　（验证：Fig.5H-M：sc/snRNA-seq
  UMAP与亚群比例分析；RNAscope检测Ajap1+、Inhba+核（n=39–68 NMJs） ｜ 位置：Fig.5H-M）

  - **[L2]** 空间转录组显示NMJ阳性spot中aSC1标志基因表达高于非NMJ spot。　（验证：Fig.5N-O：空间转录组NMJ阳性/阴性spot定位及aSC1标志基因标准化表达和小提琴图
  ｜ 位置：Fig.5N-O）

  - **[L1]** 突触肌核与施万细胞之间存在预测的配体-受体通讯，BMP和TGFβ/activin信号网络在基底、去神经和过载条件下发生变化。　（验证：Fig.6A-E：基于snRNA-seq/scRNA-seq的配体-受体相互作用和信号网络预测，未做功能验证
  ｜ 位置：Fig.6A-E）

  - **[L2]** 人去神经肌肉活检中denervation和TGFβ/activin相关基因改变，INHBA与CHRNE转录本可在去神经肌肉中检出。　（验证：Fig.6F-H：人PAN肌肉活检n=5
  denervated vs n=8 healthy controls的H&E/酯酶组织化学和基因热图，RNAscope n=3/组 ｜ 位置：Fig.6F-H）

  - **[L1]** 人脊髓损伤后公共微阵列数据中INHBA（aSC1标志）与萎缩相关基因共变化。　（验证：Fig.6I：公共人肌肉活检微阵列数据集（SCI 2d/5d）热图
  ｜ 位置：Fig.6I）

  - **[L2]** 人运动后肌肉中肥大相关通路与RFLNA（aSC2标志）相关。　（验证：Fig.6J-K：人exercised与control肌肉样本n=3/组热图
  ｜ 位置：Fig.6J-K）


