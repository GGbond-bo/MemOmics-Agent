content: '## 结论

  - 构建了小鼠肢体骨骼肌在静息、萎缩和肥大状态下的单核和单细胞转录组图谱，结合空间转录组学。

  - 发现条件依赖的细胞群变化和纤维类型特异性转录反应。

  - 神经肌肉接头(NMJ)发生广泛重塑，包括出现特化突触肌核(SynM)和终末施万细胞(tSCs)。

  - 萎缩导致NMJ轴突丢失和结构破坏，肥大保持NMJ完整性并扩展运动终板和SynM区域。

  - 去神经支配诱导终末施万细胞转分化为激活的tSC样细胞(aSC1)，通过TGFβ/activin信号与突触肌核通讯，可能促进肌肉萎缩。

  - 人类去神经和运动肌肉中观察到类似的NMJ改变，支持小鼠模型的转化相关性。


  ## 细胞类型

  - myonuclei

  - synaptic myonuclei (SynM)

  - terminal Schwann cells (tSCs)

  - activated Schwann cells (aSCs)

  - myelinating Schwann cells (mSCs)

  - muscle stem cells (MuSCs/satellite cells)

  - fibro-adipogenic progenitors (FAPs)

  - mural cells

  - vascular endothelial cells

  - immune cells


  ## 通路

  - TGFβ/activin signaling

  - Wnt signaling

  - BMP signaling

  - MAPK signaling

  - Hippo signaling

  - semaphorin-mediated axon guidance


  ## 基因 Marker

  - Myog：denervated myonuclei/Myonuc1，up，去神经萎缩肌核标记

  - Igfn1：denervated myonuclei/Myonuc1，up，去神经萎缩肌核标记

  - Ampd3：denervated myonuclei/Myonuc1，up，去神经萎缩肌核标记

  - Runx1：denervated myonuclei/Myonuc1，up，去神经相关基因

  - Gadd45：denervated myonuclei/Myonuc1，up，去神经相关基因

  - Scn5a：synaptic myonuclei (SynM)，up，去神经萎缩时SynM上调

  - Gpc4：synaptic myonuclei (SynM)，up，肥大时SynM上调

  - Chrne：synaptic myonuclei (SynM)，down，去神经时突触基因下调

  - Colq：synaptic myonuclei (SynM)，down，去神经时突触基因下调

  - Inhba：activated terminal Schwann cells (aSC1)，up，去神经时aSC1标记，表达于NMJ

  - Ajap1：terminal Schwann cells (tSCs)，down，去神经时tSC标记下降

  - Atf3：activated Schwann cells (aSCs)，up，轴突再生和迁移相关

  - Ngfr：activated Schwann cells (aSCs)，up，轴突再生相关

  - Tnc：activated Schwann cells (aSCs)，up，细胞外基质重塑

  - Sostdc1：aSC2 subcluster，na，肥大相关aSC2标记

  - Col20a1：terminal Schwann cells (tSCs)，na，非髓鞘化SC/tSC标记

  - Bche：terminal Schwann cells (tSCs)，na，非髓鞘化SC/tSC标记


