content: '## 结论

  - Compiled a comprehensive pan-tissue single-cell transcriptomic atlas from 35 human
  tissues, comprising 2,293,951 high-quality cells from 706 healthy samples.

  - Revealed substantial inter-tissue variability in cellular composition.

  - Identified 12 cross-tissue coordinated cellular modules with distinct cellular
  compositions, tissue prevalences and spatial organizations.

  - Demonstrated coordinated intercellular communication within cellular modules using
  in situ spatial and in vivo perturbation data.

  - Two immune cellular modules in the spleen showed contrasting chronological dynamics
  with ageing.

  - Breast multicellular changes revealed a menopausal trajectory associated with
  fibroblast dynamics.

  - Cancer progression involves simultaneous rewiring of two multicellular ecosystem
  types: loss of tissue-specific healthy organization and emergence of a convergent
  cancerous ecosystem.

  - 构建了跨性别、组织和数据集的泛组织人类单细胞转录组图谱，并实现有效整合。

  - 通过无监督细胞聚类和层级注释，使用经典标记建立了8个主要细胞类型。

  - 图谱中约45%的细胞属于免疫细胞区室，为研究免疫细胞表型多样化提供了基础。

  - 不同组织间细胞类型组成存在显著差异（P<2.2×10−16，卡方检验）。

  - 外周血和免疫器官/组织（骨髓、淋巴结、大网膜、脾、胸腺）以免疫细胞为主，符合其在免疫细胞产生、成熟或储存中的作用。

  - 生殖组织（子宫、阴道、睾丸）表现出更高比例的基质细胞。

  - 对76个非上皮细胞亚群进行了无监督层级聚类。

  - 成纤维细胞亚群的组织分布通过Ro/e（observed/expected细胞数比值）衡量，并按Shannon equitability从最普遍（S01）到最特异（S12）排序。

  - Visium空间转录组展示了成纤维细胞亚群在各组织中的空间分布。

  - 构建了泛组织单细胞图谱，并发现同一细胞类型内的细胞亚群对不同组织具有明显偏好。

  - 年龄相关记忆B细胞（ABC, B08）占B细胞少于1%，除肝、骨髓和脾外，也存在于输尿管和骨骼肌。

  - 鉴定出12个成纤维细胞亚群，S01–S04分布最广，生殖系统特异性亚群更局限于特定组织；子宫特异亚群S11对应子宫内膜，S12对应子宫肌层。

  - 开发了CoVarNet计算框架，通过细胞亚群频率协方差重建细胞模块（CM）网络，并在泛组织图谱中鉴定出12个CM。

  - 大多数非上皮细胞亚群（67/76，88.16%）参与至少一个CM，17个参与多个CM，且网络无明确hub节点。

  - 所有CM类型（CMT）均由多个组织组成，表明CM具有跨组织性质；GTEx bulk RNA-seq数据可恢复CMT且标志物表达一致。

  - CM表现出人体系统偏好：CM04/05/06/09富集于免疫器官和外周血，CM07/12富集于生殖系统，CM02/03分布于泌尿系统/胃肠道，CM08富集于屏障/黏膜相关组织，CM10为血管单元，CM11富集于肺/肾/肝/脂肪，CM01广泛分布。

  - Visium空间转录组映射显示CM08定位于皮肤表皮及邻近真皮，CM10对应血管组件。

  - 泛组织分析鉴定出12个跨组织细胞模块（CMs）。

  - CM02、CM03和CM05在小肠中显著富集，并呈现一致的空间模式。

  - CM05与C2生态位对齐，主要位于Peyer''s patch，包含naive B细胞、naive T细胞和滤泡辅助T细胞，重现黏膜免疫诱导模块。

  - CM02和CM03与C1生态位对齐，主要位于肠道黏膜，包含IgA产生浆细胞、记忆和组织驻留记忆T细胞及固有免疫细胞，重现黏膜免疫效应模块。

  - CMs在六个供体样本中稳健存在，并在单个供体的四个连续回肠切片中观察到一致空间模式。

  - 部分CM08亚群（如静脉内皮细胞E04）与CM10亚群重叠，提示不同CM在组织微环境中的相互联系。

  - 高分辨率Xenium数据可实现细胞和组织内数百至数千基因的精准原位表征。

  - Integrating single-cell and spatial data is important, and single-cell-based approaches
  show superior sensitivity for dissecting multicellular ecosystems.

  - CM spatial organization is strongly associated with composition, with highest
  spatial concordance in CMs with more lymphocytes, followed by myeloid, stromal and
  endothelial cells.

  - Endothelial and stromal cells produce a wider variety of ligands than lymphocytes;
  spatial proximity may enhance communication specificity in lymphocyte-enriched CMs,
  whereas stromal/endothelial-enriched CMs generate more diverse signals over longer
  distances.

  - Cell–cell interactions were enhanced in samples with high CM activity except CM08,
  implying tissue microenvironments shape distinct CM-dependent cellular phenotypes.

  - Half of cell subsets showed responsive associations with at least one cytokine;
  CMs with high colocalization scores tended to harbour more diverse cytokines, and
  cellular phenotypes are collectively determined by intrinsic properties and local
  stimuli.

  - CD8+ effector memory T cells (CD8T02) showed distinct cytokine responses across
  CMs, with TNF identified in CM02, CM08 and CM09 but absent in CM04 and CM06.

  - Cytokine spatial enrichment was validated in intestine, including IL7 and IL18
  in the CM02/CM03 (C1) niche and LTA and LTB in the CM05 (C2) niche.

  - CMs recapitulate the complexity of multicellular ecosystems and highlight interplay
  among diverse cell types in tissue microenvironments underlying tissue homeostasis.

  - Thymus-enriched CM09 activity was reduced in older individuals, with naive T cells
  (CD8T01) and regulatory T cells (CD4T08) more abundant in younger individuals, consistent
  with age-related thymic involution.

  - In spleen, CM05 increased chronologically and CM06 decreased with age; 80% (8/10)
  of age-varying immune subsets were components of CM05 or CM06.

  - Expansion of four CM05 subsets (B03, B05, CD4T03 and I06) was more pronounced
  with ageing than that of previously reported ABCs (B08), suggesting roles in ageing.

  - NR4A1-high CD4+ T cells (CD4T03) accumulate in spleen with ageing, potentially
  due to immune tolerance and thymic involution.

  - SCENIC analysis showed overlapping regulons in four CM05 subsets, with convergent
  CM05 regulons increasing activity with ageing; shared signature genes include 20
  transcription factor genes such as NR4A1 and NR4A2.

  - Eight key transcription factor genes (ATF3, FOS, FOSB, JUN, JUNB, JUND, KLF6 and
  NFKB1) were both regulons and signature genes, acting as regulatory hubs targeting
  common genes across cell types, aligning with AP-1 complex activation in immune
  ageing.

  - NR4A1, a key mediator of T cell dysfunction, was regulated by multiple key regulators
  across cell types, suggesting possible immune dysfunction associated with ageing.

  - Breast-enriched CM12 comprises three specialized fibroblast subsets (S06, S09
  and S10); DIALOGUE identified an MCP upregulated in pre-menopausal compared with
  post-menopausal samples.

  - SCGB2A2 and SCGB1D2 expression increased in post-menopausal breast samples across
  most subsets.

  - Inflammatory genes including human leukocyte antigen genes were more highly expressed
  in pre-menopausal breast samples across cell subsets.

  - CM05 and CM06 activities varied across spleen age groups.

  - CM12 activity and fibroblast subset S10/S06 frequencies differed between pre-menopausal
  and post-menopausal breast samples.

  - Breast fibroblast subsets S10 and S06 showed spatial distributions in histopathological
  regions including ductal tissue and lobule.

  - CM12 subset frequencies and fibroblast inflammatory scores varied along pseudotime.

  - Convergent regulons in CM05 were associated with cell subsets B03, B05, CD4T03,
  and I06 (permutation test P = 0.00042).

  - Additional analysis confirmed decreased inflammatory scores after menopause, possibly
  due to breast tissue being more strongly influenced by oestrogen and leading to
  localized reductions in inflammation.

  - Menopause induces coordinated phenotypic shifts among diverse subsets within CM12.

  - Fibroblasts show strong association with menopause, with S10 and S06 markedly
  decreased in post-menopausal samples.

  - S10 fibroblasts highly express collagen genes COL1A1, COL1A2, and COL3A1, and
  are uniformly distributed across connective tissue, whereas S06 is located primarily
  in lobules.

  - Immune subsets and S09 fibroblasts within CM12 colocalize in ductal tissues of
  the breast with little abundance change after menopause.

  - Post-menopausal women exhibit decreased CM12 activity compared with pre-menopausal
  women, less pronounced in women over 50, suggesting CM12 recapitulates menopause-associated
  changes rather than chronological variation.

  - CM12 cell subset frequencies define a menopausal trajectory from pre-menopausal
  to post-menopausal states, with S10 decreasing consistently and S06 decreasing later.

  - S06, S09, and S10 fibroblasts exhibit decreased inflammatory scores along the
  menopausal trajectory, particularly after menopause, and this was replicated in
  an external breast dataset.

  - A pan-cancer single-cell transcriptomic atlas comprising 1,062 clinical samples
  from 29 cancer types identified 91 cell subsets, including 15 cancer-associated
  subsets.

  - Healthy CM activity is reduced in tumour samples across cancer types, while CM08
  remains consistent across healthy, adjacent non-tumour, and tumour samples in cutaneous
  squamous cell carcinoma.

  - Cancer-associated subsets frequently co-occur across cancers, and four cancer-associated
  CMs were identified, with cCM02 enriched in tumour samples and progressively increasing
  from healthy to adjacent non-tumour to tumour.

  - Tumour progression is marked by simultaneous rewiring of two multicellular ecosystems:
  loss of tissue-specific healthy organizations and emergence of a convergent cancerous
  ecosystem.

  - Cytokine analysis of cCM02 identified interferon, IL-18, and IL-15 as key mediators,
  and DIALOGUE identified an MCP associated with increased cCM02 activity characterized
  by upregulation of S100A2, S100A9, and S100A8.

  - The S100-family TME programme was validated in TCGA and showed higher expression
  in pre-invasive lung lesions that progressed to invasive lung cancer versus those
  undergoing spontaneous regression, suggesting potential for early cancer diagnosis.

  - CoVarNet provides a computational framework for systematically identifying cross-tissue
  co-occurring CMs and their rewiring in cancer, bridging cellular diversity and tissue
  organization.

  - Spatial datasets are often limited by gene coverage or resolution, whereas defining
  fine-grained CMs from single-cell transcriptomes and mapping them onto spatial data
  combines strengths of both modalities.

  - Spatial mapping of CM02 and CM03 revealed distinct distributions.

  - A pan-cancer single-cell atlas was built from healthy subsets (76) and cancer-associated
  subsets (15).

  - Eight cancer types with matched healthy, tumour and adjacent non-tumour samples
  were used to characterize cancer-associated CMs identified by CoVarNet.

  - Cancer involves rewiring of multicellular ecosystems.

  - CM03 activity changes across healthy, adjacent non-tumour and tumour samples in
  colorectal cancer; CM08 activity changes in head and neck squamous cell carcinoma.

  - cCM02 activity changes across cancer types and in CRC and HNSC across healthy,
  adjacent non-tumour and tumour samples.

  - Co-occurring cCM02 network dynamics occur during tumour progression.

  - The cCM02 programme is differentially expressed between tumour and adjacent non-tumour
  samples across TCGA cancer types.

  - cCM02 programme expression differs between pre-invasive lesions that spontaneously
  regress and those that progress to cancer.

  - Cell-subset co-occurrence patterns are detected across multiple cancer types,
  with only pairs detected in at least three cancer types shown.

  - The framework enables integrative, multimodal analysis across a wide range of
  biological contexts.

  - A co-occurrence pattern-based approach captures both local and distal multicellular
  interactions, which may be essential for understanding complex networks such as
  systemic immunity and cross-tissue regulation.

  - The current framework does not explicitly incorporate epithelial cells, the extracellular
  matrix, or microbiome components.

  - Integrating coordinated intercellular networks with intracellular regulatory circuits
  may provide a more nuanced understanding of tissue functions.

  - Expanding the analysis to larger cohorts and a broader range of phenotypes will
  advance understanding of multicellular ecosystems and their implications for translational
  medicine.

  - 构建了覆盖35种人体组织、来自33个数据集/26个队列的泛组织单细胞图谱。

  - 经严格质控后纳入706个样本、317个供体、2,293,951个高质量细胞。

  - 共注释出76个非上皮细胞亚群和26种上皮细胞类型。

  - BBKNN在整合方法基准测试中表现最佳，被用于泛组织数据集整合。

  - CoVarNet通过细胞亚群频率的协方差识别共现细胞模块（CM）网络。

  - NMF用于从频率矩阵中解析细胞共现程序，采用nsNMF ranks 2–20。

  - Consensus NMF output was derived from 30 runs, yielding k factors and their activities
  in each sample.

  - The optimal rank for pan-tissue NMF was 12 based on CCC stability criteria.

  - CoVarNet identified 147 specifically correlated cell-subset pairs for the pan-tissue
  atlas.

  - Healthy single-cell samples across tissues were stratified into 12 CMT groups
  based on the most abundant CM.

  - GTEx bulk RNA-seq validation classified 11,962 of 12,240 samples into 12 CMTs
  after excluding low-score samples.

  - Spatial transcriptomics deconvolution with cell2location yielded expected cell
  abundance per cell subset per spot.

  - Colocalization score for each CM is defined as the proportion of Spearman correlations
  between subset pairs, where at least one subset is within the CM, that are less
  than or equal to the median correlation coefficient within the CM.

  - Aggregation scores assess regional aggregation of cell-subset components within
  CMs in spatial transcriptomics using global bivariate Moran’s I.

  - CellCharter identifies cellular niches by clustering Visium spots based on gene
  expression and spatial information, independently per sample to mitigate batch effects.

  - Xenium in situ imaging characterizes spatial locations of CM02 and CM03 in intestinal
  tissue using a designed gene panel and k-means clustering (k=2) to identify epithelium
  and lamina propria regions.

  - CellPhoneDB ligand–receptor-mediated cell–cell communication analysis derives
  interaction counts among cell types or CMs, with subsampling to 1,000 cells per
  subset, and results are validated using CellChat.

  - Comparative CellPhoneDB analysis between high and low CM activity samples reveals
  effects of tissue microenvironments on cellular crosstalk within CMs.

  - CM-dependent DEGs of immune subsets (log2-transformed fold change > log2(1.2),
  FDR < 0.05, Student’s t-test) are interpreted as cytokine responses within tissue
  microenvironments associated with CMs.

  - Cytokine response inference uses the Immune Dictionary, mouse-human ortholog conversion,
  and hypergeometric enrichment to construct CM-specific cytokine networks.

  - CM activities show strong tissue preferences and associations with sex, age groups,
  and additional phenotypes such as alcohol consumption, childhood tuberculosis, menopause,
  and menstrual cycle phases.

  - Specifically correlated cell-subset pairs were derived per cancer type using CoVarNet
  with coefficients >0.5, FDR <0.05 and specificity >0.95, and only these pairs were
  compared across eight cancer types.

  - cCMs were identified using CoVarNet from a pan-cancer frequency matrix of 91 subsets
  and 955 samples, with the top 15 subsets of each factor used as co-occurring node
  candidates in a single CM network.

  - cCM02 activities were quantified across different conditions using the same procedure
  as healthy CMs.

  - Two cCM02 co-occurring networks were constructed with the same original cCM02
  nodes and recalculated edges, one using healthy and adjacent non-tumour samples
  and the other using tumour and adjacent non-tumour samples.

  - For each cCM02 cell-subset component, DEGs in tumour versus adjacent non-tumour
  samples were identified and used for cytokine analysis.

  - MCP identification used only tumour and adjacent non-tumour samples, with overall
  MCP expression calculated from TCGA RNA-seq datasets and microarray data of pre-invasive
  lung lesions.

  - Curated pan-tissue and pan-cancer scRNA-seq datasets are available from Zenodo
  and can be interactively explored at http://cm.cancer-pku.cn; CoVarNet source code
  is available on GitHub.

  - Pan-tissue single-cell datasets were summarized for donor, sample, and cell numbers
  before and after QC for scRNA-seq datasets.

  - The intersecting gene sets of three commonly used versions of 10x Genomics gene
  annotations were used for data integration.

  - Python-based integration methods were benchmarked on the total atlas and a subset
  atlas using the scIB platform, with overall scores calculated as a weighted mean
  of batch correction (40%) and bio-conservation (60%).

  - UMAP visualizations of total cells were colored by compartments or tissues across
  different integration methods.

  - NMF rank selection based on cophenetic correlation coefficients and consistency
  identified a final rank of 12.

  - Consensus modules (CMs) were defined from cell subsets, with top cell subsets
  ranked by NMF weights for each factor.

  - CM activities were assigned across scRNA-seq samples from 34 tissues, and each
  sample was classified into a CMT based on its dominant CM.

  - CMs were validated using GTEx RNA-seq data across 23 tissues, including CMT signature
  gene expression and selected cell subset markers.

  - Spatial characterization showed distributions of CM08, CM10, CM02, CM03, and CM05
  in skin and ileum Visium sections.

  - CellCharter identified cellular niches in ileum Visium sections, and CODEX imaging
  revealed B cells, T cells, and DCs in intestinal Peyer’s patches.

  - CM spatial organization and cell-cell interactions were analyzed using colocalization,
  aggregation, CellPhoneDB, CellChat, and cytokine responsiveness metrics.

  - CM activity was associated with tissue, sex, and age group, including age-related
  changes in thymus CM09 and spleen immune subsets.

  - CM05 spleen analysis highlighted NR4A1, NR4A2, and NR4A3 expression and a SCENIC
  regulatory network with 17 convergent regulons and 8 key regulator TFs.

  - CM12 breast analysis linked inflammatory scores and specialized fibroblast subsets
  S10 and S06 to menopausal status and pseudotime.

  - Pan-cancer single-cell datasets were summarized by donor, sample, and cell numbers
  before and after QC across cancer types.

  - 健康CM活性在健康、癌旁非肿瘤和肿瘤样本间存在差异（双尾非配对Wilcoxon检验）。

  - cCMs进行了拓扑与统计评估，connectivity score定义为cCM网络内所有节点间观察到的边数与总可能边数之比。

  - 每个cCM因子按NMF权重排序展示前20个细胞亚群。

  - 泛癌分析识别出四个CMs，并以网络图展示细胞亚群、细胞类型和相关性特异性。

  - 泛癌cCM活性分析中，每个样本按优势cCM分配cCMT。

  - cCMs的组织流行度通过Ro/e度量。

  - cCM02活性在跨癌种健康、癌旁非肿瘤和肿瘤样本间存在差异（双尾非配对Wilcoxon检验）。

  - 图示肿瘤进展过程中多细胞生态系统的重连。

  - 热图展示cCM02细胞亚群组分中响应的细胞因子。

  - cCM02 MCP总体表达在不同细胞亚群及肿瘤与癌旁非肿瘤样本间分布不同（双尾非配对Wilcoxon检验）。


