content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L1]** 构建了覆盖35种人体组织、706个健康样本、2,293,951个高质量细胞的泛组织单细胞转录组图谱，揭示组织间细胞组成存在显著差异。　（验证：Results:
  A single-cell atlas of the human 第1段：严格质控后获得2,293,951个高质量细胞、706个健康样本、35种组织；未列独立湿实验验证
  ｜ 位置：Results: A single-cell atlas of the human 第1段）

  - **[L1]** 使用scIB评估单细胞数据整合工具，BBKNN表现最佳，用于跨组织数据整合。　（验证：Extended Data Fig.2：scIB平台评估；原文未描述湿实验验证
  ｜ 位置：Results 第1段 / Extended Data Fig.2）

  - **[L1]** 通过细胞丰度协方差识别出12个具有不同细胞组成、组织流行性和空间组织的细胞模块。　（验证：Abstract/Results：基于细胞丰度协方差计算识别；片段未提供湿实验验证
  ｜ 位置：Abstract）

  - **[L2]** 细胞模块内存在协调的细胞间通讯，并可由原位空间和体内扰动数据支持。　（验证：Abstract：使用原位空间和体内扰动数据（in situ
  spatial and in vivo perturbation data）验证，片段未提供具体图号 ｜ 位置：Abstract）

  - **[L1]** 脾脏中两个免疫细胞模块随衰老呈现相反的时间动态。　（验证：Abstract：基于单细胞图谱的动态分析；片段未提供湿实验验证 ｜ 位置：Abstract）

  - **[L1]** 乳腺多细胞变化揭示了一条与成纤维细胞动态相关的绝经轨迹。　（验证：Abstract：基于单细胞图谱的分析；片段未提供湿实验验证 ｜ 位置：Abstract）

  - **[L1]** 跨癌种分析发现肿瘤进展中同时发生两类多细胞生态系统重编程：组织特异性健康组织结构丢失和趋同的癌性生态系统出现。　（验证：Abstract：跨癌种单细胞图谱分析；片段未提供湿实验验证
  ｜ 位置：Abstract）

  - **[L2]** 研究构建了覆盖多组织的人类泛组织单细胞图谱，并揭示同一细胞类型内不同细胞亚群在不同组织间存在明显偏好。　（验证：基于多组织 scRNA-seq
  图谱分析（Fig.1d），展示细胞亚群组织偏好（Supplementary Fig.2），并有空间转录组验证（Fig.1f） ｜ 位置：Results 第1段
  / Fig.1d-f）

  - **[L2]** 内皮细胞可基于来源进行独特划分，例如来自血管或淋巴管。　（验证：scRNA-seq 细胞亚群分析（Fig.1d） ｜ 位置：Results
  第1段 / Fig.1d）

  - **[L2]** 年龄相关记忆B细胞（ABC, B08）占总B细胞不足1%，除肝、骨髓和脾外，也出现在输尿管和骨骼肌等非预期部位。　（验证：scRNA-seq
  图谱中亚群频率分析（Fig.1d） ｜ 位置：Results 第1段 / Fig.1d）

  - **[L2]** 成纤维细胞具有高度多样性，鉴定出12个成纤维细胞亚群；S01–S04分布最广且在生殖系统中显著减少；子宫特异性S11对应子宫内膜，S12对应子宫肌层。　（验证：scRNA-seq
  亚群分析（Supplementary Fig.3a–d）及空间分辨转录组（Fig.1f） ｜ 位置：Results 第1段 / Fig.1e,f）

  - **[L2]** 同一人体系统内的上皮细胞相似性高于不同系统之间的上皮细胞。　（验证：scRNA-seq 上皮细胞比较分析（Supplementary Fig.3e）
  ｜ 位置：Results 第1段 / Supplementary Fig.3e）

  - **[L2]** 开发了CoVarNet计算框架，通过细胞亚群频率协方差重建细胞模块（CM）网络，并在泛组织图谱中鉴定出12个CM；88.16%（67/76）非上皮细胞亚群参与至少一个CM，且多数CMT由多组织组成，表明CM具有跨组织特性。　（验证：CoVarNet分析（Fig.2a,b、Extended
  Data Fig.3a–f）；与约12,000个GTEx RNA-seq profiles整合验证（Extended Data Fig.4a–e） ｜ 位置：Results
  ''Identification of cross-tissue CMs'' / Fig.2a,b, Extended Data Fig.3–4）

  - **[L2]** 12个CM具有特定人体系统偏好：CM04/05/06/09富集于免疫器官和外周血；CM07/12偏好生殖系统；CM02/03分布于泌尿和胃肠道；CM08富集于屏障组织；CM10为血管单元；CM11富集于肺、肾、肝和脂肪；CM01广泛分布，提示通用多细胞组织。　（验证：CM偏好分析（Fig.2c）并经GTEx外部数据验证（Extended
  Data Fig.4f） ｜ 位置：Results ''CM annotations'' / Fig.2b–d）

  - **[L2]** 通过cell2location将CM映射到Visium空间转录组，CM08定位于表皮及邻近真皮层，CM10代表血管组件。　（验证：Visium空间转录组与cell2location映射（Extended
  Data Fig.5a–c） ｜ 位置：Results ''Spatial characteristics of CMs'' / Extended Data Fig.5a–c）

  - **[L2]** Xenium基因panel可区分CM02和CM03内多个细胞亚群，且基因转录本密度可代表单个CM的强度。　（验证：Xenium成像分析（Extended
  Data Fig. 5i） ｜ 位置：Extended Data Fig. 5i / Results）

  - **[L2]** CM03在固有层显著富集，而CM02在组织中分布更均匀。　（验证：Xenium成像与定量，n=6，双尾配对Wilcoxon检验（Fig.
  3d,e/Methods） ｜ 位置：Fig. 3d,e）

  - **[L2]** CMs具有空间多细胞协调性，不同组织/样本中CM共定位评分和细胞谱系组成不同。　（验证：Visium空间转录组分析，n=34（Fig. 3a–c,f）
  ｜ 位置：Fig. 3a–c,f）

  - **[L1]** 高CM活性单细胞样本中，CM内CellPhoneDB细胞–细胞互作计数高于低CM活性样本。　（验证：CellPhoneDB计算推断（Fig.
  3g） ｜ 位置：Fig. 3g）

  - **[L1]** CM02、CM03和CM05的细胞因子响应性存在差异，并可利用Immune Dictionary推断。　（验证：Immune Dictionary推断，CM-level
  FDR取CM内所有亚群最小FDR（Fig. 3h） ｜ 位置：Fig. 3h）

  - **[L2]** 特定细胞因子基因在CM02、CM03或CM05及回肠细胞niche中富集，并呈现空间分布。　（验证：Visium空间表达检测与空间分布展示（Fig.
  3i,j） ｜ 位置：Fig. 3i,j）

  - **[L2]** 绝经后乳腺样本中SCGB2A2、SCGB1D2等基因在多数细胞亚群中表达升高，与既往SCGB2A2作为乳腺癌检测生物标志物的报道一致。　（验证：人乳腺样本按绝经状态分组，Fig.4d展示样本平均表达热图；Fig.4f显示绝经前n=93、绝经后n=18，使用双尾非配对Wilcoxon检验。
  ｜ 位置：Fig.4d；Fig.4f）

  - **[L2]** 绝经前乳腺样本中多种炎症基因（包括HLA基因）在多个细胞亚群中表达更高。　（验证：人乳腺细胞亚群表达比较，原文补充材料Supplementary
  Table 6列出结果。 ｜ 位置：Supplementary Table 6）

  - **[L2]** CM12 MCP基因在乳腺样本中呈上/下调模式，CM12活性与绝经状态及成纤维细胞亚群S10、S06频率相关。　（验证：Fig.4d展示CM12
  MCP基因跨乳腺样本表达；Fig.4f比较绝经前n=93与绝经后n=18的CM12活性及S10/S06频率，使用双尾非配对Wilcoxon检验；Fig.4h以PHATE显示CM12活性。
  ｜ 位置：Fig.4d；Fig.4f；Fig.4h）

  - **[L2]** 乳腺成纤维细胞炎症评分沿拟时序变化，S06_Fb_ARID5B与S10_Fb_MXRA5等成纤维细胞亚群在组织中呈空间分布差异。　（验证：Fig.4g为Visium空间转录组分析并注释乳腺组织病理区域；Fig.4j为LOESS平滑的成纤维细胞炎症评分沿pseudotime趋势，误差带为95%置信区间。
  ｜ 位置：Fig.4g；Fig.4j）

  - **[L2]** 脾脏样本中CM05和CM06活性随年龄组变化。　（验证：Fig.4a按年龄分组统计脾脏样本：<35 n=3；40–49 n=8；50–59
  n=10；60–69 n=7；70–85 n=1，使用Kruskal–Wallis检验和双尾非配对Wilcoxon检验。 ｜ 位置：Fig.4a）

  - **[L1]** 绝经后乳腺CM12活性及炎症评分下降，提示乳腺作为生殖器官其局部炎症受雌激素影响，而非单纯随年龄增加。　（验证：Extended Data
  Fig. 9a 炎症评分分析；Fig. 4f CM12活性比较 ｜ 位置：Results 前段 / Extended Data Fig. 9a, Fig. 4f）

  - **[L1]** 成纤维细胞与绝经状态强相关，S10和S06在绝经后样本中显著减少；S10高表达COL1A1、COL1A2和COL3A1。　（验证：Fig.
  4f 与 Extended Data Fig. 9b,c 单细胞亚群频率和基因表达分析 ｜ 位置：Results / Fig. 4f, Extended Data
  Fig. 9b,c）

  - **[L1]** 空间分析显示S10均匀分布于结缔组织，S06主要位于小叶；免疫亚群和S09成纤维细胞在乳腺导管组织中共定位，绝经后丰度变化较小。　（验证：Fig.
  4g 与 Extended Data Fig. 9d 空间分布分析 ｜ 位置：Results / Fig. 4g, Extended Data Fig. 9d）

  - **[L1]** 基于CM12亚群频率可构建从绝经前到绝经后的绝经轨迹；S10沿轨迹持续下降，S06后期下降，S06/S09/S10炎症评分沿轨迹下降，尤其绝经后；该轨迹和成纤维细胞变化在外部队列中重复。　（验证：Fig.
  4h-j 轨迹与炎症评分分析；Extended Data Fig. 9f,g 外部队列重复 ｜ 位置：Results / Fig. 4h-j, Extended
  Data Fig. 9f,g）

  - **[L1]** 构建了包含1,062个临床样本、29种癌症类型、91个细胞亚群（含15个癌相关亚群）的泛癌单细胞转录组图谱。　（验证：Fig. 5a,b
  与 Extended Data Fig. 10 单细胞图谱构建 ｜ 位置：Results / Fig. 5a,b, Extended Data Fig. 10）

  - **[L1]** 肿瘤进展伴随健康CM活性降低和组织特异性多细胞生态系统破坏，同时出现跨癌种趋同的癌症相关生态系统；cCM02在肿瘤中富集并沿健康→癌旁→肿瘤逐步增加。　（验证：Fig.
  5d-h 与 Extended Data Fig. 11-12 泛癌CM/cCM活性分析 ｜ 位置：Results / Fig. 5d-h, Extended
  Data Fig. 11-12）

  - **[L1]** cCM02的细胞间调控关键因子包括干扰素、IL-18和IL-15；DIALOGUE识别出与cCM02活性升高相关的MCP，特征为多数细胞亚群中S100A2、S100A9和S100A8上调。　（验证：Extended
  Data Fig. 12e,f 细胞因子与DIALOGUE分析 ｜ 位置：Results / Extended Data Fig. 12e,f）

  - **[L3]** S100相关TME程序在TCGA外部队列中验证；在51例已知结局的浸润前肺病变中，进展为浸润性肺癌者该程序表达高于自发消退者，提示早期诊断潜力。　（验证：Fig.
  5j TCGA外部验证；Fig. 5k 51例已知结局临床队列分析 ｜ 位置：Results / Fig. 5j,k）

  - **[L1]** 基于共现模式的多细胞互作分析框架能够捕捉局部和远端的多细胞相互作用，支持跨多种生物背景的整合多模态分析，并可能有助于理解系统性免疫和跨组织调控。　（位置：Discussion
  第1段）

  - **[L0]** 当前框架未明确纳入上皮细胞、细胞外基质或微生物组成分；未来纳入这些要素可提供更全面的组织水平功能协调视角。　（位置：Discussion
  第2段）

  - **[L0]** 将协调的细胞间网络与细胞内调控回路整合，并扩展到更大队列和更广泛表型，有助于深化对多细胞生态系统及其转化医学意义的理解。　（位置：Discussion
  第2段）

  - **[L1]** 构建了覆盖35种人体组织的泛组织单细胞图谱，最终纳入706个样本、317个供者、2,293,951个高质量细胞，并注释为76个非上皮亚群和26个上皮细胞类型。　（位置：Methods:
  Single-cell data collection and preprocessing of healthy samples; Single-cell data
  integration and annotation）

  - **[L1]** 在泛组织单细胞数据整合方法基准测试中，BBKNN表现最佳，并用于泛组织数据集整合。　（位置：Methods: Benchmarking integration
  methods; Extended Data Fig. 2）

  - **[L1]** CoVarNet可通过分析细胞亚群频率协变，利用NMF和相关性分析识别共现细胞亚群并构建细胞类型共现网络（CM networks）。　（位置：Methods:
  CoVarNet framework）

  - **[L1]** CoVarNet通过NMF的30次一致性运行识别共现模块（CM），pan-tissue atlas的最佳rank为12，并将所有健康单细胞样本划分为12个CMT组。　（验证：30次运行一致性输出；Extended
  Data Fig. 3a,b,e（CCC评估与CMT分组） ｜ 位置：Rank selection；CMT classifications of samples）

  - **[L1]** 在pan-tissue atlas中，基于Pearson相关、FDR和特异性指数筛选得到147对特异相关细胞亚群对，并用于构建CM网络。　（验证：Supplementary
  Fig. 4；CM网络连接性用n=10,000置换检验 ｜ 位置：Specifically correlated subset pairs；Construction,
  evaluation and visualization of CM networks）

  - **[L1]** GTEx RNA-seq数据用于验证单细胞定义的CM；12,240个样本中排除278个最高CMT评分低于0.2的样本后，11,962个样本被分为12个CMT。　（验证：Extended
  Data Fig. 4；排除278/12,240 (2.3%)样本 ｜ 位置：Integrative analysis of scRNA-seq and GTEx
  RNA-seq；CMT classifications of RNA-seq samples）

  - **[L1]** 组织流行度通过Ro/e评估，Ro/e>1定义为组织富集，并用于比较细胞亚群和CM的组织分布。　（验证：Fig. 1e；Fig. 2c；Extended
  Data Fig. 4f；Supplementary Fig. 2 ｜ 位置：Tissue prevalence of cell subsets and CMs）

  - **[L1]** 空间转录组数据使用cell2location去卷积，按NMF权重聚合CM活性并计算共定位评分，从而在Visium/Xenium数据中量化CM。　（验证：Supplementary
  Table 3；99th percentile scaling ｜ 位置：Analysis of spatial transcriptomics data）

  - **[L1]** 组织微环境以CM依赖方式广泛影响细胞亚群表型，CM相关差异表达基因可解释为对组织微环境中细胞因子的响应。　（验证：纯生信分析：对每个免疫亚群在对应CMT样本与其他CMT样本间鉴定DEGs（log2-transformed
  fold changes > log2(1.2), FDR < 0.05, Student’s t-test）；原文未描述湿实验验证。 ｜ 位置：Cytokine
  response analysis / CM-dependent DEGs of cell subsets）

  - **[L1]** CM具有较强组织偏好性，因此后续分析聚焦组织特异性关联。　（验证：纯生信分析：对每个CM拟合线性模型并报告adjusted R2与F检验FDR，排除样本数少于5的组织；原文未描述湿实验验证。
  ｜ 位置：Association analysis of CM activity and phenotypic factors / Tissues）

  - **[L1]** 在泛癌单细胞图谱中，使用更严格的阈值（相关系数>0.5、FDR<0.05、specificity>0.95）可衍生每个癌症类型中特异相关的细胞亚群对，并用于八种癌症类型间比较。　（验证：无湿实验验证；基于
  CoVarNet 相关性分析模块的纯生信分析 ｜ 位置：Co-occurrence of cell subsets in individual cancer types
  段）

  - **[L1]** 通过 CoVarNet 对 91 个细胞亚群和 955 个样本的泛癌频率矩阵识别 cCM，并在单 CM 网络中以每个因子的 top 15
  亚群作为共发生节点候选。　（验证：无湿实验验证；纯生信分析 ｜ 位置：Identification of cCMs using CoVarNet 段）

  - **[L1]** cCM02 活性可按健康 CM 相同流程在不同条件下量化，并通过重建健康/邻近非肿瘤与肿瘤/邻近非肿瘤样本的共发生网络探索其在肿瘤进展中的动态。　（验证：无湿实验验证；纯生信网络重建
  ｜ 位置：Interrogation of cCM02 / cCM02 analysis Co-occurring network 段）

  - **[L1]** cCM02 各细胞亚群成分的肿瘤 vs 邻近非肿瘤 DEGs 可用于细胞因子分析；MCP 表达可在 TCGA RNA-seq 和侵袭前肺病变微阵列数据中计算。　（验证：无湿实验验证；TCGA/微阵列数据二次分析
  ｜ 位置：cCM02 analysis Cytokine analysis / MCP analysis 段）

  - **[L1]** 研究构建了跨组织/泛组织单细胞数据集，并对QC前后供体、样本、细胞数及基因数、平台和组织分布进行了统计。　（验证：Extended Data
  Fig.1a-e：QC前后供体/样本/细胞数统计、基因数统计、每队列样本数、10x Genomics平台细胞百分比、每组织细胞数 ｜ 位置：Extended Data
  Fig.1a-e）

  - **[L1]** 在总图谱和子集图谱上对多种常用Python单细胞整合方法进行基准测试，并按scIB总体评分排名；UMAP显示按compartment或tissue着色的整合结果。　（验证：Extended
  Data Fig.2a scIB基准测试，总体评分为批次校正40%与生物保守性60%加权；Extended Data Fig.2b UMAP可视化 ｜ 位置：Extended
  Data Fig.2a-b）

  - **[L1]** 泛癌分析鉴定出四种细胞模块（CMs），并显示cCM在癌种、癌旁非肿瘤和肿瘤样本间活性存在差异。　（位置：Extended Data Fig.
  11d, Extended Data Fig. 12a-c）

  - **[L1]** 肿瘤进展过程中多细胞生态系统发生重连。　（位置：Extended Data Fig. 12d）

  - **[L1]** cCM02的活性及其MCP整体表达在肿瘤与癌旁非肿瘤样本的不同细胞亚群中存在差异，且其细胞亚群对细胞因子具有响应异质性。　（位置：Extended
  Data Fig. 12c,e,f）


  ## 细胞类型

  - 免疫细胞

  - 成纤维细胞

  - endothelial cells

  - lymphatic endothelial cells

  - vascular endothelial cells

  - age-associated memory B cells (ABC, B08)

  - B cells

  - fibroblasts

  - epithelial cells

  - lymphocytes

  - dendritic cells

