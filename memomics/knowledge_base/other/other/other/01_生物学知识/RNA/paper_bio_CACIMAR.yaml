  ## 基因 Marker

  - Rlbp1/rlbp1a/RLBP1：resting Müller glial cells，na，在三种物种保守的静息 Müller 胶质细胞中作为保守标记基因被鉴定

  - Pou2f1/pou2f1b/POU2F1：Müller glial cells，na，在任意两种物种的 Müller 胶质细胞调控网络中保守的同源调节因子

  - Nfia/nfia：Müller glial cells，na，在小鼠和斑马鱼中保守的调节因子，位于三物种保守调控模块中

  - Pax6/pax6a：Müller glial cells，na，在小鼠和斑马鱼中保守的调节因子，位于三物种保守调控模块中

  - Sox4/sox4a：Müller glial cells，na，在小鼠和斑马鱼中保守的调节因子，位于三物种保守调控模块中

  - medf2d/MEF2D：Müller glial cells，na，在斑马鱼和鸡中保守的调节因子，位于三物种保守调控模块中

  - sox5/SOX5：Müller glial cells，na，在斑马鱼和鸡中保守的调节因子，位于三物种保守调控模块中

  - egr1/Egr1：Müller glial cells，na，在斑马鱼和鸡中保守的调节因子，位于三物种保守调控模块中

  - Smarca5/smarca5/SMARCA5：Müller glial cells，na，唯一在三个物种中均保守的调节因子，位于三物种保守调控模块中

  - App：cones，na，在三种物种共保守的视锥细胞自身互作中，App–Rpsa和App–Aplp2为保守配体-受体互作。

  - Rpsa：cones，na，在三种物种共保守的视锥细胞自身互作中，App–Rpsa为保守配体-受体互作。

  - Aplp2：cones，na，在三种物种共保守的视锥细胞自身互作中，App–Aplp2为保守配体-受体互作。


