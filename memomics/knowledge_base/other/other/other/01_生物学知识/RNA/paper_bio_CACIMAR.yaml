content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L1]** CACIMAR 能基于跨物种 scRNA-seq 数据识别进化上保守的细胞类型、标志基因、胞内调控和细胞间相互作用。　（验证：使用公开的小鼠、斑马鱼和鸡视网膜再生
  scRNA-seq 数据展示四项主要功能；原文为计算工具开发与纯生信分析，未做湿实验验证。 ｜ 位置：Abstract）

  - **[L1]** 基于保守特征的加权和模型和保守性评分可量化细胞类型、调控网络和细胞间相互作用的保守性。　（验证：原文描述基于加权和模型开发不同保守性评分，并在公开
  scRNA-seq 数据中展示；未显示湿实验验证。 ｜ 位置：Abstract / Introduction）

  - **[L1]** CACIMAR 先在各物种内进行单细胞聚类分析，以避免跨物种批次效应。　（验证：原文方法描述，未做湿实验验证。 ｜ 位置：Introduction）

  - **[L1]** 利用小鼠、斑马鱼和鸡的公开scRNA-seq数据，CACIMAR可应用于视网膜再生的跨物种保守性分析。　（位置：Abstract/引言第1段）

  - **[L1]** CACIMAR在小鼠、斑马鱼和鸡视网膜中鉴定出保守的标记基因、细胞类型、胞内调控和细胞间相互作用。　（位置：Abstract/引言第1段）

  - **[L1]** 在斑马鱼Müller胶质细胞中，模块化调控网络包含2202个基因和192个转录因子，分为10个模块。　（位置：Cross-species
  analysis using scRNA-seq data 第1段）

  - **[L1]** 在鸡Müller胶质细胞中，调控网络包含1777个基因和66个转录因子，分为8个模块。　（位置：Cross-species analysis
  using scRNA-seq data 第1段）

  - **[L1]** 开发了CACIMAR方法，用于跨物种scRNA-seq数据分析，以识别进化保守的细胞类型、标志物、胞内调控和胞间互作。　（位置：Results
  第1段）

  - **[L1]** 定义了调控网络保守性评分CSRN，用于量化任意两物种细胞类型特异性调控网络或模块的保守性。　（位置：Cross-species analysis
  using scRNA-seq data 第1段）

  - **[L1]** 进化上保守的调控因子需满足：至少在两个物种的保守细胞类型中有同源基因和表达、属于保守调控模块、且根据IReNA显著调控任一模块中的基因（FDR
  < 0.01）。　（位置：Cross-species analysis using scRNA-seq data 第2段）

  - **[L1]** 保守胞间互作通过LIANA中Consensus数据库和SingleCellSignalR算法评估配体-受体互作，并以CSII高于第三四分位数作为保守判定阈值。　（位置：Identification
  of conserved intercellular interactions 第1段）

  - **[L1]** CACIMAR 是一个跨物种 scRNA-seq 分析框架，可从各物种 scRNA-seq 数据中鉴定细胞类型、细胞类型特异性 marker、细胞内调控和细胞间互作，并基于同源信息计算保守性分数，进而识别进化保守特征。　（验证：基于公开
  scRNA-seq 数据及同源基因数据库进行计算分析；未做湿实验验证。 ｜ 位置：Figure 1 / 正文第1-2段）

  - **[L1]** CACIMAR 通过 marker 的统计功效定义细胞类型保守性评分（CSCT），共享 marker 统计功效之和占全部 marker 统计功效之和的比例越高，细胞类型越保守。　（验证：方法学描述与公开数据演示；未做湿实验验证。
  ｜ 位置：CACIMAR identifies conserved cell types based on the statistical powers of
  markers 章节）

  - **[L1]** 在小鼠、斑马鱼和鸡视网膜再生 scRNA-seq 数据中，Seurat AUC 为全部视网膜细胞类型分别鉴定出 1933、787 和 387
  个 marker。　（验证：纯生信分析公开 scRNA-seq 数据；原文未做湿实验验证。 ｜ 位置：Results 第1段）

  - **[L1]** 同一细胞类型在不同物种间 marker 数量不同，例如视锥细胞在小鼠、斑马鱼和鸡中分别有 81、104 和 34 个 marker。　（验证：基于公开
  scRNA-seq 数据的生信分析；Fig. S1B-S1D。 ｜ 位置：Results 第1段 / Fig. S1B-S1D）

  - **[L1]** CACIMAR 跨物种 scRNA-seq 分析鉴定出小鼠、斑马鱼、鸡间保守的视网膜细胞类型：三物种共有 resting Müller glial
  cells、GABAergic amacrine cells、retinal ganglion cells 和 cones；小鼠与斑马鱼间另有 activated
  Müller glial cells、microglia、retinal pigment epithelium、rods 等 7 类保守；斑马鱼 15 类细胞中
  11 类在小鼠中保守。　（位置：Cross-species analysis using scRNA-seq data / Fig.2A, 2B）

  - **[L1]** 保守 marker 鉴定显示：三物种四类保守细胞类型中有 24 个保守 marker，包括 resting Müller glial cells
  的 Rlbp1/rlbp1a/RLBP1；小鼠与斑马鱼间有 157 个保守 marker，其中 activated Müller glial cells 18
  个；鸡视网膜神经节细胞保守 marker 比例最高（63.9%）。　（位置：CACIMAR identifies evolutionarily conserved
  markers / Fig.2C, 2D, Fig.S1E, Table S1）

  - **[L1]** CSRN 分析显示 resting Müller glia、activated Müller glia 和 GABAergic amacrine
  cells 的胞内调控网络在三物种间保守；视网膜神经节细胞与 cones 的调控网络仅在小鼠与斑马鱼间保守；小鼠与斑马鱼 11 类保守细胞中 10 类调控网络保守。　（位置：CACIMAR
  reveals conserved intracellular regulations and regulators / Fig.3A）

  - **[L1]** Müller glia 中鉴定到三物种保守调控模块：小鼠 module 2、斑马鱼 module 2、鸡 module 1；以及小鼠 module
  5、斑马鱼 module 5、鸡 module 7（与 RNA splicing 相关）；另有部分两物种保守模块，其中斑马鱼 module 6 与鸡 module
  8 富集 DNA replication 和 cell cycle，与斑马鱼/鸡视网膜再生能力一致。　（位置：Fig.3B, Fig.S2B-S2G）

  - **[L1]** Müller glia 调控网络中鉴定到多物种同源保守转录因子：任两种间 60 个，包括 Pou2f1/pou2f1b/POU2F1；三物种保守模块中
  9 个，包括小鼠-斑马鱼间 Nfia/nfia、Pax6/pax6a、Sox4/sox4a，斑马鱼-鸡间 medf2d/MEF2D、sox5/SOX5、egr1/Egr1，以及三物种唯一保守的
  Smarca5/smarca5/SMARCA5。　（位置：Fig.3C, 3D, Fig.S3A-S3C, Table S2）

  - **[L1]** 使用 LIANA 的 SingleCellSignalR 算法计算细胞间相互作用权重，观察到小鼠与斑马鱼视网膜细胞类型间具有相似的相互作用模式。　（位置：CACIMAR
  identifies the conservation of intercellular interactions / 片段末）

  - **[L1]** 跨物种scRNA-seq分析显示，小鼠、斑马鱼和鸡的视网膜细胞类型、保守标记、调控网络和细胞间互作存在不同程度保守；小鼠与斑马鱼的保守细胞类型互作呈强正相关（R>0.66），而鸡与小鼠/斑马鱼的互作模式明显不同（R<0.21）。　（位置：Figure
  2; Figure 3E）

  - **[L1]** 在三种物种中保守的视网膜细胞类型中，cones与cones、静息Müller glia及GABAergic amacrine cells具有保守互作；cones自互作的CSII最高，并涉及App–Rpsa和App–Aplp2保守配体-受体互作。　（位置：Fig.3F;
  Fig.S3G）

  - **[L1]** 小鼠与斑马鱼之间11种保守细胞类型中，cones与bipolar cells的互作保守性最高，与视网膜组织结构中cone bipolar
  cells主要与cones互作一致。　（位置：Fig.S3H; text）

  - **[L1]** 激活的Müller glia与保守细胞类型的互作在小鼠和斑马鱼之间相关性最高（R=0.82）。　（位置：Fig.3E）

  - **[L1]** CACIMAR 可用于跨物种 scRNA-seq 数据保守性分析，通过保守性得分鉴定保守细胞类型、细胞类型特异性调控和细胞间互作。　（验证：基于公开小鼠、斑马鱼和鸡视网膜再生
  scRNA-seq 数据的纯计算分析；原文未做湿实验验证 ｜ 位置：Discussion 第1段；Key Points 第1条）

  - **[L1]** 使用小鼠、斑马鱼和鸡的公开视网膜再生 scRNA-seq 数据，CACIMAR 能识别进化距离较远物种间的保守细胞类型。　（验证：公共 scRNA-seq
  数据再分析；原文未做湿实验验证 ｜ 位置：Discussion 第1段；Key Points 第2条）

  - **[L1]** 对每个保守细胞类型，CACIMAR 可进一步鉴定保守标记和调控网络，并在 Müller 胶质细胞中识别保守调控模块和调控因子。　（验证：公共
  scRNA-seq 数据再分析；原文未做湿实验验证 ｜ 位置：Discussion 第1段；Key Points 第3条）

  - **[L1]** CACIMAR 分析细胞间互作发现，视锥细胞与视锥细胞、Müller 胶质细胞和 GABA 能无长突细胞的互作在物种间保守。　（验证：公共
  scRNA-seq 数据再分析；原文未做湿实验验证 ｜ 位置：Results 末尾；Discussion 第1段）

  - **[L1]** 甘氨酸能无长突细胞和水平细胞的胞内调控网络不保守，但这两类细胞与其他细胞类型的互作仍保守。　（验证：公共 scRNA-seq 数据再分析；原文未做湿实验验证
  ｜ 位置：Discussion 第4段）

  - **[L1]** 胞内调控与细胞间互作在物种进化中可能受到不同选择压力。　（验证：基于保守性分析结果的推断，并引用既往报道 [26]；原文未做湿实验验证 ｜
  位置：Discussion 第4段）

  - **[L1]** 跨物种批次效应是进化保守分析的主要挑战，CACIMAR 通过各物种独立单细胞聚类绕过整合聚类产生的跨物种批次效应。　（验证：方法描述及与
  Seurat、Harmony、SAMap 的比较；原文未做湿实验验证 ｜ 位置：Discussion 第2段）

  - **[L1]** 保守性得分结合系统发育树的双路方法可提高识别保守细胞类型的精度，但可能降低敏感性。　（验证：方法设计描述；原文未做湿实验验证 ｜ 位置：Discussion
  第3段）

  - **[L1]** 多数保守细胞类型具有保守调控网络，与既往报道一致。　（验证：基于本文保守性分析并引用既往报道 [26]；原文未做湿实验验证 ｜ 位置：Discussion
  第3段）

  - **[L0]** CACIMAR 识别的保守特征可能在视网膜再生等生物过程中发挥关键功能。　（位置：Discussion In summary）


