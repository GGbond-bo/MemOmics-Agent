  ## 基因 Marker

  - Rlbp1/rlbp1a/RLBP1：resting Müller glial cells，up，三物种四类保守细胞类型中的保守 marker，Fig.2C/Table
  S1

  - Pou2f1/pou2f1b/POU2F1：Müller glial cells，na，小鼠/斑马鱼/鸡任两种间保守的同源调控因子，Fig.S3A-S3C/Table
  S2

  - Nfia/nfia：Müller glial cells，na，小鼠与斑马鱼间保守调控因子，Fig.3C-3D

  - Pax6/pax6a：Müller glial cells，na，小鼠与斑马鱼间保守调控因子，Fig.3C-3D

  - Sox4/sox4a：Müller glial cells，na，小鼠与斑马鱼间保守调控因子，Fig.3C-3D

  - medf2d/MEF2D：Müller glial cells，na，斑马鱼与鸡间保守调控因子，Fig.3C-3D

  - sox5/SOX5：Müller glial cells，na，斑马鱼与鸡间保守调控因子，Fig.3C-3D

  - egr1/Egr1：Müller glial cells，na，斑马鱼与鸡间保守调控因子，Fig.3C-3D

  - Smarca5/smarca5/SMARCA5：Müller glial cells，na，唯一在三物种（小鼠、斑马鱼、鸡）间保守的调控因子，Fig.3C-3D


