  ## 基因 Marker

  - CD4：human CD4+ T cells，na，使用公开的单细胞人 CD4+ 表达谱示例

  - CCR7：naive T cells，na，Module 1 includes CCR7 and SELL/CD62L；模块1/3可区分 naive 与 activated
  T 细胞亚群

  - SELL/CD62L：naive T cells，na，Module 1 includes CCR7 and SELL/CD62L；模块1/3可区分 naive
  与 activated T 细胞亚群

  - IL7R：T cells，na，Module 3 includes IL7R and S100A4；参与区分 naive 与 activated T 细胞亚群

  - S100A4：T cells，na，Module 3 includes IL7R and S100A4；参与区分 naive 与 activated T 细胞亚群

  - IFNG：Th1 cells，up，Module 0 高亮表达 Th1 相关基因的活化 T 细胞亚群

  - TBX21：Th1 cells，up，Module 0 高亮表达 Th1 相关基因的活化 T 细胞亚群

  - PRF1：cytotoxic T cells，up，Module 2 高亮表达细胞毒性相关基因的亚群

  - GZMB：cytotoxic T cells，up，Module 2 高亮表达细胞毒性相关基因的亚群

  - FOXP3：regulatory T cells，up，Module 6 聚集与 Treg 活性相关的基因

