# 人海马体衰老snRNA-seq知识库（2026-08-12 扩充版）
# 更新说明：新增 Zhang 2021 / Wang 2022 / Zhou 2022 三篇文献解读，
#           修正 Franjic 2022 DOI/标题错误，补充原文级精细 marker 分层，
#           2026-08-12 扩充：新增 12 篇文献（Thompson 2025 / Su 2022 / Yang 2022 /
#           Sinnamon 2019 / Zhong 2020 / Chen 2024 / MAESTRO 2020 / scAGDE 2025 /
#           hECA 2025 / Acera-Mateos 2026 / Tosoni 2023 / Zhou 2022），
#           完整解读见 literature_review_20260812.md
species: Homo sapiens
tissue: hippocampus
direction: aging

cell_types:
  # ========== 神经元谱系 ==========
  - name: Excitatory neuron (ExN)
    markers:
      - SLC17A7
      - CAMK2A
    subtypes:
      - name: DG granule cell
        markers: [PROX1, NEUROD1]
        aging_note: "成人海马DG颗粒细胞新生在衰老中大幅下降; 争议存在但多数研究支持下降趋势"
      - name: CA1/CA3 pyramidal
        markers: [CAMK2A, SLC17A7]
        aging_note: "CA1锥体神经元在衰老中最易受损; 突触基因下调"
      - name: EC layer 2/3 (Franjic 2022)
        markers: [CUX2, RELN]
      - name: EC deep layer (Franjic 2022)
        markers: [TLE4, ADRA1A, THEMIS]
    aging_note: "灵长类海马 ExN 中 METTL7B 为灵长类特异亚群 marker（与脂滴/ER 蛋白相关，含 AD 相关蛋白）"
    source: "Franjic 2022 Neuron (PMID 34798047)"

  - name: Inhibitory neuron (InN)
    markers:
      - GAD1
      - GAD2
    subtypes:
      - SST+ interneuron: [SST]
      - PVALB+ interneuron: [PVALB]
      - VIP+ interneuron: [VIP]
      - LAMP5+ interneuron: [LAMP5]
    aging_note: "InN 按主要 marker (SST/PVALB/VIP/LAMP5) 区分亚群；PVALB+ 亚群在 AD 早期亚托核过度活跃"
    source: "Franjic 2022 Neuron (PMID 34798047)"

  - name: Neurogenic lineage (NSC→TAPC→Neuroblast→Granule)
    markers:
      - SOX2
      - PAX6
      - GFAP
    subtypes:
      - name: quiescent NSC (qNSC)
        markers: [SOX2, PAX6, GFAP]
      - name: transiently amplifying progenitor cell (TAPC)
        markers: [TAPC 专用 marker 待定]
        aging_note: "灵长类海马衰老中 TAPC 分裂受损最显著（Zhang 2021），是神经发生下降的细胞学核心"
      - name: Neuroblast / Immature neuron
        markers: [DCX]
        aging_note: "DCX 是经典未成熟神经元 marker，但 Franjic 2022 发现 DCX 不定义成人未成熟神经元群（检出广泛但无特异性）；Wang 2022 提出 STMN1/STMN2 为灵长类未成熟神经元更可靠 marker"
      - name: Radial glia-like cell (RGL)
        markers: [GFAP, SOX2]
        aging_note: "RGL 与星形胶质共享多个 marker，跨物种整合时 RGL 与 Astro 聚类（Franjic 2022）"
    aging_note: "成人海马神经发生争议中；Wang 2022 验证 ETNPPL 为灵长类特异 NSC marker；STMN1/STMN2 为灵长类未成熟神经元 marker"
    source: "Yao 2024 eLife, Franjic 2022 Neuron, Zhang 2021 Protein&Cell, Wang 2022 Cell Res"

  # ========== 胶质谱系 ==========
  - name: Microglia (MG)
    markers:
      - CX3CR1
      - AIF1
      - TREM2
      - P2RY12
      - TMEM119
      - C1QB
    aging_note: "人小胶质细胞在衰老中呈现促炎表型; APOE通路随年龄上调; 与小鼠共享~70%衰老DEG; 但IL1RAPL1和SPP1为人特异性; Franjic 2022 用 C1QB/F13A1/LYZ/SKAP1 分解免疫细胞为 microglia/macrophage/myeloid/T cell"
    source: "He 2024 PLoS One, Franjic 2022 Neuron"

  - name: Astrocyte
    markers:
      - GFAP
      - ALDH1L1
      - S100B
      - AQP4
    aging_note: "人海马星形胶质细胞在衰老中呈现反应性增生; 跨物种最保守的衰老细胞类型; Wang 2022 发现衰老样本中激活型星形胶质（active astrocyte）簇促进炎症"
    source: "Xiong 2025 Mol Biol Evol, Wang 2022 Cell Res"

  - name: Oligodendrocyte lineage
    markers:
      - MBP
      - PLP1
      - MOBP
    subtypes:
      - name: OPC
        markers: [PDGFRA, EGR1, GRIA4]
      - name: Committed OPC (COP)
        markers: [GPR17]
      - name: Oligodendrocyte
        markers: [MOBP, CPXM2, SLC5A11]
    aging_note: "少突胶质细胞在衰老中髓鞘相关基因下调; 亚群按 PDGFRA(OPC)/GPR17(COP)/MOBP(Oligo) 分层（Franjic 2022）"
    source: "Franjic 2022 Neuron"

  # ========== 血管谱系 ==========
  - name: Vascular cells
    markers:
      - CLDN5
      - VWF
    subtypes:
      - name: Arterial endothelial
        markers: [DKK2]
      - name: Endothelial
        markers: [CLDN5, VWF]
      - name: Pericyte
        markers: [CLDN5, ABCC9]
      - name: Venous smooth muscle
        markers: [ABCC9, P2RY1]
    aging_note: "血管谱系组合表达分型（Franjic 2022）; Zhang 2021 发现衰老内皮凝血通路失调，构成神经发生不利微环境"
    source: "Franjic 2022 Neuron, Zhang 2021 Protein&Cell"

literature:
  # ===== 核心锚点（人海马跨物种图谱）=====
  - pmid: "34798047"
    title: "Transcriptomic Taxonomy and Neurogenic Trajectories of Adult Human, Macaque and Pig Hippocampal and Entorhinal Cells"
    authors: "Franjic D et al."
    journal: "Neuron"
    year: 2022
    doi: "10.1016/j.neuron.2021.10.036"
    pmcid: "PMC8813897"
    key_findings:
      - "人/猕猴/猪海马+内嗅皮层跨物种图谱，69,461 神经元 + 149,597 非神经元"
      - "InN 按 SST/PVALB/VIP/LAMP5 分层；EC 按 CUX2/RELN(浅层) vs TLE4/ADRA1A/THEMIS(深层)"
      - "免疫细胞分解：C1QB=小胶质 / F13A1=巨噬 / LYZ=髓系 / SKAP1=T 细胞；小胶质细分 P2RY12/CD83"
      - "少突谱系：PDGFRA=OPC / GPR17=COP / MOBP=Oligo；OPC 亚群 EGR1/GRIA4；Oligo 亚群 CPXM2/SLC5A11"
      - "血管谱系：DKK2=动脉内皮 / CLDN5+VWF=内皮 / CLDN5+ABCC9=周细胞 / ABCC9+P2RY1=静脉平滑肌"
      - "关键结论：DCX 不定义成人未成熟神经元群；小鼠/猪/猕猴存在神经发生转录特征，但人类不明显"
      - "RGL 与星形胶质共享多个 marker，跨物种整合时聚类到一起"

  # ===== 灵长类海马衰老（猴侧参考）=====
  - pmid: "34052996"
    title: "Single-nucleus transcriptomic landscape of primate hippocampal aging"
    authors: "Hui Zhang, Jiaming Li, Jie Ren et al."
    journal: "Protein & Cell"
    year: 2021
    doi: "10.1007/s13238-021-00852-9"
    key_findings:
      - "首个灵长类海马衰老 snRNA 图谱，12 个细胞类型"
      - "TAPC（瞬时扩增祖细胞）分裂受损 + 神经元功能受损是衰老核心变化"
      - "衰老小胶质和少突胶质促炎反应上调；内皮凝血通路失调"
      - "神经发生微环境恶化（胶质+血管协同）"

  # ===== 猕猴海马神经发生跨寿命（猴-人对比关键）=====
  - pmid: "35750757"
    title: "Transcriptome dynamics of hippocampal neurogenesis in macaques across the lifespan and aged humans"
    authors: "Wang W, Wang M, Yang M et al."
    journal: "Cell Research"
    year: 2022
    doi: "10.1038/s41422-022-00678-y"
    key_findings:
      - "猕猴海马跨寿命神经发生转录组动力学 + 老年人类对照"
      - "13 大细胞类型；神经源性谱系从 NSC→未成熟→成熟颗粒细胞连续体"
      - "ETNPPL 验证为灵长类特异 NSC marker（免疫染色验证）"
      - "STMN1/STMN2 为灵长类未成熟神经元更可靠 marker"
      - "衰老样本中激活型星形胶质+小胶质簇促炎响应；星形胶质信号调控 NSC 增殖/静息/炎症"

  # ===== 人海马未成熟神经元（人类侧参考）=====
