# ===== 专利应用提示（2026-08-12 扩充）=====
patent_notes:
  - "Franjic 2022 是人-猕猴海马跨物种图谱，最直接支撑专利跨物种 marker 锚定（ExN/InN/Astro/OPC/Oligo/Micro/Vas 七大类+细亚型）"
  - "Wang 2022 的 ETNPPL/STMN1/STMN2 灵长类特异 marker 提示：注释猴侧 ATAC 时不能完全照搬小鼠 marker"
  - "Zhang 2021 灵长类海马衰老 12 类图谱提供猴侧细胞类型组成基线，与我们的 8 大类注释（Ex/Inh/Astro/Micro/OPC/ODC/VS/ChP）对应关系：TAPC→NSC 类、Vas→VS"
  - "marker 引用规范：人海马 marker 只引 Franjic 2022 / Yao 2024 / Zhou 2022；Xiong(树鼩)/He(小鼠) 只能作跨物种参照，不能当人海马来源"
  - "血管标记最新来源：Yang 2022（VWF/CLDN5=内皮, ABCC9/PTN=周细胞, ACTA2/TAGLN=平滑肌）；Franjic 血管谱系可作交叉验证"
  - "星形胶质亚群参考：Su 2022（AST1-AST7, AST2=SOX2+/EGFR+ 胶质发生）"
  - "生信方法参考（用于正式版方法论证）：MAESTRO 2020 整合工作流 / scAGDE 2025 人脑 scATAC 注释 / Sinnamon 2019 海马 scATAC 先驱 / Acera-Mateos 2026 多模态 benchmark"
