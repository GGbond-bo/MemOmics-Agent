content: 耐力运动强度以%VO2max或%最大心率(HFmax)表示，高强度间歇训练(HIIT)通常>80% HFmax；抗阻运动强度以%一次最大重复(1RM)表示，并需描述重复次数、组数、收缩类型等。训练周期分微周期7-21天、中周期3-8周、大周期1季/年。这些参数可标准化运动干预方案设计，用于比较不同研究的分子响应。
evidence: DOI 10.1016/j.freeradbiomed.2024.07.026 | Molecular aspects of the exercise
