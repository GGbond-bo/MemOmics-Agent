content: 骨骼肌训练适应解析推荐多组学+多细胞策略：转录组、表观基因组、蛋白质组、磷酸化蛋白质组联合，配以单细胞/单核分析；长期训练重塑转录、蛋白质和代谢表型，且涉及肌纤维、卫星细胞、免疫细胞、内皮等多种细胞类型。急性运动回合信号如何转化为长期训练适应的转录调控机制尚待阐明；现有知识不足以支撑个体化训练方案设计。来源：Free
  Radic Biol Med 2024 综述（DOI 10.1016/j.freeradbiomed.2024.07.026）。
evidence: DOI 10.1016/j.freeradbiomed.2024.07.026 | Molecular aspects of the exercise
  response and training adaptation in skeletal muscle | Free Radical Biology and Medicine
  2024
