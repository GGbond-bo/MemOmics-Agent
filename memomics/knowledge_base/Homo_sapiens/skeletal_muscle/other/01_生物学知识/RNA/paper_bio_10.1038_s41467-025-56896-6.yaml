content: '## 结论（证据链分级：L0 无来源 / L1 有来源未验证 / L2 实验验证 / L3 临床级）

  - **[L2]** Human skeletal muscle fibers are heterogeneous beyond MYH-based classification;
  heterogeneity is multidimensional.　（验证：原文摘要/结果；基于1050根单肌纤维转录组和1038根单肌纤维蛋白组（Fig.1A,
  Supplementary Fig.1A, Supplementary Table1））

  - **[L2]** Metabolic, ribosomal, and cell junction proteins are sources of variation
  between myofibers in addition to myosin heavy chain isoforms.　（验证：原文摘要/结果陈述；单肌纤维转录组/蛋白质组数据，具体图号未在片段中给出）

  - **[L2]** Slow and fast fiber clusters are identified, but type 2X fibers are not
  phenotypically distinct from other fast fibers.　（验证：原文摘要/结果陈述；单肌纤维转录组/蛋白质组数据，具体图号未在片段中给出）

  - **[L2]** MYH-based classifications do not adequately describe myofiber phenotype
  in nemaline myopathy.　（验证：原文摘要/结果陈述；对nemaline myopathy单肌纤维蛋白质组分析，具体图号未在片段中给出）

  - **[L2]** High-sensitivity, high-throughput single muscle fiber transcriptomic
  and proteomic workflows were developed.　（验证：方法学开发；Fig.1A and Supplementary Fig.1A；转录组1050根/14健康成人，蛋白质组1038根/5健康成人（Supplementary
  Table1））

  - **[L2]** 联合单纤维转录组和蛋白质组可检测大量转录本与蛋白，过滤后分别获得925和974根纤维数据，平均每根纤维检测4257±1557个基因和2015±234个蛋白。　（验证：1000
  fiber transcriptomics and proteomics studies；过滤前后数据与均值见 Figs. 1A、Supplementary Dataset
  1–4、Supplementary figs. 1B–C。 ｜ 位置：Results 第1段 / Fig.1A；Supplementary Dataset 1–4）

  - **[L2]** MYH7/MYH2/MYH1表达排序并计算底部拐点可对肌纤维进行MYH分型；转录组和蛋白质组均显示多数为纯1型（34–35%）和2A型（36–38%），并检测到16–19%的2A/2X混合型。　（验证：Figs.1B–F
  展示MYH动态范围曲线、阈值与分型分布；Supplementary Table 2 给出分型规则；Supplementary fig.2A 展示个体间变异。 ｜
  位置：Results 第2段 / Figs.1B–F；Supplementary Table 2；Supplementary fig.2A）

  - **[L2]** 纯2X型肌纤维只能在RNA水平检测到，在蛋白质水平检测不到，提示快肌MYH表达至少部分受转录后调控。　（验证：RNA与蛋白分型分布对比见
  Fig.1E–F；抗体dot blot验证见 Supplementary fig.2B。 ｜ 位置：Results 第2段 / Figs.1E–F；Supplementary
  fig.2B）

  - **[L2]** 蛋白质组学MYH分型与抗体dot blot对纯1型和2A型鉴定100%一致，且蛋白质组学对混合纤维和每根纤维内各MYH比例的定量更敏感。　（验证：使用antibody-based
  dot blot技术验证，两种方法对pure type 1和type 2A鉴定100%一致，见 Supplementary fig.2B。 ｜ 位置：Results
  第3段 / Supplementary fig.2B）

  - **[L2]** 基于全转录组或全蛋白质组的UMAP降维仅区分快、慢两类纤维，不能区分2A、2X或2A/2X混合型；MYH1以及ACTN3、MYLK2等经典2X标志物不能区分不同快肌纤维类型。　（验证：对6个主成分进行UMAP降维，转录组和蛋白质组UMAP及MYH特征图见
  Fig.1G–J；MYH1、ACTN3、MYLK2特征见 Supplementary figs.4A–B；主成分分析见 Supplementary figs.3A–B。
  ｜ 位置：Results 第4段 / Figs.1G–J；Supplementary figs.3A–B,4A–B）

  - **[L2]** 肌纤维在转录组和蛋白质组中均不按参与者或测试日聚类，提示骨骼肌纤维的个体内变异大于个体间变异。　（验证：转录组和蛋白质组UMAP按参与者或测试日着色见
  Supplementary figs.3C–E。 ｜ 位置：Results 第4段 / Supplementary figs.3C–E）

  - **[L2]** MYH1[+]纤维在整体转录组或蛋白质组层面并不能与其他快肌纤维明显区分，MYH1丰度不足以充分反映骨骼肌纤维的转录组/蛋白质组特征。　（验证：单纤维转录组与蛋白质组相关性分析及UMAP分析（Supplementary
  figs. 4C–J） ｜ 位置：第一段 / Supplementary figs. 4C–J）

  - **[L2]** 仅基于单个肌球蛋白重链家族基因/蛋白亚型进行纤维分型可能不足以捕捉骨骼肌纤维的真实异质性；即使使用TPM3、TNNT1、MYL3、ATP2A2等经典慢肌纤维型蛋白，仍分别有约25%和33%的纤维不能被所有基因/蛋白亚型一致分类为纯慢肌纤维。　（验证：转录组与蛋白质组中慢肌亚型与MYH7的Pearson相关分析及分型分析（Supplementary
  fig. 5A–D） ｜ 位置：Considerable skeletal muscle fiber heterogeneity beyond myosin heavy
  chain isoforms 章节 / Supplementary fig. 5A–D）

  - **[L2]** MYH基于纤维类型主要解释PC2，而PC1代表独立于MYH纤维型的显著异质性，主要由转录组中的细胞-细胞黏附和核糖体含量、蛋白质组中的costamere和核糖体蛋白驱动，并呈连续梯度而非离散亚群。　（验证：PCA、UMAP与过表征分析（Fig.
  2A–F；Supplementary figs. 6A–E；Supplementary Dataset 5–7） ｜ 位置：Considerable skeletal
  muscle fiber heterogeneity beyond myosin heavy chain isoforms 章节 / Fig. 2A–F）

  - **[L2]** 慢/快肌纤维型相关变异（PC2驱动因素）在转录组与蛋白质组间高度相关（r=0.663），但独立于MYH纤维型的变异（PC1驱动因素）在转录组与蛋白质组间无相关（r=-0.027），提示该异质性在很大程度上受转录后调控。　（验证：PC1与PC2驱动因素在转录组和蛋白质组间的Pearson相关分析（Fig.
  2G,H） ｜ 位置：Fiber heterogeneity is post-transcriptionally regulated by ribosomal
  heterogeneity 章节 / Fig. 2G,H）

  - **[L2]** 骨骼肌纤维存在核糖体异质性与专业化：核糖体蛋白可无监督聚类为三个簇，其中ribosomal_cluster_1与RPL38共调控并向PC1正方向升高，ribosomal_cluster_2与RPS13共调控并向PC1负方向升高，ribosomal_cluster_3可视为核心核糖体蛋白。　（验证：蛋白质组PCA、核糖体蛋白无监督层次聚类及80S核糖体结构映射（Fig.
  3A–E；Supplementary fig. 7C,D；Supplementary Dataset 8） ｜ 位置：Fiber heterogeneity is
  post-transcriptionally regulated by ribosomal heterogeneity 章节 / Fig. 3A–E）

  - **[L2]** 核糖体异质性在骨骼肌纤维中呈转录后调控特征，因为PC1相关的不同核糖体特征在转录组中不可见。　（验证：转录组与蛋白质组中核糖体特征的比较分析（Supplementary
  fig. 7B） ｜ 位置：Fiber heterogeneity is post-transcriptionally regulated by ribosomal
  heterogeneity 章节 / Supplementary fig. 7B）

  - **[L2]** Nemaline肌病使骨骼肌纤维向更快、氧化代谢更低的纤维类型转变。　（验证：对ACTA1-和TNNT1-NM患者及对照（n=3/组）单肌纤维蛋白质组分析，PCA投射到1000纤维健康数据集显示肌病纤维沿PC2下移并与健康快肌重叠；免疫组化验证纤维类型改变（Fig.6A-D,
  Fig.6H-I）。 ｜ 位置：Fig.6 / Results）

  - **[L2]** ACTA1-和TNNT1-NM对MYH基础纤维类型比例影响异质：ACTA1-NM呈1型纤维优势，TNNT1-NM呈1型纤维比例降低/快肌优势。　（验证：免疫组化显示ACTA1-NM患者1型纤维优势而TNNT1-NM相反（Fig.6A）；MYH基础纤维类型比例按参与者展示（Fig.6B），并见Supplementary
  fig.11A。 ｜ 位置：Fig.6A-B / Supplementary fig.11A）

  - **[L2]** 尽管ACTA1-NM在MYH基础上表现为1型纤维偏移，两种Nemaline肌病的单纤维蛋白质组均更接近快肌纤维。　（验证：单肌纤维蛋白质组PCA及投射到1000纤维健康PCA，显示多数Nemaline肌病纤维沿PC2下移并与健康快肌重叠，Fig.6C-D。
  ｜ 位置：Fig.6C-D）

  - **[L2]** Nemaline肌病中发生协调的线粒体蛋白减少。　（验证：对差异丰富蛋白进行基因集富集分析，显示线粒体蛋白协调减少，Fig.6H-I。 ｜
  位置：Fig.6H-I）

  - **[L2]** ACTA1-和TNNT1-nemaline myopathy对蛋白质组的影响高度相关（r = 0.736）且具有合理重叠。　（验证：单纤维蛋白质组学相关性分析，Supplementary
  fig. 11AB ｜ 位置：Results（Supplementary fig. 11AB））

  - **[L2]** TNNT1-nemaline myopathy比ACTA1-nemaline myopathy更严重，表现为更明显的线粒体蛋白减少、免疫系统蛋白增加以及萎缩/发育不良。　（验证：单纤维蛋白质组差异分析、免疫/线粒体富集分析，Fig.
  6A, 6G–H, Supplementary figs. 11C, 11H–I ｜ 位置：Results（Fig. 6A, 6G–H））

  - **[L2]** ACTA1-和TNNT1-nemaline myopathy均上调免疫系统过程；TNNT1-nemaline myopathy还上调细胞黏附。　（验证：富集分析，Fig.
  6H ｜ 位置：Results（Fig. 6H））

  - **[L2]** 两组患者均过表达参与免疫反应和肌膜修复机制的细胞外蛋白，包括annexins（ANXA1/ANXA2/ANXA5）及其互作因子S100A11，提示对肌原纤维不稳定所致损伤的修复反应。　（验证：单纤维蛋白质组学检测，Supplementary
  figs. 12B–C ｜ 位置：Results（Supplementary figs. 12B–C））

  - **[L2]** MFAP4在TNNT1-nemaline myopathy中上调而在ACTA1-nemaline myopathy中不变；SKIC8在TNNT1-nemaline
  myopathy中下调而在ACTA1中不受影响。　（验证：单纤维蛋白质组差异丰度分析，Supplementary fig. 11A ｜ 位置：Results（Supplementary
  fig. 11A））

  - **[L2]** ENSG00000232046_TR1_ORF437（LINC01798）在ACTA1-nemaline myopathy的1型和2A型纤维中较健康对照上调。　（验证：单纤维蛋白质组学，Supplementary
  figs. 12A, Supplementary Dataset 24 ｜ 位置：Results（Supplementary figs. 12A））

  - **[L2]** ENSG00000215483_TR14_ORF67和ENSG00000229425_TR25_ORF40仅在1型纤维中差异丰度。　（验证：单纤维蛋白质组学，Supplementary
  Dataset 23 ｜ 位置：Results（Supplementary Dataset 23））

  - **[L1]** ENSG00000215483_TR14_ORF67此前被报道参与细胞周期调控。　（位置：Results[56]）

  - **[L2]** 核糖体蛋白总体上不受nemaline myopathy影响，但RPS17在ACTA1-nemaline myopathy中下调。　（验证：单纤维蛋白质组学，Fig.
  6E ｜ 位置：Results（Fig. 6E））

  - **[L2]** TNNT1-nemaline myopathy的bulk肌肉活检蛋白质组可重现单纤维分析中的差异蛋白和生物过程，但丧失区分纤维类型及异质性效应的能力。　（验证：bulk蛋白质组分析，n=3/组，Supplementary
  figs. 13A–D, Datasets 25–27 ｜ 位置：Results（Supplementary fig. 13））

  - **[L2]** 两种nemaline myopathy均使MYH-based fiber type与骨骼肌纤维代谢解偶联，向更快、低氧化的肌肉蛋白质组转变。　（验证：单纤维蛋白质组学与MYH分型比较，Fig.
  6H, Supplementary figs. 11D–I ｜ 位置：Results/Discussion（Fig. 6H））

  - **[L2]** 单肌肉纤维蛋白质组学可揭示靶向免疫印迹难以显现的临床生物学，并说明仅依赖MYH分型描述表型适应存在局限。　（验证：单纤维蛋白质组学与bulk蛋白质组比较，Fig.
  6, Supplementary fig. 13 ｜ 位置：Discussion）

  - **[L2]** 人类骨骼肌纤维可能不应按MYH分为三类，而应按代谢和收缩特性分为慢肌和快肌两个聚类。　（验证：转录组/蛋白质组聚类分析仅稳定识别两个聚类，Discussion
  ｜ 位置：Discussion）

  - **[L2]** 骨骼肌纤维并非离散聚类，而是沿连续谱分布；除收缩和代谢特征外，细胞连接和翻译机器相关特征也可区分纤维，并存在独立于快慢肌类型的核糖体异质性。　（验证：对14名健康参与者进行单肌纤维转录组学（1000
  fiber transcriptomics）和单肌纤维蛋白质组学分析；见 Discussion 与 1000 fiber transcriptomics 部分
  ｜ 位置：Discussion 第1段 / 1000 fiber transcriptomics）

  - **[L2]** 单肌纤维蛋白质组学可揭示骨骼肌临床病理生理，其信息深度可与 bulk 组织蛋白质组学相当，并能纳入纤维间异质性和肌纤维类型。　（验证：对
  nemaline myopathy 患者单肌纤维进行蛋白质组学分析，并与 bulk 蛋白质组分析比较 ｜ 位置：Discussion 第2段）

  - **[L2]** ACTA1- 和 TNNT1-nemaline myopathy 患者肌纤维除 MYH 相关纤维类型比例改变外，还存在氧化和细胞外重塑，且与
  MYH 纤维类型转换解耦；annexins 等应激相关分泌蛋白上调，可能参与肌膜修复。　（验证：对 ACTA1- 和 TNNT1-nemaline myopathy
  患者与健康对照的单肌纤维蛋白质组比较，并参考既往 TNNT1 纤维化报道 ｜ 位置：Discussion 第2段）

  - **[L2]** 数据挑战基于 MYH 的经典肌纤维类型定义，提示需要重新定义骨骼肌纤维分类和异质性。　（验证：单肌纤维转录组和蛋白质组揭示除 MYH 外的异质性来源
  ｜ 位置：Discussion 最后一段）

  - **[L2]** RNAscope联合免疫组化/免疫荧光可在人骨骼肌活检切片中检测LINC01405、Lnc-ERCC5-5/RP11-255P5.3等lncRNA，并通过MYH2、MYH7和TNNT1标记肌纤维及其亚型。　（验证：8
  µm固定冰冻人肌肉活检切片进行RNAscope Multiplex Fluorescent Assay V2，3例个体共计数187根肌纤维；10 µm冰冻切片进行MYH7/MYH2与TNNT1免疫荧光染色并成像。
  ｜ 位置：RNAscope；Immunostaining for muscle sections）


