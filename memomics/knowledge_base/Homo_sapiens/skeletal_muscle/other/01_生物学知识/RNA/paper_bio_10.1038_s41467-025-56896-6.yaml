  ## 基因 Marker

  - MYH isoforms：skeletal muscle myofibers，na，传统肌纤维分类标记；本文认为MYH不足以描述肌纤维异质性

  - MYH7：慢肌纤维/1型肌纤维，up，慢肌纤维标志，用于MYH分型；MYH7阳性定义纯1型纤维。

  - MYH2：快肌纤维/2A型肌纤维，up，2A型标志，用于MYH分型；MYH2阳性定义2A型或2A/2X混合型。

  - MYH1：快肌纤维/2X型相关，up，用于2X及2A/2X分型；但全转录组/蛋白质组UMAP不能区分不同快肌纤维类型。

  - ACTA1：骨骼肌纤维，up，肌肉收缩相关高表达特征。

  - TNNT1：骨骼肌纤维，up，肌肉收缩相关高表达特征。

  - TNNT3：骨骼肌纤维，up，肌肉收缩相关高表达特征。

  - ACTN3：2X型肌纤维相关，na，经典2X纤维标志物，但在全转录组或蛋白质组中不区分不同快肌纤维类型。

  - MYLK2：2X型肌纤维相关，na，经典2X纤维标志物，但在全转录组或蛋白质组中不区分不同快肌纤维类型。

  - MYH7：慢肌1型纤维，up，慢肌纤维型标志；与TPM3、TNNT1、MYL3、ATP2A2慢亚型高度但不完全相关

  - MYH2：快肌2A/2X及混合型纤维，up，快肌纤维型相关标志；与MYH7相比，MYH2与较多转录本/蛋白正相关

