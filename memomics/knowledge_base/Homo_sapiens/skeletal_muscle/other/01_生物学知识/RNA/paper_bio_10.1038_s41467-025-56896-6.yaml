content: '## 结论

  - 人类骨骼肌纤维异质性是多维的，变异来源包括肌球蛋白重链亚型、代谢、核糖体和细胞连接蛋白。

  - 慢肌和快肌纤维簇可被鉴定，但2X型纤维在表型上与其他快肌纤维无显著区分。

  - 基于肌球蛋白重链的分类不能充分描述杆状体肌病中肌纤维的表型。

  - 杆状体肌病中单肌纤维蛋白质组显示向非氧化型纤维的协调转变，且独立于MYH型纤维类型。

  - 通过转录组和蛋白质组分别分析了1050和1038根单肌纤维，实现了单纤维水平的人类骨骼肌异质性研究。

  - 开发了单肌纤维转录组和蛋白质组的高灵敏度高通量流程。

  - 转录组分析通过样本特异分子条形码实现96根纤维混合处理，并进行每纤维约1M读段的深测序。

  - 蛋白质组采用21分钟短梯度与DIA-PASEF采集在timsTOF质谱仪上实现高通量与深度。

  - 健康成人供体分析中，转录组覆盖1050根纤维，蛋白质组覆盖1038根纤维。

  - 共检测到27237个转录本和2983个蛋白质；过滤后平均每纤维检测4257±1557个基因和2015±234个蛋白质。

  - 个体内变异大于个体间，可能由纤维长度和横截面积差异导致。

  - 大多数蛋白质的变异系数低于20%。

  - 肌肉收缩相关基因（ACTA1、MYH2、MYH7、TNNT1、TNNT3）高表达。

  - 转录组与蛋白质组共享大部分特征，平均UMI计数/LFQ强度相关系数r=0.52。

  - Type 2X is not a distinct fiber type when the whole transcriptome or proteome
  is considered.

  - MYH7 and MYH2 show pronounced on/off expression profiles, whereas MYH1 does not
  discriminate fast fiber subtypes.

  - Most skeletal muscle fibers are pure type 1 (34–35%) or type 2A (36–38%), with
  16–19% hybrid 2A/2X fibers.

  - Pure type 2X fibers were detected only at the RNA level, not at the protein level,
  suggesting post-transcriptional regulation of fast MYH expression.

  - Proteomics-based fiber typing showed 100% agreement with antibody-based dot blot
  for pure type 1 and type 2A fibers and was superior for detecting hybrid fibers.

  - 基于单一肌球蛋白重链(MYH)基因/蛋白异构体的纤维分型不足以捕获骨骼肌纤维的真正异质性

  - 多基因/蛋白异构体联合分型会引入额外复杂性，即使对公认的慢纤维特异蛋白也是如此

  - MYH-based纤维类型只解释了PC2的变异，PC1的变异主要由细胞-细胞粘附、核糖体含量及costamere相关蛋白驱动

  - 慢/快纤维类型无关的异质性呈连续分布，而非离散亚群

  - 慢型标志蛋白(TPM3、TNNT1、MYL3、ATP2A2)与MYH7相关性高但非完全一致

  - 转录组中约25%和蛋白质组中约33%的纤维未被所有慢型标志物归类为纯慢纤维

  - Slow/fast fiber type-specific contractile and metabolic profiles are transcriptionally
  regulated (PC2 transcriptome-proteome correlation r=0.663).

  - Fiber type-independent variance is largely post-transcriptionally regulated, as
  PC1 drivers show no transcriptome-proteome correlation (r=-0.027).

  - Ribosomal protein heterogeneity drives fiber type-independent heterogeneity in
  skeletal muscle fibers.

  - Ribosomal proteins form three clusters: two specialized clusters coregulated with
  RPL38 and RPS13, and one core cluster.

  - Ribosomal proteins with variable stoichiometry localize to the ribosome surface
  and near the mRNA exit tunnel, supporting selective translation.

  - LINC01405 在慢肌纤维中特异性高表达，且在骨骼肌中特异，可能参与纤维类型调控。

  - RP11-255P5.3（lnc-ERCC5-5）在快肌纤维中特异性高表达。

  - LINC01405 被鉴定为编码微蛋白的基因，其中一个微蛋白产物呈慢肌纤维特异性。

  - 在 1000 纤维蛋白质组数据中，从 305 个非编码转录本中鉴定出 197 个微蛋白，来自 22 个不同转录本，其中 71 个在慢肌和快肌纤维间差异调节。

  - Type 2X fibers may not be a distinct sub-classification of skeletal muscle fibers.

  - Metabolic, ribosomal, and cell junction proteins are major determinants of skeletal
  muscle fiber heterogeneity.

  - MYH-based fiber typing does not capture the complete heterogeneity of skeletal
  muscle, particularly under perturbed conditions.

  - Nemaline myopathies induce a shift towards faster, less oxidative fibers regardless
  of MYH-based fiber type.

  - Clustering analyses identify only two distinct clusters (slow and fast fibers)
  rather than three MYH-based types.

  - Ribosomal heterogeneity across skeletal muscle fibers drives slow/fast-fiber-type-independent
  heterogeneity.

  - Single muscle fiber proteomics captures depth similar to bulk tissue omics and
  additionally reveals inter-fiber heterogeneity.

  - Upregulation of annexins in nemaline myopathy fibers may represent a cellular
  response to rescue severely atrophying fibers.


