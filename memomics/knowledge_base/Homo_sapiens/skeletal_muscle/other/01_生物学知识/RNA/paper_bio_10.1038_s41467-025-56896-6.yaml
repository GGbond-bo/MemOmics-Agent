  ## 基因 Marker

  - MYH：skeletal muscle fibers，na，传统肌纤维分类基于肌球蛋白重链亚型（MYH）特征，定义type 1、type 2A和type 2X纤维。

  - ACTA1：骨骼肌纤维，up，高表达，肌肉收缩相关

  - MYH2：骨骼肌纤维，up，高表达，肌肉收缩相关

  - MYH7：骨骼肌纤维，up，高表达，肌肉收缩相关

  - TNNT1：骨骼肌纤维，up，高表达，肌肉收缩相关

  - TNNT3：骨骼肌纤维，up，高表达，肌肉收缩相关

  - MYH7：type 1 (slow) muscle fiber，up，Defines type 1 fibers; has pronounced on/off
  expression in transcriptomics and proteomics.

  - MYH2：type 2A (fast) muscle fiber，up，Defines type 2A fibers; has pronounced on/off
  expression in transcriptomics and proteomics.

  - MYH1：type 2X (fast) muscle fiber，up，Used to define type 2X fibers, but MYH1+ fibers
  are not distinct from other fast fibers when whole transcriptome/proteome is considered.

  - ACTN3：type 2X (fast) muscle fiber，na，Classical marker of type 2X fibers, but does
  not discriminate between distinct fiber types in UMAP analysis.

  - MYLK2：type 2X (fast) muscle fiber，na，Classical marker of type 2X fibers, but does
  not discriminate between distinct fiber types in UMAP analysis.

  - MYH7：type 1 slow fiber，up，慢肌球蛋白重链亚型，作为慢纤维分型的主要参考

  - TPM3：slow skeletal muscle fiber，up，established slow fiber type-specific protein；与MYH7高度相关但非完全一致

  - TNNT1：slow skeletal muscle fiber，up，established slow fiber type-specific protein；与MYH7相关

  - MYL3：slow skeletal muscle fiber，up，established slow fiber type-specific protein；与MYH7相关

  - ATP2A2：slow skeletal muscle fiber，up，established slow fiber type-specific protein；与MYH7相关

  - CHCHD10：skeletal muscle fiber，na，与神经肌肉疾病相关，在纤维间呈连续表达，不依赖MYH纤维类型

  - SLIT3：skeletal muscle fiber，na，与肌肉流失相关，呈MYH纤维类型非依赖的连续表达

  - CTDNEP1：skeletal muscle fiber，na，与肌肉疾病相关，呈连续表达模式

  - UGDH：skeletal muscle fiber，na，蛋白质组中与神经系统疾病相关，呈连续表达

  - PHIP：skeletal muscle fiber，na，蛋白质组中与胰岛素信号相关，呈连续表达

  - HIST1H2AB：skeletal muscle fiber，na，蛋白质组中与转录相关，呈连续表达

  - RPL38：skeletal muscle fiber，up，Major driver of PC1 positive direction; ribosomal
  cluster 1; highly expressed in skeletal muscle

  - RPS13：skeletal muscle fiber，up，Major driver of PC1 negative direction; ribosomal
  cluster 2; highly expressed in skeletal muscle

  - RPL18：skeletal muscle fiber，up，Enriched in the negative direction of PC1

  - RPS18：skeletal muscle fiber，up，Enriched in the negative direction of PC1

  - RPL31：skeletal muscle fiber，up，Major driver in the positive direction of PC1

  - RPL35：skeletal muscle fiber，up，Major driver in the positive direction of PC1

  - RPL10A：skeletal muscle fiber，na，Member of ribosomal cluster 1/2; previously shown
  to regulate selective translation

  - RPS19：skeletal muscle fiber，na，Member of ribosomal cluster 1/2; previously shown
  to regulate selective translation

  - RPS25：skeletal muscle fiber，na，Member of ribosomal cluster 1/2; previously shown
  to regulate selective translation

  - LINC01405：slow skeletal muscle fibers，up，慢肌纤维特异性表达；RNAscope 验证；编码微蛋白

  - RP11-255P5.3：fast skeletal muscle fibers，up，快肌纤维特异性表达；对应 lnc-ERCC5-5；RNAscope
  验证

  - MYH1：type 2X fibers，na，mRNA expression high (70-90%) but no pure type 2X fibers
  at protein level; hybrid 2A/2X fibers observed.

  - MYH2：type 2A/2X hybrid fibers，na，Protein abundance in hybrid fibers; no pure fast
  fiber 100% for any MYH isoform.

  - ACTA1：nemaline myopathy muscle fibers，na，Associated with ACTA1-nemaline myopathy;
  fiber type proportions differ from healthy controls.

  - TNNT1：nemaline myopathy muscle fibers，na，Associated with TNNT1-nemaline myopathy;
  fibrosis previously reported.

