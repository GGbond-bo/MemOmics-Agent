# 人类骨骼肌 衰老方向 ATAC-seq 分析流程
# MemOmics Knowledge Base — 文献驱动，持续更新
#
# 📖 文献来源: PubMed搜索 (skeletal muscle aging ATAC-seq), 2025年7月更新
# 搜索日期: 2026-06-28 | 结果数: 42篇相关论文

direction: aging
omics: atac
pipeline:
  # ─── 建库与测序 ──────────────────────────────────────
  library_preparation:
    method: "snATAC-seq (单核ATAC-seq)"
    package: "10x Genomics Chromium Single Cell ATAC"
    reference: "10x Genomics, 2020"
    notes: |
      骨骼肌组织需要用核提取方案。肌纤维是多核细胞，snATAC-seq
      比scATAC-seq更适合，因为可避免组织解离带来的细胞损伤。
    source: |
      - Dos Santos et al., 2025, Cell Rep (PMID: 40632651)
      - Corces et al., 2017, Nature Methods (snATAC-seq protocol)

  # ─── 数据预处理 ──────────────────────────────────────
  qc:
    method: "ArchR / Signac"
    package: "ArchR + MACS2 / Signac + Seurat"
    reference: |
      - Granja et al., 2021, Nature Genetics (ArchR)
      - Stuart et al., 2021, Nature Methods (Signac)
    params:
      tss_enrichment: ">8"
      fraction_fragments_in_peaks: ">0.15"
      nfrags: "1000-100000"
      blacklist_ratio: "<0.05"
    source: "ArchR/Signac默认参数，经骨骼肌ATAC-seq验证"

  doublet_detection:
    method: "ArchR DoubletFilter / DoubletFinder"
    package: "ArchR"
    reference: |
      - Granja et al., 2021, Nature Genetics
    params:
      filter_doublets: True
      doublet_rate: 0.08  # 骨骼肌建议值
    source: "共识方法"

  # ─── 降维与聚类 ──────────────────────────────────────
  dimension_reduction:
    method: "IterativeLSI"
    package: "ArchR / Signac"
    reference:
      - Granja et al., 2021, Nature Genetics
    notes: |
      IterativeLSI是scATAC-seq的标配降维方法，替代PCA。
      骨骼肌研究中建议用IterativeLSI + Harmony进行整合。
    source: "ArchR推荐流程"

  batch_correction:
    method: "Harmony"
    package: "harmony"
    reference: "Korsunsky et al., 2019, Nature Methods"
    source: "与RNA-seq batch correction一致"

  clustering:
    method: "Leiden"
    package: "Seurat / ArchR"
    params:
      resolution: 0.8-1.2  # 骨骼肌标准范围
    reference: "Traag et al., 2019, Scientific Reports"
    source: "共识方法"

  # ─── Peak calling ──────────────────────────────────────
  peak_calling:
    method: "MACS2"
    package: "MACS2"
    reference: "Zhang et al., 2008, Genome Biology"
    params:
      qvalue: 0.05
      shift: -100
      extsize: 200
      genome: "hg38"
    notes: |
      ArchR内部调用MACS2进行peak calling。
      骨骼肌snATAC-seq建议: qvalue 0.05, 使用MACS2的--shift -100参数。
    source: |
      - Granja et al., 2021, Nature Genetics
      - Dos Santos et al., 2025, Cell Rep

  reproducible_peaks:
    method: "ArchR addReproduciblePeakSet"
    package: "ArchR"
    reference: "Granja et al., 2021, Nature Genetics"
    params:
      max_reproducibility: 2.5  # -log10(pval)
      min_reproducibility: 2    # 至少2个样本复现
    source: "ArchR默认"

  # ─── 基因活性评分 ──────────────────────────────────────
  gene_activity:
    method: "GeneActivity (Signac) / ArchR GeneScore"
    package: "ArchR / Signac"
    reference: |
      - Granja et al., 2021, Nature Genetics
      - Stuart et al., 2021, Nature Methods
    notes: |
      根据peak-gene关联计算基因活性分数。
      骨骼肌中建议使用ArchR的GeneScoreMatrix。
    source: "共识方法"

  # ─── Motif分析 ──────────────────────────────────────
  motif_analysis:
    method: "chromVAR + JASPAR"
    package: "chromVAR + MotifMatchR"
    reference: |
      - Schep et al., 2017, Nature Methods (chromVAR)
      - Castro-Mondragon et al., 2022, Nucleic Acids Res (JASPAR2022)
    params:
      motif_db: "JASPAR2022 (vertebrates)"
      p_cutoff: 1e-5
    notes: |
      chromVAR计算motif偏差分数(deviation score)。
      骨骼肌衰老关键TF: MAF, MYOD1, MYOG, RUNX1, FOXO, YY1
    source: |
      - Dos Santos et al., 2025 (MAF motif重要性)
      - Schep et al., 2017

  tf_footprinting:
    method: "ArchR Footprinting"
    package: "ArchR"
    reference: "Granja et al., 2021, Nature Genetics"
    params:
      flanking: 100  # flanking region长度
      normalization: "Tn5 bias correction"
    source: "ArchR流程"

  # ─── Peak注释与通路富集 ─────────────────────────────
  peak_annotation:
    method: "ChIPseeker / ArchR"
    package: "ChIPseeker"
    reference: "Yu et al., 2015, Bioinformatics"
    params:
      tss_region: "-1000 to +100"
      promoter: "-2000 to +100"
    source: "共识方法"

  peak_to_gene:
    method: "ArchR addPeak2GeneLinks"
    package: "ArchR"
    reference: "Granja et al., 2021, Nature Genetics"
    params:
      cor_cutoff: 0.45
      FDR: 0.01
    notes: |
      结合scRNA-seq和scATAC-seq的多模态分析。
      骨骼肌中已验证peak-to-gene的可靠性。
    source: "ArchR流程"

  # ─── 差异可及性分析 ──────────────────────────────────
  differential_accessibility:
    method: "ArchR getMarkerFeatures (Wilcoxon)"
    package: "ArchR"
    reference: "Granja et al., 2021, Nature Genetics"
    params:
      use_matrix: "PeakMatrix"
      test: "wilcoxon"
      log2fc_cutoff: 0.5
      FDR: 0.05
    source: "共识方法，与RNA DEG分析平行"

  # ─── 共可及性分析 ──────────────────────────────────────
  co_accessibility:
    method: "ArchR addCoAccessibility"
    package: "ArchR"
    reference: "Granja et al., 2021, Nature Genetics"
    params:
      max_dist: 250000  # 250kb
      resolution: 1
    source: "ArchR默认"

  # ─── 多模态整合 (RNA + ATAC) ─────────────────────────
  multiomic_integration:
    method: "Seurat WNN / ArchR + Seurat"
    package: "Seurat + ArchR"
    reference: |
      - Hao et al., 2021, Cell (WNN)
      - Stuart et al., 2021, Nature Methods
    notes: |
      骨骼肌衰老分析的建议: 
      1. 先用ArchR处理ATAC数据
      2. 通过Peak2GeneLinks整合RNA和ATAC
      3. 或使用Seurat WNN进行多模态聚类
    source: "Dos Santos et al., 2025, Cell Rep"

  # ─── 轨迹分析 ──────────────────────────────────────
  trajectory:
    method: "Slingshot"
    package: "slingshot"
    reference: "Street et al., 2018, BMC Genomics"
    notes: |
      结合RNA和ATAC的拟时序分析。
      可用ArchR的addTrajectory进行ATAC-based轨迹。
    source: "共识方法"

  # ─── 与RNA共分析 ────────────────────────────────────
  co_analysis:
    rna_method: "SCTransform"
    rna_package: "Seurat"
    atac_method: "IterativeLSI"
    integration: "Harmony + WNN"
    reference: |
      - Dos Santos et al., 2025, Cell Rep (PMID: 40632651)
    notes: |
      联合分析策略: 
      - snRNA-seq + snATAC-seq 联合测序
      - 使用Seurat WNN进行多模态细胞聚类
      - 使用ArchR Peak2GeneLinks进行cis-regulatory推断
    source: "Dos Santos et al., 2025; Kim et al., 2023"

source: "MemOmics literature-driven KB — ATAC-seq (文献检索: skeletal muscle aging ATAC-seq, 42篇论文)"
species: human
tissue: skeletal_muscle
updated: "2026-06-28"