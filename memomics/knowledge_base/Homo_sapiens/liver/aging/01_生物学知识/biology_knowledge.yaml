  - Nikopoulou et al. 2023, Nature Aging (PMID: 37946043) — 空间+scATAC+scRNA多组学
  - Hepatology 2024 (PMC10871588, PMID: 38334462关联) — 肝脏免疫衰老scRNA-seq
  - Hepatology 2025 (PMID: 40622856) — 衰老破坏肝细胞区域化稳态
  - Nature Communications 2025 (PMID: 39747095) — 人类肝脏MERFISH空间转录组
