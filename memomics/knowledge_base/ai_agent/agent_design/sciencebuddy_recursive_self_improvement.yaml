content: "## 一句话定位\n交互式科研工作台（multimodal workspace + 可插拔 harness），提出 **recursive-in-recursive（递归套递归）自改进**范式：**内层递归**在模型固定下进化\
  \ harness（指令/技能/上下文管理），**外层递归**在进化后的 harness 下用 **GRPO** 训练模型，把研究者的请求、反馈、执行证据转化为任务与评分\
  \ rubric，实现持续科研能力提升（PhAI Labs / 复旦中山医院 / 牛津 / 斯坦福 / 普林斯顿等，arXiv 2026）。\n\n## 研究思路（本组\
  \ 9 篇中唯一做「自我改进闭环」的工作）\n- **核心问题**：如何把「与研究者协作」转化为「agent 工作流程与底层能力的持续提升」？——**在对话里纠正一次答案\
  \ ≠ 跨任务的改进**。\n- **架构三段**：\n  1. **科学工作台**：多模态（文档/图像/表格/生物序列）+ **224 工具 × 22 功能模块**；Python/R/Bash\
  \ 运行时；在线数据库接口 + 本地数据湖；持久化工作区 + 可检查的 Conversation / Trajectory / Compute / Results\
  \ 视图；\n  2. **Recursive-in-Recursive 自改进**：内层进化 harness、外层训练模型，经「科研任务 + 评分 rubric」耦合；\n\
  \  3. **研究者交互**：提问/检查结果/细化需求 → 提供任务目标、评估标准与证据。\n- **关键分工**：把「**可编辑的 harness**（instructions、skills、context-management\
  \ procedures）」与「**科学基础设施**（工具、执行、存储）」**分离**，使过程性改动**显式、可评估**，基础设施保持不变 → 在一致执行条件下评测「解决问题流程」的变化。\n\
  - **内层递归（harness 进化，模型固定）**：任务模型参数 θ_k 固定；用一个**独立的固定辅助模型（GPT-6 Astra）**诊断失败并提出**有界（bounded）编辑**（增删改一个\
  \ scoped skill、或改一条 instruction、或改一个 context 设置；schema 校验限定编辑范围与大小预算）。**父/候选 harness\
  \ 在同一批开发任务、同一 seed、同一执行预算、冻结 rubric 下做成对评估**，仅当「合法 ∧ 平均归一化 rubric 分数提升 Δ>0」才接受子代，否则保留父代（并列也保父代）。工具/执行设施/rubric/评估器全程固定；**不对任务模型与辅助模型做梯度更新**。\n\
  - **外层递归（模型 RL，harness 固定）**：随 harness 进化，原本困难的任务变常规 → 用当前模型 + 选中 harness 做 pilot，**校准环境难度**（变化科学输入/分析条件、延长计算步骤依赖）生成新环境；用**任务自适应\
  \ rubric 奖励**（可执行检查 + 固定 judge；每准则有权重 w_c、满足分 v_c∈[0,1]）驱动 **GRPO**；训练期间 harness\
  \ 与 rubric 固定；历史交互只充当任务定义与诊断证据（**不**作为 on-policy 训练样本）。\n- **诚实边界声明（值得学习）**：reflector（辅助模型）**保持固定**，因此「任务性能提升」**不等于**「改进机制本身变强」。\n\
  - **部署**：以固定采集区间服务研究者；后台更新**异步于在线服务**（在线持续可用）；更新后 (θ_{k+1}, H_{k+1}) 重新评估再部署，其交互启动下一轮；所有\
  \ harness/环境版本保留。\n- **执行**：**ReAct 风格** reasoning–action–observation 循环；动作空间 a_t\
  \ ∈ {可执行代码, 工具调用, 面向研究者的回答}；工具调用输出 `<execute>Python code</execute>`，回答用 `<answer>value</answer>`。\n\
  \n## 解决的问题（痛点）\n模型 agent 能检索证据、查数据库、跑计算流程，但**「在对话中纠正一次答案 ≠ 跨任务能力提升」**——缺少把协作经验沉淀为可复用流程与模型能力的机制；研究者的检查/质疑/补充验证等信号目前没有被系统性转化为训练与改进信号；现有\
  \ self-improvement 方法（Reflexion / GEPA / ACE / Darwin Gödel Machine / Hyperagents\
  \ / SEAL / SIA / HELIX）各有侧重，但 **harness 进化与模型学习的「嵌套依赖」尚未被系统研究**。\n\n## 工作量与内容\n\
  - **224 个工具、22 个功能模块**（genomics、分子与癌症生物学、药理学、生物成像、文献检索、数据库查询）；运行时 Python/R/Bash；\n\
  - 角色：task policy（ReAct 循环）、user simulator、feedback interpreter、harness reflector/proposer、scientific\
  \ verifier、policy learner；\n- **任务集合 895 个 / 16 个子主题**：96 LitQA2 + 511 DbQA + 108\
  \ ProtocolQA + 180 GWAS；harness 适应流报告 **288 段对话**（每批 12 段触发一次更新 → 24 次更新）；\n- **训练/自改进轮次**：耦合循环案例\
  \ **3 个 co-evolution cycles（k=0,1,2）**，每轮 harness refinement **10 个搜索步** + model\
  \ learning **20 次 RL 更新**；harness 适应案例 **24 个批次**（H0 无指令/skill → **H24 含 4 条 instruction\
  \ + 9 个 scoped skills**）；模型学习案例固定 H0，**约 2 小时 RL**、每问题 **4 次尝试**；\n- **模型**：任务骨干\
  \ **Qwen3.5-4B**；固定辅助模型 **Qwen3.8-27B**；harness 编辑/诊断 **GPT-6 Astra**；\n- **奖励**：rubric\
  \ 聚合 R_x(τ)=Σ w_c·v_c / Σ w_c；优化用 **GRPO**（组相对优势、token 级平均、KL 代理项）；\n- 工具目录与执行设施「derived\
  \ from Huang et al. [Biomni]」，只读数据湖挂载于 `/opt/data/biomni_data/data_lake`；任务以 Harbor\
  \ tasks 打包（instruction.md / task.toml / environment/ / assets/ / tests/test.sh）。\n\
  \n## 怎么测试（4 个案例研究对应 4 个 RQ）\n- **RQ1 研究者交互**：两个真实研究者交互（JAK1 研究设计、ARL4C 证据综合），**定性**评估科研辅助与\
  \ RL 任务构造机会；\n- **RQ2 耦合递归改进**：从 Qwen3.5-4B + 初始 harness 跑 3 个 co-evolution 循环，看跨轮持续改进与任务覆盖；\n\
  - **RQ3 harness 适应（模型权重固定）**：adaptation set 上改进并选 harness，再在**独立 validation set**与初始\
  \ harness 比较；\n- **RQ4 模型学习（harness 固定）**：固定 H0，比较 RL 前后两个 checkpoint（每问题 4 次尝试）。\n\
  - **数据来源**：**LAB-Bench** 与 **Biomni-Eval1**；四大任务族：文献阅读 / 数据库判断 / 实验协议排障 / 基因与变异评估；\n\
  - **基线**：RQ3 = 初始 harness H0 vs adaptation 选出的 harness；RQ4 = RL 前 vs RL 后 checkpoint；RQ2\
  \ = 初始 vs 最终系统同测试集逐题；\n- **无人类评估**——实证为受控模拟用户 + 固定 judge + 可执行检查；RQ1 为真实研究者交互但定性；\n\
  - **消融**：通过「固定模型看 harness」与「固定 harness 看模型」**解耦两个机制**；原文明确说明**未单独隔离单个 skill 或单个反馈来源的贡献**；\n\
  - **测试集划分**：development / policy-training / **held-out test** 严格分离，test set 从不参与编辑或选择。\n\
  \n## Benchmark 细节（895 任务 / 16 子主题）\n| 任务族 | 子主题数 | 数量 |\n|---|---|---|\n| **LitQA2**（文献阅读）\
  \ | 1（Scientific literature reading） | 96 |\n| **DbQA**（数据库判断） | 10（Disease–gene\
  \ associations 39 / Gene location 40 / miRNA targets 40 / Mouse tumor gene sets\
  \ 80 / Oncogenic signatures 40 / TF binding GTRD 40 / Variant annotation single\
  \ 80 / multiple 72 / Vaccine-response gene sets 40 / Viral protein interactions\
  \ 40） | 511 |\n| **ProtocolQA**（协议排障） | 1 | 108 |\n| **GWAS**（基因与变异评估） | 4（Causal\
  \ genes: GWAS Catalog 42 / Open Targets 45 / PharmaProjects 50 / Variant prioritization\
  \ 43） | 180 |\n| **合计** | **16** | **895** |\n\n**指标**：validation accuracy（harness\
  \ 选择用，独立验证集）；first-response accuracy（首次提交即答对占比）；single-attempt test accuracy；**pass@4\
  \ / problem coverage**；training reward（rubric 聚合）；归一化 rubric 分数。\n\n## 关键数字（均出自原文）\n\
  **§4.2 三循环耦合改进（Fig.8）**\n- harness refinement 验证准确率：第 1 轮 **38.9%→44.4%**；第 2 轮\
  \ **34.4%→46.7%**；第 3 轮 **61.1%→70.0%**；\n- 平均训练奖励（RL 前后半程）：第 1 轮 **33.3%→38.8%**；第\
  \ 2 轮 **44.1%→60.5%**；第 3 轮 **57.8%→69.8%**；\n- 整体单次尝试测试准确率：**42.2% → 73.3%**；\n\
  - 逐题转移：**33.3%** 错→对、**2.2%** 对→错、40.0% 保持正确、24.4% 保持错误；\n- 按任务族（Before→After）：DbQA\
  \ **36%→74%**；GWAS **30%→60%**；LitQA2 **80%→87.5%**；ProtocolQA **60%→70%**。\n\n\
  **§4.3 harness 适应（固定模型，Fig.9）**\n- 跨 24 个批次，最佳批次 first-response accuracy 达 **75.0%**（其余标注\
  \ 41.7%、50.0%、66.7%）；\n- validation accuracy：初始 harness **31.1%** vs 选中 harness\
  \ **51.1%**（**+20.0 个百分点**）；\n- 选中 harness = **4 条 instruction + 9 个 scoped skills**。\n\
  \n**§4.4 模型学习（固定 harness，Fig.10）**\n- 训练约 **2 小时（wall time）**；problem coverage（pass@4）**48.3%\
  \ → 67.8%**（**+19.5 个百分点**）；每问题 4 次尝试。\n\n## 局限（作者自述边界）\n**reflector 固定 → 改进机制本身并未变强**（\"\
  improved task performance does not imply that the improvement mechanism itself has\
  \ become stronger\"）；**未隔离个体贡献**（学习曲线是「固定模型权重下多次过程性修订的合并效应」，单个 skill 与单个反馈来源效果未单独隔离）；反馈是**有界的、非专家**（bounded,\
  \ reference-assisted user simulator，回复集**排除正确答案/标识符/数值**，反馈解释器只看到公开上下文）；**研究者反馈\
  \ ≠ 正确答案**（历史答案与研究者批准不被自动视为科学 ground truth，冲突需求需在评分前解决）；§4.1 为定性评估，部分图表为「illustrative\
  \ derivations, not archived rubric packages or scored outputs」；**当前工具与数据专精于生物医学**。\n\
  \n## 原文不一致（如实标注）\n① **轮次命名矛盾**：§4.2 标题写 \"**Two-Cycle** Recursive-in-Recursive Dynamics\"\
  ，但正文与 Fig.8 图注均写 **three** co-evolution cycles（k=0,1,2）——标题恐为笔误；② 第二轮验证准确率起点：正文写\
  \ **34.4%**→46.7%，但 Fig.8(a) 标注序列为 38.9%、44.4%、46.7%、61.1%、70.0%（**未出现 34.4%**）；③\
  \ §4.4 的 pass@4（固定 H0）与 §4.2 全过程的 single-attempt **口径不同、不能直接比较**（原文 §S1.3 有澄清，但易被并读）。\n\
  \n## 可复用点（对自建 agent 系统最有价值）\n① **「harness 与模型双轨、且嵌套耦合」是最大方法论贡献**——把「提示/技能/上下文管理」作为**一等可编辑对象**，与模型权重解耦、分别评估；②\
  \ **把协作记录转成「任务 + rubric」是可持续学习的燃料**，关键工程点：**研究者反馈只用于定义目标/标准，不作为正确性标签**，并在评分前消解冲突需求；③\
  \ **harness 编辑要「有界编辑 + schema 校验 + 成对评估 + 回归保护」**（一次只改一个作用域组件，含已有成功任务防回归，Δ>0 才接受，并列保父代）；④\
  \ **奖励设计**：任务自适应 rubric（权重 w_c + 满足分 v_c，可执行检查优先、需科学解释处用固定 judge）+ GRPO；⑤ **环境难度自适应校准**（变输入、变分析条件、延长步骤依赖）；⑥\
  \ **可检查性/可审计性是科研 agent 的刚需**；⑦ **诚实边界声明**话术值得照搬；⑧ **平台工程**：把工具目录/执行环境/存储抽为与 harness\
  \ 解耦的公共接口，支持可插拔 harness。\n\n## 元信息\n- arXiv:**2609.17523v1** [cs.AI]，15 Sep 2026；代码\
  \ **Gen-Verse/ScienceBuddy**；Website Science-Buddy-Product\n- 共同一作 Shuhan Xue /\
  \ Jianyuan Zhong / Ziyuan Nan；通讯 Zhenfei Yin / Yingcheng Wu / Ling Yang（PhAI Labs）\n\
  - 机构：PhAI Labs、复旦大学中山医院肝外科/肝癌研究所、State Key Lab of Genetics and Development of Complex\
  \ Phenotypes、复旦大学、上海自然科学研究院、顺为资本、牛津、斯坦福、普林斯顿\n- **原文未设独立 Data availability 章节**；科学工具目录与执行设施\
  \ derived from Biomni"
