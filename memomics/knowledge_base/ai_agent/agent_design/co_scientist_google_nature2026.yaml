content: '## 一句话定位

  基于 Gemini 的多智能体「结构化科学思考引擎」，通过 **自对弈锦标赛（Elo）** 演化提出可实验验证的**新科学假设**（Google Cloud AI
  Research / DeepMind 等，约 60 名作者，Nature Vol 655, 2026）。


  ## 研究思路（核心范式）

  **把「科学方法」在 in silico 复现**：不做暴力生成，而是「**generate → debate → evolve**」迭代精炼，并随 **test-time
  compute 缩放**自我改进（自改进回路，无需 back-propagation / fine-tuning）。


  **系统四组件**：① 自然语言输入输出接口（**scientist-in-the-loop**，科学家全程可干预）；② 异步任务执行框架；③ 专门化 agents；④
  持久上下文记忆（长时程推理）。


  **7 类 agent 分工**：

  - **Supervisor**：解析研究目标、建 task queue、动态分配 worker 与算力、周期性写统计量到记忆；

  - **Generation**：文献探索(web search)、模拟科学辩论(self-critique/self-play)、迭代假设识别、research
  expansion；

  - **Reflection**：扮演同行评审 —— initial review(不用外部工具) / full review(含 web search) /
  deep verification review(拆解为子假设逐一核验) / observation / simulation / recurrent(tournament)
  review；

  - **Ranking**：主持 **Elo-based 锦标赛**，pairwise 模拟科学辩论排名（新假设初始 Elo = **1,200**）；

  - **Proximity**：算假设相似度、建邻近图（聚类/去重、组织对局）；

  - **Evolution**：持续精炼 top-ranked 假设（grounding / 可行性 / 灵感 / 组合 / 简化 / out-of-box）；

  - **Meta-review**：综合所有评审、识别对局中的重复模式并反馈给其他 agent（**无需梯度/微调**），生成 research overview
  与推荐研究者联系人。


  **与已有工作的分野**：明确区别于 deep research / 文献摘要工具 —— 目标是**生成新知识/新假设并做实验规划**，而非综述既有信息。


  ## 解决的问题

  科学家面临「**breadth and depth conundrum**」（学科专深 vs 跨学科洞见）；构建能跨领域推理、生成可验证新假设、加速科学发现的
  AI 协作系统。


  ## 工作量与内容

  - 机构：4 个 Google 部门 + Stanford Med + Houston Methodist + Sequome + Imperial College
  London；

  - 基座 LLM：**Gemini 2.0 models**（所有 agent；部分消融用 Gemini 2.0 Flash），系统 model agnostic；

  - 工具与数据：web search、专用 AI 模型（含 **AlphaFold**）、Open Targets、DepMap；药物重定位用 **2,300
  个已批准药物 × 34 种癌型** 分类列表；

  - **代码不公开**（原文："The full source code … is not publicly available"），仅 experimental
  access program + 公开伪代码(Supp. Note 8)与全部系统 prompt(Supp. Note 9)；

  - 案例研究：**3 个生物医学应用**（复杂度递增）：① AML 药物重定位；② 肝纤维化新靶点发现；③ AMR 基因转移机制解释（cf-PICIs）。


  ## 怎么测试 / benchmark

  - **消融**（Supp. Note 3）：验证各 agent 组件贡献；

  - **自动评测**：以 Elo 自评度量假设质量随时间的提升；

  - **专家评审**：**7 名生物医学专家**策展 **15 个**高难度研究目标并提供各自 best-guess 假设，与 Co-Scientist 及前沿模型同场锦标赛；**盲法人工评审**在
  **11 个**目标上给 1–4 偏好排名 + 五点量表评 novelty 与 impact；

  - **LLM-as-a-judge**：4 个判官模型（o3-mini-2025-01-31、o1-preview-2024-09-12、Gemini 2.0
  Pro Experimental、Gemini 2.0 Flash Thinking Experimental 01-21）对 15 个目标排名；

  - **湿实验端到端验证**：多个 AML 细胞系剂量-反应、IC50 拟合、Chou-Talalay / HSA / Bliss 协同分析（n=3 生物学重复）。


  | benchmark | 规模 | 来源 |

  |---|---|---|

  | 自建研究目标集（temporal bucket） | **203 个**多样化研究目标（以生物医学为主，含数学/物理） | 自建，截至 2025-02-03
  |

  | 专家策展难度目标集 | **15 个**复杂生物医学目标 | 7 名专家策展 |

  | 盲法人工评测集 | **11 个**目标（上述 15 的子集） | — |

  | **GPQA (diamond)** | 消融用（报 AUC/精度变化） | Hugging Face 公开 |

  | DepMap Q2 2024 | sanity check | DepMap portal |

  | Open Targets curated drug targets | 药物重定位 | Open Targets platform |

  | LAB-Bench | **原文未报告**（全文未出现该名称） | — |


  ## 关键数字（均为原文数字）

  - **Test-time scaling**：203 目标分 10 个时间桶，最大个体 Elo 与 top-10 平均 Elo **持续上升、未见饱和**；

  - **自动评测横扫基线**（15 个高难目标）：经迭代改进后显著超越 Gemini 2.0 Pro Exp、Gemini 2.0 Flash Thinking
  Exp 12-19、OpenAI o1、o3-mini-high、DeepSeek R1 及**人类专家 best-guess**；

  - **盲法人工评审**（11 目标）：Co-Scientist 平均偏好排名 **2.36**（Gemini Flash Thinking 2.73、Gemini
  Pro Exp 2.45、o1 2.45）；novelty **3.64/5**、impact **3.09/5**；

  - **药物重定位（专家 oversight，5 药）**：binimetinib / pacritinib / cerivastatin 抑制细胞活力；**binimetinib
  IC50 低至 2 nM**（除 NOMO-1 外所有 AML 细胞系），非 AML 系 TK6 高得多；

  - **单药自主发现（3 药）**：**KIRA6** 有效；KG-1a IC50 **10 nM** vs TK6 **180 nM**（**18 倍**选择性窗口）；NOMO-1
  144 nM、HL-60 870 nM、MOLM-13 1,750 nM；

  - **协同组合**：评估 **7 个**提出的组合；MOLM-13 以协同为主（JNJ-64619178+selinexor 双药、JQ1+olaparib+MSA2
  三药）；KG-1a 呈上下文依赖的混合协同/拮抗；

  - **肝纤维化**：识别 **3 个**表观遗传修饰靶点，其中 **2 个**在人肝类器官中显著抗纤维化且无细胞毒性；其一 **vorinostat**（FDA
  已批准）可重定位；

  - **AMR**：**2 天**内独立提出 cf-PICIs 通过互作多样 phage tails 扩展宿主范围，与一篇同期独立研究（未过同行评审）匹配；

  - **消融**：Reflection —— 对"应判非新颖"ideas 的 novelty 自评 无搜索 **6.14** → 有搜索 **2.38**（/10），正确性
  7.4 → 8.46，GPQA AUC **0.643 → 0.651**；Evolution —— GPQA 精度 **70.9% → 75.4%**、自建集平均假设质量分
  4.7 → 5.6；Meta-review —— 预测正确解 AUC 自建集 **0.521 → 0.597**、GPQA diamond 0.629 → 0.634；

  - **人时投入**：AML 初始 prompt **<1 小时**专家时间，最终评审选择约 **3 小时**。


  ## 局限（作者自述边界）

  依赖**开放获取文献**（漏掉付费墙后工作，且系统性缺乏阴性结果）；源文献质量混杂/矛盾，存在传播错误或不可重复发现的风险；继承基座模型固有问题（事实性不完美、可能幻觉）；验证虽成功但**仍是初步的**；大规模
  AI 集成科学流程需警惕偏见、削弱批判性思维、研究方向同质化，以及滥用加剧可重复性危机；专家评审为主观评估**非客观 ground truth**，样本量小（11
  / 15 目标）。


  ## 可复用点

  多智能体**异步编排 + Elo 锦标赛自对弈演化**范式；**Meta-review 无梯度反馈回路**（不微调即可把评审模式反馈给生成与演化）；scientist-in-the-loop
  交互设计；伪代码与全量 prompt 公开。


  ## 元信息

  - Nature, Vol 655, 9 July 2026, 起始页 487；DOI **10.1038/s41586-026-10644-y**；CC BY
  4.0

  - 实现细节：Python 3.11.7；pandas 2.1.4 / numpy 1.26.4 / seaborn 0.12.2 / matplotlib 3.8.0；IC50
  拟合 GraphPad Prism v10.6.0；协同分析 Julius AI'
