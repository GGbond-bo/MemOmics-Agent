content: "## 一句话定位\n把**任意一篇科研论文**（手稿 + 补充材料 + 数据集 + 代码 + 工作流）自动转换成一个**可自然语言交互、可复现调用**的\
  \ AI agent（以 **MCP server** 承载），提出「论文即 agent」的知识分发新范式（Stanford，Nature 2026）。\n\n\
  > 注：常用简称 paper2Agent；原文实际标题是 **Reimagining research papers as interactive and reliable\
  \ AI agents**。\n\n## 研究思路（核心设计哲学与架构）\n- **核心哲学**：论文是「被动对象」——读者要自己找 repo、装依赖、配环境、猜输入输出。Paper2Agent\
  \ 把论文的**全部研究产出**「agent 化」，而不是只做 RAG over text。论文从「文档/代码库」升维成「能执行、能对话的知识实体」。\n- **承载形式\
  \ = MCP（Model Context Protocol）**，每篇论文 → 一个 MCP server，三件套分工：\n  1. **MCP tools**：可执行函数，封装论文的方法学贡献，**自带预配置环境**；\n\
  \  2. **MCP resources**：静态资产仓库（手稿、代码库、补充材料如数据集/表格/图）；\n  3. **MCP prompts**：把论文/代码里的**多步科研工作流编码成指令模板**，引导\
  \ agent 按正确顺序执行。\n- **两层结构**：① **Paper2MCP**（从论文+代码库抽信息、构建远程 MCP server）；② **agent\
  \ layer**（把 MCP server 包成 context provider，实例化论文专属 agent）。\n- **关键设计**：\n  - 工具**先验证后「锁定」**——每个工具用示例数据集对照原代码库报告的结果/图验证后才锁定，以抑制「代码幻觉」、降低生成随机性、保证可复现；\n\
  \  - 每个工具**内嵌指向原始源码的可追溯链接**；\n  - MCP prompts **自动推断**（无需人工整理），免去用户精心构造 prompt、也避免\
  \ agent 猜顺序。\n- **实现**：以 **Claude Code agent SDK** 实现多 agent，中央 orchestrator 编排\
  \ **6 步流水线**（定位下载 repo → 环境搭建 → tutorial 发现 → tutorial 执行与审计 → 工具抽取/测试/精化 → MCP\
  \ server 组装），由 **5 类专门子 agent** 承担（environment manager / tutorial scanner / tutorial\
  \ executor / tutorial tool extractor-implementor / test verifier-improver）。默认下游对话\
  \ agent 用 **Claude Sonnet 4**。\n\n## 解决的问题（痛点）\n1. 论文被动，需先发现、再解析、再手工确定如何用到自己工作中；\n\
  2. 计算方法技术门槛高（AlphaGenome 为例：装环境、用 API key 建 client、构造 variant 对象、选输出模态，生物学家学习曲线陡峭）；\n\
  3. 已有努力（executable papers、Papers with Code、Binder、CodeOcean）改善了可复现性，但在**理解、定制、迁移到新项目**上障碍仍大；\n\
  4. 一般 agent 直接在 repo 上工作的**可靠性/效率**不足（benchmark 中 Claude+Repo 明显落后）。\n\n## 工作量与内容\n\
  - 评测语料：**100 篇**计算生物学论文（bioRxiv bioinformatics 类目，自 2025-12 倒推抽样，**不做质量/维护/完整性过滤**）+\
  \ **26 篇**数据/发现型论文 + **10 篇**非生物学计算论文；\n- **100 篇中 74 篇成功 agent 化，共提出 599 个工具、593\
  \ 个通过自动验证**；\n- 单篇成本与耗时：AlphaGenome → **22 个工具 / ~45 min / US$14**（个人笔记本、无人工干预）；Scanpy\
  \ → **7 个工具 / ~45 min / US$13**；\n- 论文 agent 三条性质：交互易用 / 可靠可复现 / **可组合**（多个 MCP\
  \ 可接同一 chat agent，跨论文协作）；\n- **多论文 agent 互联 = AI co-scientist**：把「方法论文 agent」与「数据论文\
  \ agent」连起来，自动执行跨数据集 signature-correlation 等**源论文未提出的新分析**。\n\n## 怎么测试（评测方式）\n|\
  \ 评测 | 设计 |\n|---|---|\n| AlphaGenome agent | vs 人工 ground truth / **Claude+Repo**\
  \ / **Biomni**；生成 agent **无权访问手稿或原始 repo**；两名独立专家按 rubric 打分，**评分者间一致性 96.7%**，n=5\
  \ 次独立运行 |\n| 大规模 | 300 条 tutorial 衍生问题（来自 74 篇）；26 篇数据/发现论文用 100 条 synthesis 问题；10\
  \ 篇非生物论文用 42 条 execution 问题 |\n| 消融（5 变体） | ① monolithic agent（单 agent 单 200k token\
  \ 上下文）② non-parallel multi-agent（子 agent 强制串行）③ no test verifier-improver ④ Markdown\
  \ skill files（用文本替代可执行工具）⑤ alternative scaffolding（OpenCode 替代 Claude Code） |\n\
  | **对抗鲁棒性** | 对 3 个 repo 注入 4 类执行级错误（缺失依赖、损坏路径、拼写错误、弃用 API），共 **12 个对抗配置**，看是否检出并修复\
  \ |\n| **越界拒答（假阳性）** | 对 26 篇随机**置换 paper-question 配对**，构造 adversarial out-of-scope\
  \ benchmark，测正确拒答率 |\n| **记忆化（shortcut）探测** | 人工检查是否含硬编码常量/固定路径/缓存输出/数据集相关启发式 +\
  \ 自动化 reviewer agent 扫描 |\n| 交叉验证（无湿实验） | 用 GTEx eQTL 核实 SORT1（P=1.1×10⁻⁶⁵）；MPRA-scCRISPRi\
  \ 与 Perturb-seq 两个独立数据集做 signature-correlation |\n\n## Benchmark 细节\n| benchmark\
  \ | 题量 | 指标 |\n|---|---|---|\n| AlphaGenome tutorial | 15 条 | 正确率（human rubric，n=5）\
  \ |\n| AlphaGenome novel | 15 条 | 正确率 |\n| AlphaGenome open-ended | 30 条（需多步工具组合\
  \ + 生物学综合） | 正确率（两名专家 rubric） |\n| 大规模计算生物学 | **300 条**（74 篇论文） | 正确率（paired t-test\
  \ / bootstrap 1 万次） |\n| 数据/发现论文 | **100 条** synthesis | 正确率（资源层） |\n| 非生物学 | **42\
  \ 条** execution | 正确率（n=5） |\n| out-of-scope 对抗 | 置换 paper-question（26 篇） | 正确拒答率\
  \ |\n| 对抗 repo-drift | 3 repo × 4 类错误 = **12 配置** | 检出率/修复率/最终是否通过验证 |\n\n方法学固定参数：数值容差\
  \ **3%**（浮点）；图匹配以感知哈希 Hamming distance **< 20**；每函数最多 **6 次**尝试。评测环境 MacBook Air（M2，8\
  \ GB 统一内存）。\n\n## 关键数字（均出自原文）\n- **tutorial 15 题**：Paper2Agent **98.7 ± 1.3%** vs\
  \ Claude+Repo **82.7 ± 3.4%** vs **Biomni 37.3 ± 4.0%**\n- **novel 15 题**：**100.0\
  \ ± 0.0%** vs 78.7 ± 4.4% vs Biomni 56.0 ± 3.4%\n- **开放式 30 题**：**82.7 ± 2.4%**\
  \ vs Claude+Repo 56.7 ± 2.3% vs **Biomni 72.2 ± 2.2%（Biomni 在此反超 Claude+Repo，正文未解释）**\n\
  - **300 题**：**91.2 ± 1.6%** vs Claude Code+repo（Sonnet 4）**80.3 ± 2.3%（P<0.0001）**\
  \ vs Sonnet 4.6 **86.3 ± 1.1%（P<0.0001）**\n- 查询成本/时延：Paper2Agent **US$0.20、1.6 min/query**\
  \ vs Sonnet 4 直接用 **US$0.38、4.3 min**\n- **10 篇非生物论文 42 题**：**98.1 ± 0.8%**\n- **26\
  \ 篇数据/发现论文 100 题**：**89.0 ± 3.1%** vs Claude browser-use 82.0 ± 3.8%（**P=0.03**），且**便宜\
  \ 34×、快 15×**\n- 越界查询**正确拒答率 100%**\n- 中位运行时间降低：tutorial 题相对 Claude+Repo **1.9×**、相对\
  \ Biomni **3.1×**；novel 题 **2.9× / 3.8×**\n- 发现用例：AlphaGenome 预测 **GPR137** 为 rs887314\
  \ 位点 top 受影响基因（quantile score 0.997）；GPR137 敲低 signature 与 CRE 扰动 signature **Stim8hr\
  \ Spearman r=0.613, P=3.79×10⁻³**、**Stim48hr r=0.630, P=4.71×10⁻³**（FDR<0.05）；**Rest\
  \ r=0.29, P=0.21（不显著）**\n- LDL 用例：SORT1 quantile score 0.99983，GTEx liver eQTL **P=1.1×10⁻⁶⁵**；CELSR2/PSRC1\
  \ 各 0.99998（P=4.7×10⁻⁴⁶ / 8.5×10⁻⁵⁰）\n- ADHD 用例：在 **209 个候选变异**中优先 **rs1626703**\n\
  \n## 局限（作者自述边界）\n并非每篇论文都能无缝转成稳健 agent（大规模评测中相当一部分 repo **无法 agent 化**：代码不完整、缺文档、环境无法解决）——作者提出「**易\
  \ agent 化程度**」本身可作为可复现性的实用度量；**开放式科研推理（假设生成、机制解释）仍须 human-in-the-loop**；开放式分析可能有多个可辩护答案，因此「与单一参考答案一致」的\
  \ benchmark 应主要解释为**忠实执行**的度量、而非分析有效性的度量；引入**安全、知识产权、署名**挑战，且 paper agents 需随上游代码/依赖演进持续维护；作者提出「**agent\
  \ availability** 章节」设想（类比 data/code availability）。\n\n## 原文不一致（如实标注）\n- **Scanpy\
  \ 评测数据集数量**：Results 正文先写 **four**、紧接着写 **seven**，Methods 写 3 + 4 = 7（三处口径并列）；\n\
  - 任务书给定标题与原文实际标题不同（同一工作，框架名 Paper2Agent）；\n- 300 题中 vs Sonnet 4 与 vs Sonnet 4.6\
  \ 差距不同却都标 P<0.0001（未给具体 P）。\n\n## 可复用点（对自建 agent 系统最有价值）\n① **MCP 三件套**作为「论文→agent」的标准化承载（可远程托管，消除本地依赖）；②\
  \ **工具「先验证后锁定」**是抑制代码幻觉的核心机制（数值容差 + 图像感知哈希双校验，反复失败的工具剔除出 server）——保证「可复现」而非「可生成」；③\
  \ 每个工具**内嵌源码可追溯链接**；④ 用 **MCP prompts 编码执行顺序**；⑤ orchestrator + 5 类子 agent，**并行仅用于步骤内**；⑥\
  \ CPU 级轻量设计（45 min / 十几美元 / 普通笔记本）；⑦ **多论文 agent 互联产生源论文未提出的新分析**；⑧ 对抗与鲁棒性测试套件（12\
  \ 配置 + 越界拒答 + 硬编码扫描）可作「可靠 agent 系统」的验证清单。\n\n## 元信息\n- Nature 2026（Received 13 Oct\
  \ 2025；Accepted 14 Aug 2026）；DOI **10.1038/s41586-026-11044-y**\n- 代码 https://github.com/jmiao24/Paper2Agent\
  \ ；agent 托管于 HuggingFace Spaces（alphagenome_agent / scanpy_mcp / tissue_mcp）\n-\
  \ 数据全部公开（10x Genomics PBMC/neuron/heart/brain-tumor、小鼠体感皮层空间转录组 Zenodo 8259942、ADHD\
  \ GWAS、GTEx、CD4+ T Perturb-seq 等）"
