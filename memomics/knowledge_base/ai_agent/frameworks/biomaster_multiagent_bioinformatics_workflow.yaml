content: "## 一句话定位\n**角色化多智能体 + 双 RAG + 输入输出双向校验**框架，自动化并扩展**长链生信分析流程**（HKUST-GZ，Bioinformatics\
  \ 2025）。\n\n## 研究思路（全文最大的借鉴点：用「Check」把长流程的误差传播掐掉）\n- **核心哲学**：role-based 多 agent，每个\
  \ agent 有**独立本地知识库与本地记忆（不共享）**，但共享全局知识库（workflow 上下文、输入文件、期望输出）。\n- **四角色 + 双 RAG**：\n\
  \  - **Plan Agent**：收用户目标 → text-embedding-3-large 生成向量 → **Plan RAG** 余弦检索 **top-2**\
  \ 知识条目 → 把目标分解为**不可再分的步骤序列**，输出 **JSON 结构化计划**（指定工具、输入文件路径、期望输出）；\n  - **Task Agent**：依计划步骤\
  \ + 工具需求 + 输入路径 + 期望输出名，查 **Execute RAG（Tool RAG）** 取工具用法/参数/示例，生成可执行脚本（含工具安装与执行命令）；\n\
  \  - **Debug Agent**：评估执行是否成功；出错则读 Execute RAG 排障信息、分析报错、改写脚本，迭代至成功；用 **memory summarization**（仿\
  \ mem0）压缩历史交互，避免上下文过长；\n  - **Check Agent**：**每步后校验输出文件**（存在、非空、命名符合计划、格式一致），发现偏差即纠正并调整后续步骤\
  \ —— 明确针对**累积误差 / cascading failure / 假完成**。\n- **与已有工作的分野**：区别于单 agent 的 **AutoBA**\
  \ 与多 agent 的 **CellAgent**，针对长流程的**误差传播、新工具适应性、LLM 对小众生信任务泛化差**三大问题；并处理长 memory\
  \ 导致 LLM 性能退化（引 Liu et al. 2024 \"Lost in the middle\"）。\n\n## 解决的问题\n生物数据激增使生信工作流日益复杂多步、依赖大量人工；现有\
  \ LLM agent 对**长、多步流程**存在误差传播、工具适应性与泛化不足，且 memory 过大导致性能下降。\n\n## 工作量与内容\n- 3 名作者\
  \ / 1 家机构（HKUST-GZ）；\n- 基座 LLM：Methods 写 \"OpenAI's **GPT-4** for all agents\"；为公平对比，评测统一用\
  \ **GPT-4o（gpt-4o-2024-08-06）**（**原文两处表述不一致，均照录**）；\n- 测试覆盖 **6 类流程**（ChIP-seq、RNA-seq、单细胞、群体遗传、空间转录组、Hi-C），共\
  \ **20 个**实验；\n- 重点案例含 Hi-C 预处理（**≥10 步**）、群体遗传（smartPCA、admixtools F4、treemix、ROH）、RNA-seq（差异表达、top5\
  \ 下调基因、STAR-Fusion 融合基因、RNA editing）；\n- 部署环境：本地 AMD EPYC 7K62 48-Core + 8GB RAM；云\
  \ 13th Gen i9-13900K + 94GB RAM；Ubuntu 22.04 / Conda / Python 3.12 / R 4.4.1 / **LangChain**；推荐\
  \ ≥16GB RAM。\n\n## 怎么测试\n- **对比实验**：BioMaster vs **AutoBA** vs **ChatGPT**，统一 GPT-4o；BioMaster/AutoBA\
  \ 全自动调试，ChatGPT 需人工粘贴报错；**每步最多 5 次 debug 尝试**，超限记失败；\n- **消融**：分别移除 **Plan RAG**、**Tool\
  \ RAG 增强**、**Check Agent**（Plan RAG 与 Check Agent 在 Hi-C 预处理上评估；Tool RAG 在群体遗传 smartPCA\
  \ / admixtools F4 上评估）；\n- **评测方式**：以任务成功/失败（✓/×）与工作流完成度为核心指标 —— **未使用专家人工打分或自动百分比指标**；原文**未报告任何准确率数值**；\n\
  - **公平性设计**：Hi-C 案例额外提供\"专家编辑过的正确计划\"以比较各 agent 生成命令的能力。\n\n## Benchmark 细节（无自建命名\
  \ benchmark，评测数据取自公开源）\n| 流程 | 数据来源（原文） |\n|---|---|\n| ChIP-seq | 小鼠 ESC PRC1/PRC2\
  \ 成员，SRA SRR620204/620205/620206/620208 |\n| RNA-seq | SRA 小鼠 SRR1374921/1374922/1374923/1374924\
  \ |\n| 单细胞 | 10X Genomics 公开 **PBMC** 数据 |\n| 群体遗传 | **1000 Genomes**：YRI / CEU\
  \ / CHB |\n| Hi-C | **GM12878**（MboI），4DN portal 4DNFI15H1RVG 等 4 个样本 |\n| 空间转录组\
  \ | 邻域富集分析任务（数据集名原文未具体报告） |\n\n评测规模 = **20 个 experiment**（自建任务场景）。\n\n## 关键结果（原文为\
  \ ✓/× 表与趋势，无百分比）\n- 短流程（RNA-seq、ChIP-seq、单细胞、空间转录组 **约 5 步**）：三者表现**相当**；失败多因 **Conda\
  \ 依赖冲突**（连人类专家也难）；\n- 长/复杂流程差距显现：\n  - 群体遗传（smartPCA、treemix 等，需大量预处理）—— smartPCA、treemix\
  \ 等任务 AutoBA/ChatGPT 多为 ×，**BioMaster 为 ✓**；\n  - Hi-C：基础任务（mapping/sorting/contact\
  \ matrix）三者均成功；**高级步骤（pair parsing、file cleaning、合并）**中 AutoBA/ChatGPT 失败，BioMaster\
  \ 成功；表 1 中 **Hi-C \"Fully preprocessing process\" 仅 BioMaster ✓**；\n  - **Functional\
  \ Enrichment 三者均 ×**；\n  - BioMaster 在所列任务中仅失败 1 项（Single-cell \"find marker genes\
  \ based on count matrix\"）。\n- **消融趋势（原文未给具体数值）**：移除 **Plan RAG** → 无法生成有效详细计划、workflow\
  \ 不完整/次优（显著损害）；移除 **Check Agent** → 短任务影响小、**长流程严重受损**（中间小偏差即累积失败）；移除 **Tool RAG\
  \ 增强** → 简单任务影响小、**smartPCA / admixtools F4 等复杂分析显著下降**。\n\n## 局限（作者自述边界）\n需改进**记忆控制（memory\
  \ control）**、优化 agent 协作、扩展对新工具与数据集的适应性；长任务 memory 系统可能过大导致 LLM 性能退化（引 Liu et al.\
  \ 2024）；RAG 检索信息与**实际执行的对接**在高度复杂流程中仍具挑战；对比基线限于 AutoBA 与 ChatGPT；失败常源于 **Conda 依赖冲突**（环境问题，非纯推理问题）。\n\
  \n## 可复用点\n**Plan / Task / Debug / Check 四角色分工**；**Plan RAG + Execute(Tool) RAG\
  \ 双 RAG**（均 top-2 检索）；memory summarization（仿 mem0）；**每步 Check 防累积误差与假完成**（这条对长流程最关键）；JSON\
  \ 结构化计划接口便于校验。\n\n## 元信息\n- Bioinformatics, 2025, 1–9（本文件为 bioRxiv 预印本版本，Posted\
  \ January 26, 2025）；bioRxiv DOI **10.1101/2025.01.23.634608**；出版版 DOI 在正文显示为占位符\
  \ \"XXX\"；许可 **CC-BY-NC 4.0**\n- 代码 https://github.com/ai4nucleome/BioMaster ；联系\
  \ yanlinzhang@hkust-gz.edu.cn\n- 原文**未给出独立 data availability 声明**"
