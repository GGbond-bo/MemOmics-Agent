content: '## 一句话定位

  通用生物医学 AI 智能体，零样本自主执行跨学科真实科研任务（Stanford + Genentech + Arc Institute + UW + Princeton
  + UCSF，23 作者 / 11 单位）。


  ## 研究思路（两条腿，全文最值得借鉴处）

  **① Biomni-E1 = 智能体化的生物医学「动作空间」**——不为每个任务硬编码工作流，而是先把领域动作系统化"映射"出来，再让 agent 自由组合：

  - **动作发现智能体**读论文、抽三类可执行洞见：任务(task) / 软件(software) / 数据库(database)；

  - 动作空间 = **150 个专用工具 + 105 个软件包（统一容器，Python/R/Bash）+ 59 个数据库**；

  - 数据库两类接入：有 Web API 的（PDB/OpenTargets/ClinVar）用「每库一个统一函数」——函数收自然语言，内部由 LLM 解析 schema
  动态生成查询；无 API 的下载进 **data lake（Amazon S3）**，本地预处理成结构化 pandas DataFrame。


  **② Biomni-A1 = 基于 CodeAct 的通用智能体**：

  - **prompt-based 双 LLM 检索器**：专职 LLM 按 query 从海量资源选相关子集，主推理 LLM 不被长上下文拖累；

  - **code-as-action（以代码为通用动作接口）**：每步写成可执行代码（`<execute>` 标签，Python 默认、`#!R`、`#!BASH`），支持循环/并行/条件逻辑，可交错调用工具-软件-库-原始数据——**不同于
  function-calling 的固定签名**；

  - **checklist 自适应规划**：先生成编号计划，执行中逐步打勾、失败标 X 并修正。


  ## 解决的问题（痛点）

  生物医学研究被碎片化、重复性工作流拖慢（专用工具 + 海量文献综述 + 复杂实验设计与统计建模）；现有系统多为**窄领域专用 agentic workflow**（CRISPR-GPT、BioDiscoveryAgent、CellAgent
  等），无法跨全谱泛化；缺一个**显式定义生物医学动作空间**的环境，也缺能原生与之交互、自主选择与组合动作、无需刚性预定义流程的 agentic 架构。


  ## 工作量与内容

  - 动作发现语料：bioRxiv **25 个学科类别 × 每类 100 篇 2024 最新论文 = 2,500 篇**；

  - 初筛收敛到约 **1,900 个常见复现任务**，再人工去冗余、剔除可用简单代码实现者，人工精修；

  - 工具验收 5 条标准：命名清晰 / 文档详细 / 输出为便于 LLM 读的「研究日志」/ 必须含并成功通过一个具体测试用例 / 专业化判据；

  - 基座 LLM：主用 Claude Sonnet 3.7（另测 Sonnet 3.5 与 OpenAI o1）；参考文献 41 条。


  ## 怎么测试（评测设计）

  1. **通用知识/推理 Q&A**：LAB-Bench DbQA、LAB-Bench SeqQA、HLE 生物医学；

  2. **8 个自建真实世界基准**（零样本：无 prompt engineering、无任务专用微调）；

  3. **执行轨迹分析**（统计每任务常用工具/软件/数据集）；

  4. **消融**：retriever 消融、LLM 引擎消融（3.7/3.5/o1）、HLE 子学科；

  5. **人类评审**：分子克隆盲评（Accuracy 1–5 + Completeness 1–5）、微生物组人工一致性、scRNA 注释语义匹配 + 人工核验、多组学
  trace 回溯核验；

  6. **案例研究**：可穿戴传感器、大规模多组学（snRNA+snATAC+空间）、自主设计湿实验协议；

  7. **湿实验验证**：B2M guide RNA 克隆进 lentiCRISPR v2 Blast（Addgene）→ 次日见菌落 → 挑 2 克隆 miniprep
  → 用 Biomni 设计的引物 Sanger 测序，**完美比对**。


  ## Benchmark 细节

  | benchmark | 规模 | 说明 |

  |---|---|---|

  | LAB-Bench **DbQA** | 测试集 315 题 | 因 API 成本只取完整基准 **12.5%** 代表性子集，按子任务比例分配，取 3 次运行平均
  |

  | LAB-Bench **SeqQA** | 同 12.5% 采样 | 序列问答 |

  | **HLE 生物医学** | **52 题 / 14 子学科** | 每子学科最多抽 5 题，无开发集 |

  | 8 个自建真实基准 | — | 变异优先级(Open Targets Genetics)、GWAS 因果基因、CRISPR 扰动筛选设计(**18,939
  候选基因**)、罕见病诊断(MyGene2)、药物重定位(TxGNN 口径，对齐 EHR 超说明书处方)、scRNA 注释(CellxGene，20k–50k
  细胞)、微生物组疾病类群(**5 个**数据集)、患者基因优先级 |

  | 克隆开放题基准 | 正文 **10** vs Methods **20**（原文矛盾） | Golden Gate / Gibson / Gateway /
  限制性酶，含单片段与池化场景 + 诊断酶切/Sanger 引物/序列比对 |

  | 案例数据 | — | 可穿戴 458 Excel / 30 人、睡眠 227 晚；多组学 **336,162 细胞核**（孕后 5–11 周，5 解剖区域）
  |


  **基线**：base LLM（无工具）、coding agent（ReAct+Code）、**Biomni-ReAct**（把代码规划换成 ReAct 链式的自身消融版）。


  ## 关键数字（均出自原文）

  - **DbQA 74.4%**（人类专家 74.7%，持平；ReAct+Code 仅 40.8%）

  - **SeqQA 81.9%**（人类 78.8%，超过人类）

  - **HLE 生物医学 17.3%**（base LLM 6.0% / coding agent 12.8% / literature agent 12.2%）

  - **8 任务平均相对增益**：vs base LLM **+402.3%**；vs coding agent **+43.0%**；vs Biomni-ReAct
  **+20.4%**

  - 逐任务相对 base LLM：变异优先级 +78.9%、GWAS +19.4%、患者基因优先级 +19.4%、罕见病 +10.3%、微生物组 +180.0%、药物重定位仅
  **+3.6%（微弱）**

  - scRNA-seq 注释 vs Biomni-ReAct **+93.6%**；CRISPR 筛选设计 vs ReAct+Code +13.2%

  - 轨迹：每任务平均 **6–24 步**，调用 0–4 专用工具、1–8 软件包、0–3 数据湖条目

  - 案例：餐后体温平均升 **2.19°C**（中位 1.10°C）；多组学恢复 **566–589 个 regulon**


  ## 局限（作者自述边界）

  评测任务只是生物医学领域的一个子集；动作发现智能体**偏好最新文献**，可能漏掉已淡出讨论但仍有持久价值的基础概念与技术；在需要**细致临床判断、新颖实验推理、分析性发明、深度生物学思考与综合**的领域仍吃力；benchmark
  显示其**尚未在所有任务类别达到专家级**，"没有任何系统能涵盖人类生物医学专长的全部范围"。未来方向：RL 训练生物医学推理智能体、整合多模态数据、自主发现并入新工具/数据库。


  ## 原文自相矛盾（如实标注）

  - 克隆基准题数：正文/图注 **10** vs Methods **20**；

  - 可穿戴温度文件：案例 **458 个 Excel** vs Methods **485 个**；

  - 动作发现文献量：正文「25 类 × 100 篇 = 2,500」vs 摘要「tens of thousands of publications」。


  ## 可复用点（对自建科研 agent）

  code-as-action 多语言执行接口；双 LLM 检索器（工具检索与推理分离）；统一数据库查询函数（NL→schema→可执行查询）；data lake
  → DataFrame 结构化接入；checklist 自适应规划（失败标 X 修正）；**system prompt / tool-retriever prompt
  / action-discovery prompt 全部在补充材料公开可复现**。


  ## 元信息

  - 形态：预印本（原文未报告期刊名/DOI/许可）

  - 代码 https://github.com/snap-stanford/biomni ；数据 https://doi.org/10.7910/DVN/CE4ZYG
  ；站点 https://biomni.stanford.edu

  - 对比对象线索：CRISPR-GPT、The Virtual Lab、BioDiscoveryAgent、TxGemma、CellAgent、scBaseCamp'
