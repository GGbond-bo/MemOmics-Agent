content: '## 一句话定位

  多 agent + **40 余种专业工具**、带**可溯源推理链**的罕见病鉴别诊断决策支持系统（上海交大 / 上海 AI Lab / 新华医院 / 湘雅附属儿童医院
  / 哈佛医学院，Nature Vol 651, 2026）。


  ## 研究思路

  **设计哲学**：受 **MCP（Model Context Protocol）** 启发的**三层架构**（类比个人计算机）：

  1. **中央主机 central host + memory bank** —— LLM 驱动（默认 **DeepSeek-V3**），负责统筹、合成证据与决策；

  2. **多个专业 agent server（6 个）**：phenotype extractor / disease normalizer / knowledge
  searcher / case searcher / phenotype analyser / genotype analyser，各自管理本地工具集、对接特定资源环境；

  3. **异构外部数据源层**：文献、指南、案例、基因数据库、Web 搜索。


  **多模态输入**：自由文本(T)、结构化 HPO 术语(H)、原始 VCF 基因检测结果(G)，可任意组合，形式化为 I=(P,G)。

  **两阶段工作流**：信息收集（表型侧：HPO 标准化→表型检索→表型分析；基因型侧：VCF 注释→变异排序→合成分析）+ **自反思诊断（self-reflective
  diagnosis）**；若自反思后候选为空（D=∅），增大检索深度 N 回到起点迭代，直至得到非空结果。

  **可溯源推理链**：每个输出疾病附逐步推理并引用可核验医学证据（文献/指南/相似病例），并有 **reference link verification 后处理**剔除无效
  URL 以抑制幻觉。

  **与已有工作的分野**：传统 HPO 工具只给候选列表、缺解释；Exomiser 类高度依赖基因检测、不适合初筛；通用 LLM 易幻觉。DeepRare 用**训练无关（training-free）**的
  agentic 架构把推理锚定在可验证证据上，兼顾准确性与可解释性。


  ## 解决的问题

  罕见病「**诊断奥德赛**」平均 >5 年；病例稀少、表型异质、知识快速更新（IRDiRC 每年新增约 260–280 种罕见遗传病）；临床部署要求**透明可追溯**。


  ## 工作量与内容

  - 整合 **>40 种专业工具**；表型分析含 PhenoBrain、PubCaseFinder、zero-shot LLM；基因分析用 **Exomiser
  14.1.0**（集成 gnomAD/1000G/TOPMed/UK10K/ESP、PolyPhen-2/SIFT/MutationTaster、OMIM/HiPhive
  等）；

  - 覆盖 **2,919 种**罕见病、**14 个**医学专科（按 MedlinePlus 分类）；

  - **9 个数据集、6,401 例临床病例**（7 公开 + 2 自建）；

  - 工程：Python 3.10.16；检索用 **BioLORD**（表型/疾病归一化，cosine ≥ 0.8 阈值）、text-embedding-3-small
  + **MedCPT-Cross-Encoder** 两阶段病例检索；已部署为 **5 阶段 Web 应用**（临床录入→系统问诊→HPO 映射→诊断分析→报告下载
  PDF/Word）。


  ## 怎么测试

  - **跨中心评测**：9 数据集按来源分三档难度（论文提取=较易、病例报告=中等、真实临床中心=较难），覆盖亚洲/北美/欧洲；

  - **自动评测可靠性验证**：GPT-4o 判定正确诊断位次；**8 名 10 年以上经验专家**独立复核 **240 例**，人机一致 **88%**，Pearson
  r = **0.8689**；

  - **推理链专家评审**：**10 名副高/主任医师**，随机抽 **180 例**（跨 8 数据集），每例 **3 名专家**独立评审取均值；

  - **失败病例分析**：从 HPO 测试集随机抽 **200 例**（正确诊断不在 top-5），每例 3 专家归类；

  - **消融**：中央主机 LLM 替换（Claude-3.5-Sonnet / DeepSeek-R1 / DeepSeek-V3 / GPT-4o / Gemini-2.0-Flash）×
  8 数据集；原始 LLM vs 其 agentic 版本；模块级（相似病例检索 / Web 知识 / 自反思）；

  - **对照研究**：**5 名 10 年以上经验医师** vs DeepRare，输入相同 HPO，**163 例**。


  ## Benchmark 细节

  | 数据集 | 规模 | 来源 |

  |---|---|---|

  | RareBench-MME (Matchmaker Exchange) | 40 例 | 论文提取，手工核验 |

  | RareBench-LIRICAL | 370 例 | 论文提取 |

  | DDD (Deciphering Developmental Disorders) | 2,283 例 | 论文/数据库 |

  | RareBench-RAMEDIS | 624 例 | 病例报告 |

  | MyGene2 | 146 例 | 病例报告 |

  | RareBench-HMS | 88 例 | 汉诺威医学院门诊（德国） |

  | MIMIC-IV-Rare | 1,875 例 | 波士顿 BIDMC（过滤罕见病） |

  | Xinhua Hospital（自建） | 975 例（168 例含 WES/VCF） | 上海交大新华医院 |

  | Hunan Hospital（自建） | 162 例（全部含 WES/VCF） | 湖南儿童医院 |


  合计 **6,401 例 / 2,919 种疾病 / 14 专科**。对照方法共 **15 种** + Exomiser（专业工具、通用 LLM、推理 LLM、医学
  LLM、其他 agentic 系统 MDAgents / DS-R1-search）。


  ## 关键数字（均出自原文）

  - **HPO 任务**：平均 **Recall@1 57.18%**、Recall@3 **65.25%**；次优为推理型 LLM Claude-3.7-Sonnet-thinking（**33.39%**），**高出
  23.79%（R@1）/ 18.65%（R@3）**；

  - **多模态（HPO+基因）**：Xinhua **R@1 69.1% vs Exomiser 55.9%**；Hunan **63.6% vs 58.0%**；

  - **加入基因数据的增益**：Xinhua **39.9% → 69.1%**；Hunan **33.3% → 63.6%**；

  - 数据集级：RareBench-MME **78%/85%**（R@1/R@3，超 PubCaseFinder 30%/20%）；MyGene2 **74%/81%**；MIMIC-IV-Rare
  29%/37%；Xinhua（本地模型）58%/71%；

  - **专家对照（163 例）**：DeepRare **R@5 78.5%** vs 医师均值 **65.6%**；**R@1 64.4% vs 54.6%**；

  - **长尾（≤10 例稀疏病）**：R@1>0.8 的比例 DeepRare **31.8%** vs DeepSeek-V3 23.5%、DeepSeek-R1
  26.6%、Baichuan-M1 2.5%；

  - **专科**：内分泌 **60% vs 次优 32%**；消化（729 例）**49% vs 34%**；最佳肾/泌尿 66%，最低肺/呼吸 31%；

  - **消融**：GPT-4o **25.60% → 54.67%（+28.56）**；DeepSeek-V3 **26.18% → 56.94%（+29.95）**；

  - **推理链可信度**：专家对参考来源准确率均值 **95.4%**（median 1.000）；

  - **失败模式（200 例）**：Reasoning Weighing Error **41.0%**、Phenotypic Mimic **38.5%**、Etiologically
  Associated **15.5%**、Reasoning Factual Error **2.5%**、Evidence Linking Error **2.5%**。


  ## 局限（作者自述边界）

  尚未纳入所有潜在有价值数据源（MCP-like 插件接口可扩展）；知识检索 agent 目前"聚合式"处理表型，未做更精细的自适应检索；主要面向"已知患罕见病但未确诊"者，非专科初筛能力待扩展；患者交互模块缺合适验证数据集，尚未实验评估；2.5%
  推理事实错误 + 2.5% 证据链接错误（幻觉 URL 与不相关引用是主要错误源）；对高表型重叠疾病（如 CTCF 相关病 vs Cornelia de Lange）难区分。未来方向：拓展治疗与预后预测。


  ## 可复用点

  三层 MCP 架构 + memory bank；**自反思循环**（候选空则加大检索深度重来）；**reference link verification**
  后处理抑制幻觉；两阶段病例检索（embedding + MedCPT 重排）；Exomiser 集成；BioLORD 归一化。


  ## 元信息

  - Nature Vol 651, 2026-03-19（线上 2026-02-18；收稿 2025-06-30，接收 2025-12-30）；DOI **10.1038/s41586-025-10097-9**；许可
  **CC BY-NC-ND 4.0**

  - 代码 https://github.com/MAGIC-AI4Med/DeepRare ；Web https://deeprare.cn

  - 数据：RareBench (HuggingFace chenxz/RareBench)、MyGene2 (doi:10.7910/DVN/TZTPFL)、DDD、MIMIC-IV；自建
  Xinhua/Hunan 存于 NGDC（PRJCA052720 等，受控访问）

  - 伦理批号：XHEC-D-2025-094、XHEC-D-2025-165


  ## 原文不一致（如实标注）

