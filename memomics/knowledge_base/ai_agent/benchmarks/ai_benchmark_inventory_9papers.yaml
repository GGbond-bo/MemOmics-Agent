content: '## 用途

  本组 9 篇 AI agent 文献用到的**全部 benchmark / 数据集清单**（含规模与指标），供后续做同类系统时选型、或复现某篇的评测设计。**所有数字来自原文；原文未报告者标注「原文未报告」。**


  ## 一、公开通用基准（被多篇复用）

  | benchmark | 全称/来源 | 规模 | 用过它的论文 |

  |---|---|---|---|

  | **LAB-Bench DbQA** | 数据库问答（Laurent et al.） | 完整基准；Biomni 取 **12.5%** 子集（测试集 315
  题）；ScienceBuddy 用 **511 题**（10 个子主题） | Biomni、ScienceBuddy（Co-Scientist 全文未出现） |

  | **LAB-Bench SeqQA** | 序列问答 | Biomni 同 12.5% 采样 | Biomni |

  | **LAB-Bench LitQA2 / ProtocolQA** | 文献阅读 / 协议排障 | ScienceBuddy：LitQA2 **96 题**、ProtocolQA
  **108 题** | ScienceBuddy |

  | **HLE（Humanity''s Last Exam）生物医学** | 跨学科难题 | Biomni 取 **52 题 / 14 子学科**（每学科≤5
  题） | Biomni |

  | **GPQA (diamond)** | 研究生级理科问答 | 消融用（报 AUC/精度） | Co-Scientist |

  | **Biomni-Eval1** | Biomni 随论文发布 | 作为 ScienceBuddy 的任务来源之一 | ScienceBuddy |

  | **RareBench**（MME 40 / LIRICAL 370 / RAMEDIS 624 / HMS 88） | 罕见病诊断 | 合计约 1,122
  例 | DeepRare |

  | **MyGene2 / DDD / MIMIC-IV-Rare** | 罕见病真实病例 | 146 / 2,283 / 1,875 例 | DeepRare；MyGene2
  亦作 Biomni 的罕见病诊断基准 |

  | **GTEx / Tabula Sapiens / Human Cell Landscape / Mouse Cell Atlas / Azimuth**
  | 细胞注释金标准 | CASSIA 覆盖 **970 个细胞类型** | CASSIA |

  | **Open Targets Genetics / TxGNN / CellxGene / MGM2.0 / HMP** | 变异优先级 / 药物重定位 /
  单细胞 / 微生物组 | — | Biomni |

  | **1000 Genomes（YRI/CEU/CHB）、4DN GM12878、10X PBMC、SRA 小鼠数据** | 生信流程评测数据 | — | BioMaster
  |

  | **DepMap Q2 2024 / Open Targets curated drug targets** | 肿瘤依赖 / 药物靶点 | 药物重定位用
  **2,300 已批准药物 × 34 癌型** | Co-Scientist |


  ## 二、论文自建 benchmark（本组最大共性：**没有现成 benchmark 就自己造**）

  | 论文 | 自建 benchmark | 规模 | 指标 |

  |---|---|---|---|

  | Biomni | 8 个真实世界基准 | 变异优先级 / GWAS 因果基因 / CRISPR 筛选（**18,939 候选基因**）/ 罕见病 / 药物重定位
  / scRNA 注释（20k–50k 细胞）/ 微生物组（5 数据集）/ 患者基因优先级 | Accuracy、对齐分数、平均 post-perturbation
  effect |

  | Co-Scientist | 研究目标集 + 专家策展集 | **203 个**目标（temporal bucket）/ **15 个**专家策展 / **11
  个**盲评 | Elo、偏好排名（1–4）、novelty & impact（1–5） |

  | Paper2Agent | AlphaGenome 三档 + 大规模三语料 | tutorial **15** / novel **15** / open-ended
  **30**；大规模 **300**（74 篇）/ 数据发现 **100** / 非生物 **42** | 正确率（human rubric / 配对 t 检验
  / bootstrap 1 万次） |

  | ChemGraph | 13 个任务（无既有 agentic 化学 benchmark，故自建） | **360 次独立评测** | 最终答案准确率 + 工具调用次数
  |

  | ChemCrow | 自定义化学任务集（专家设计，无公开 benchmark） | **14 个 use cases**；人工 n=56、EvaluatorGPT
  n=14 | 化学正确性 / 推理质量 / 完成度 / 成对偏好（n=4） |

  | BioMaster | 无命名 benchmark，20 个 experiment（6 类流程） | 20 | ✓/× 与完成度（**原文未报告百分比**）
  |

  | ScienceBuddy | 895 任务集（源自 LAB-Bench + Biomni-Eval1） | **895 任务 / 16 子主题**（96 LitQA2
  + 511 DbQA + 108 ProtocolQA + 180 GWAS） | validation acc / first-response acc /
  single-attempt acc / pass@4 |

  | DeepRare | RareBench 体系 + 2 个自建中心数据 | 9 数据集 **6,401 例 / 2,919 病 / 14 专科** | Recall@1
  / Recall@3 / Recall@5 |

  | CASSIA | 5 数据集统一评估 + 多个专门场景集 | **970 细胞类型**；质量分 **>500**（图注 n=530）；marker 扫描 **2,670
  次运行** | 三级分层准确率（完全 1 / 部分 0.5 / 错 0） |


  ## 三、**对抗与鲁棒性**类测试（只有 2 篇做了，最值得补）

  - **Paper2Agent**：① 对 3 个 repo 注入 4 类执行级错误（缺失依赖 / 损坏路径 / 拼写错误 / 弃用 API）= **12 个对抗配置**；②
  **置换 paper–question 配对**测越界正确拒答率；③ **记忆化/shortcut 探测**（硬编码常量、固定路径、缓存输出 + 自动化 reviewer
  扫描）。

  - **ChemCrow**：安全工具硬门（受控化学品相似度 **>0.35** 告警、爆炸物检查、命中即停）+ 执行合成前请求人类授权。


  ## 四、**真实实验/湿实验**验证（只有 3 篇做，是「真能干活」的硬证据）

  - **Biomni**：B2M guide RNA 克隆进 lentiCRISPR v2 Blast → 菌落 → 挑 2 克隆 miniprep → Sanger
  **完美比对**；

  - **ChemCrow**：RoboRXN 机器人平台 **4 个合成全部成功**（DEET + 3 硫脲催化剂）+ 新发色团（目标 369 nm / 实测
  336 nm）；

  - **Co-Scientist**：AML 细胞系剂量-反应 + IC50 拟合 + Chou-Talalay/HSA/Bliss 协同（n=3）+ 肝类器官抗纤维化验证；另有
  **CASSIA**（临床试验 NCT03398694 脑转移瘤 10x 测序）。

  → 注：**DeepRare 未做湿实验**（用真实临床中心数据 + 5 名医师对照替代）；**Paper2Agent 明确无湿实验**（改用 GTEx eQTL
  与两个独立 Perturb-seq 数据集交叉验证）。


  ## 五、选型建议（给后续做同类系统）

  1. **通用能力**首选 LAB-Bench（DbQA/SeqQA/LitQA2/ProtocolQA）+ HLE 子集——本组复用率最高，横向可比；

  2. **领域系统**没有现成 benchmark 就自建，但**必须配一条外部真值**（真实医院数据 / 湿实验 / 独立公开数据集交叉验证），只靠自建题集会被质疑「自证」；

  3. **一定要有对抗测试**（越界拒答 + 注入漂移 + 硬编码探测）——这是「可靠 agent」与「demo」的分水岭；

  4. **题库口径要在正文与图注一致**——本次 7/9 篇有数字不一致，多半出在自建 benchmark 的规模统计上。'
evidence: 逐篇原文汇总（data/lit_text/ 下 9 个纯文本）。出处举例：Biomni DbQA 315 题/12.5% 子集、HLE 52 题、8
  个自建基准；Co-Scientist 203/15/11 目标；Paper2Agent 15+15+30 与 300/100/42 三套；ChemGraph 13
  任务 360 次评测；ChemCrow 14 use cases/n=56/n=14；BioMaster 20 experiments；ScienceBuddy
  895 任务 16 子主题；DeepRare 9 数据集 6,401 例；CASSIA 970 细胞类型 / 2,670 次运行。
