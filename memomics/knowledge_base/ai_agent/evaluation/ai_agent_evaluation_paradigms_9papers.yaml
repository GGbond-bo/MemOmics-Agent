content: '## 用途

  把 9 篇的评测手段拆成**可复用的范式卡**，并记录**踩到的坑**。做 agent 系统评测时逐条对照。


  ## 范式 1：人类专家盲评 + rubric + 评分者间一致性（**最被信任的做法**）

  - **Paper2Agent**：两名独立人类专家按预定义 rubric 打分，**评分者间一致性 96.7%**；生成 agent **无权访问手稿或原始
  repo**（防泄题）。

  - **Biomni**：分子克隆盲评，资深研究员按 Accuracy(1–5) + Completeness(1–5) 打分（平均 20 题）；另在微生物组
  / scRNA 注释 / 多组学 trace 做人工核验。

  - **DeepRare**：**10 名副高/主任医师**评审推理链，随机抽 180 例、每例 **3 名专家**独立评审取均值；**5 名 10 年以上经验医师**与系统同输入对照（163
  例）。

  - **Co-Scientist**：**7 名专家**策展 15 个高难目标并提供各自 best-guess 假设同场竞技；**盲法**在 11 个目标给 1–4
  偏好排名 + novelty/impact 五点量表。

  - **ChemCrow**：专家 panel 三维度（化学正确性 / 推理质量 / 完成度），每条任务 **n=4** 评判偏好。

  - **CASSIA**：金标准纠错用 **3 个 LLM 投票**后再人工核验 marker。

  - ⚠️ **CASSIA 作者自曝**：「No statistical method was used to predetermine sample size
  … we did not perform hypothesis tests on the leaderboard metrics」，且未随机化、未盲法——**这是本组评测设计最弱的一处，做报告时应主动声明**。


  ## 范式 2：LLM-as-a-judge（**有明确反例，必须配人类校验**）

  - **Co-Scientist**：4 个判官模型（o3-mini-2025-01-31、o1-preview-2024-09-12、Gemini 2.0 Pro
  Exp、Gemini 2.0 Flash Thinking Exp 01-21）对 15 个目标排名。

  - **ChemCrow**：**EvaluatorGPT**（"老师批改学生"）。

  - 🔴 **本组最重要的方法论警示（ChemCrow 实证）**：**EvaluatorGPT 的偏好倾向纯 GPT-4**（因回答更流畅完整），而**专家评估偏向
  ChemCrow**（因化学事实性/推理更准）→ **LLM-as-judge 会偏好「流畅」而非「正确」，事实性关键领域不可替代专家评估**。这是做 agent
  评测时最该记的一条。

  - **ScienceBuddy**：用**固定 judge + 可执行检查**组成 rubric 奖励（且坦承「任务自适应 rubric」是为了训练，不是评测真值）。


  ## 范式 3：Elo / 自对弈 / 自动评测（**适合「新假设」类无标准答案任务**）

  - **Co-Scientist**：**Elo-based 锦标赛 + pairwise 模拟科学辩论**（新假设初始 Elo 1,200），203 目标分
  10 个时间桶看**最大个体 Elo 与 top-10 平均 Elo 持续上升、未见饱和**；Reflection/Evolution/Meta-review
  各做消融（GPQA AUC 0.643→0.651、精度 70.9%→75.4%、AUC 0.521→0.597）。

  - ⚠️ 作者自述这是**主观评估、非客观 ground truth**，样本量小（11/15）。


  ## 范式 4：分层/距离感知准确率（**领域分类任务的标准解法**）

  - **CASSIA** 沿用 GPTCelltype 的**三级分层评价**（按 Cell Ontology 树分类学距离分完全/部分/错，1/0.5/0 加权），并对罕见类型适配（识别到
  general category 算部分正确）——**比二元对错更能反映真实质量**。

  - **DeepRare** 用位次指标（Recall@1/@3/@5）而非单一准确率，并**按来源分三档难度**（论文提取=易 / 病例报告=中 / 真实临床中心=难）。

  - **ScienceBuddy** 用 first-response accuracy / single-attempt / **pass@4（problem
  coverage）**三口径，并强调**不同口径不可直接比较**。


  ## 范式 5：消融（**几乎人人做，但理由各异**）

  - Biomni：retriever 消融、LLM 引擎消融、Biomni-ReAct（代码规划 vs ReAct 链式）；

  - Paper2Agent：5 变体（monolithic / 非并行多 agent / 去掉 verifier-improver / Markdown skill
  代替可执行工具 / 换 scaffolding）；

  - BioMaster：分别移除 Plan RAG / Tool RAG / **Check Agent**（长流程严重受损）；

  - ChemGraph：单 agent vs 多 agent（**多 agent 把小模型准确率翻倍**）；

  - Co-Scientist：7 类 agent 逐个消融；

  - DeepRare：中央主机 LLM 替换 + 原始 LLM vs agentic 版 + 模块级（相似病例检索 / Web 知识 / 自反思）——GPT-4o
  **25.60%→54.67%**、DeepSeek-V3 **26.18%→56.94%**；

  - CASSIA：跨 benchmark 系统消融；

  - ScienceBuddy：用「固定模型看 harness」vs「固定 harness 看模型」**解耦两个改进机制**（**并坦承未隔离单个 skill /
  单个反馈来源的贡献**）。


  ## 范式 6：对抗 / 鲁棒性 / 越界（**只有 1 篇系统性做了，强烈建议补**）

  - **Paper2Agent**：12 个对抗 repo-drift 配置（缺失依赖 / 损坏路径 / 拼写错误 / 弃用 API）+ 置换 paper–question
  测越界拒答（**正确拒答率 100%**）+ 记忆化/shortcut 扫描。→ **这是「可靠 agent」评测的模板，其余 8 篇都没有对等设计。**


  ## 范式 7：真实世界闭环验证（**可信度最高的一档**）

  湿实验 / 真实机器人 / 真实临床：Biomni（Sanger 完美比对）、ChemCrow（RoboRXN 4/4 成功）、Co-Scientist（IC50
  + 协同 + 类器官）、CASSIA（临床试验样本）；DeepRare 用**真实临床中心数据 + 医师对照**替代湿实验。


  ## 评测设计检查清单（本次 9 篇合读后提炼）

  - [ ] 题目/题库规模在**正文、Methods、图注三处口径一致**（本次 **7/9 篇**不一致）；

  - [ ] 至少一条**外部真值**（湿实验 / 真实数据 / 独立数据集交叉验证），不能只有自建题集；

  - [ ] LLM-as-judge 必须与人类评估**并列报**，并说明分歧方向（ChemCrow 的反例）；

  - [ ] 报**计算成本与时延**（$/query、min/query）——Paper2Agent 与 CASSIA 都报了，这是可落地性的关键；

  - [ ] 报告**缺失与矛盾**（原文未报告 / 查不到就说查不到），不圆场；

  - [ ] 对「开放式任务」明确 benchmark 度量的**是忠实执行还是分析有效性**（Paper2Agent 的自我限定）。'
evidence: 逐篇原文汇总。出处举例：Paper2Agent 评分者间一致性 96.7%、越界拒答 100%、12 个对抗配置；DeepRare 10 名副高/主任医师审
  180 例、5 名资深医师对照 163 例、消融 25.60%→54.67%；ChemCrow EvaluatorGPT 偏好倾向 GPT-4 而专家倾向 ChemCrow；Co-Scientist
  4 判官模型、Elo 未见饱和、消融 0.643→0.651 / 70.9%→75.4% / 0.521→0.597；CASSIA 三级分层评价 + 「No statistical
  method was used to predetermine sample size」；ScienceBuddy 固定 judge + 可执行检查、未隔离单个
  skill 贡献。
