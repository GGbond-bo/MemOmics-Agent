  ## 数据库

  - Protein Data Bank：提供人80S核糖体结构模型4V6X用于核糖体蛋白定位

  - Gene Ontology (GOCC)：使用cytosolic ribosome等本体项进行过表征分析

  - ClinicalTrials.gov：临床试验注册 NCT05131555

  - ClinicalTrials.gov：NCT04048993 研究注册

  - Lexogen quantseqpool_analysis GitHub：QuantSeq Pool 数据分析流程来源

  - cisTarget v10：pySCENIC 调控网络推断数据库与注释

  - EnsDb.Hsapiens.v86：基因 biotype 注释

  - UCSC Human Genome Browser：基因组位置查询

  - GTEx Portal：lncRNA 组织特异表达查询

  - UniProt UP000005640：reviewed human proteome 用于质谱搜索

  - Protein Data Bank 4V6X：人 80S 核糖体结构模型

  - GO term cytosolic ribosome：蛋白质组数据过滤

  - European Genome-phenome Archive (EGA)：RNA-seq数据存放，study ID EGAS50000000418

  - ProteomeXchange via PRIDE：原始质谱文件及搜索引擎结果存放，identifier PXD046863

