content: '## 测序方法

  - scRNA-seq | 平台 — | 建库 — | 深度 —

  - scRNA-seq | 平台 — | 建库 — | 深度 细胞数：小鼠38,305；斑马鱼40,236；鸡80,777（原文为细胞数，非测序深度）

  - scRNA-seq（多物种：小鼠、斑马鱼、鸡） | 平台 — | 建库 — | 深度 —


  ## 分析流程

  - 种内 scRNA-seq 单细胞聚类分析

  - 识别细胞类型、标志基因、胞内调控和细胞间相互作用

  - 基于标志基因统计功效计算保守性评分以识别保守细胞类型

  - 基于特征加权和模型评估胞内调控和细胞间相互作用的保守性

  - 获取小鼠、斑马鱼、鸡视网膜再生的公开scRNA-seq数据 → 使用原研究的单细胞聚类、细胞类型注释和Müller胶质细胞调控网络

  - 基于MGI脊椎动物同源数据，以相同HomoloGene ID定义跨物种同源基因 → 构建同源基因×物种矩阵

  - 使用Seurat FindAllMarkers鉴定各物种细胞类型marker基因（power>0.35且log表达差异>0.1）

  - 计算细胞类型保守评分CSCT → 以1-CSCT为距离，用UPGMA/hclust构建细胞类型系统发育树 → 鉴定保守细胞类型

  - 鉴定保守marker、跨三物种/两物种保守marker及物种特异性marker

  - 使用IReNA/GENIE3随机森林推断细胞类型特异性基因调控网络（每细胞类型500个随机细胞） → 筛选含TRANSFAC转录因子的调控对 → 取top
  300调控对重建网络

  - 使用IReNA K-means模块化小鼠、斑马鱼、鸡静息和活化Müller胶质细胞调控网络（鼠/斑马鱼10个模块，鸡8个模块）

  - 构建每个物种细胞类型特异性调控网络 → 将调控网络模块化 → 计算任意两物种调控网络CSRN → 依据最高CSRN匹配并保留CSRN高于非零CSRN第三四分位数的保守网络/模块
  → 按IReNA FDR<0.01鉴定保守调控因子 → 使用LIANA/Consensus/SingleCellSignalR进行配体-受体分析 → 过滤低表达基因（<10细胞）和LRscore≤0.5
  → 计算细胞-细胞互作权重和CSII → 保留CSII高于第三四分位数的保守胞间互作 → 可视化（Cytoscape、sankeyD3、circlize、pheatmap）

  - 多物种 scRNA-seq 数据输入 → 单细胞聚类定义细胞类型并构建种内细胞-细胞互作 → 鉴定各细胞类型 marker 和调控网络 → 基于同源基因计算保守性分数（细胞类型/调控网络等）
  → 鉴定保守细胞类型、marker、调控和细胞间互作

  - 小鼠、斑马鱼、鸡视网膜 scRNA-seq 数据 → 计算 CSCT 保守分数 → 构建系统发育树 → 鉴定跨物种保守细胞类型 → 同源基因比较鉴定保守/物种特异
  marker → IReNA 重建各细胞类型调控网络 → 计算 CSRN → 模块化调控网络并计算模块间 CSRN → 鉴定保守调控模块与转录因子 → LIANA/SingleCellSignalR
  计算细胞间相互作用权重

  - 跨物种scRNA-seq数据 → 计算细胞类型保守分数(CSCT) → 构建细胞类型系统发育树 → 鉴定保守markers → 计算调控网络保守分数(CSRN)
  → Müller glia调控模块比较 → 计算细胞间互作保守分数(CSII) → 配体-受体互作相关性分析

  - 各物种独立进行单细胞聚类 → 识别各物种细胞类型、标记基因、胞内调控和细胞间互作 → 整合同源基因信息 → 基于保守特征占全部特征的比例计算保守性得分 →
  结合保守性得分与系统发育树识别保守细胞类型


  ## 软件/包

  - CACIMAR （）：跨物种 scRNA-seq 数据分析细胞身份、标志基因、调控和相互作用

  - SAMap （）：跨物种 scRNA-seq 整合聚类识别保守细胞类型

  - Seurat （）：跨物种 scRNA-seq 整合聚类识别保守细胞类型

  - CAME （）：基于深度神经网络进行跨物种调控程序分析

  - Nvwa （）：基于深度神经网络进行跨物种调控程序分析

  - CACIMAR （）：跨物种保守性分析框架

  - Seurat 4.0（R）：FindAllMarkers鉴定细胞类型marker

  - IReNA （R）：基因调控网络推断与模块化

  - GENIE3 （R）：基于随机森林的基因调控网络推断算法

  - stats （R）：hclust进行UPGMA聚类构建系统发育树

  - ggtree （R）：系统发育树可视化

  - Cytoscape 3.9.1（）：调控网络可视化

  - LIANA 0.1.5（R）：配体-受体互作分析

  - SingleCellSignalR （R）：LIANA中的配体-受体分析算法

  - sankeyD3 0.3.2（R）：sankeyNetwork可视化细胞-细胞互作模式

  - circlize 0.4.15（R）：chordDiagram展示CSII

  - pheatmap 1.0.12（R）：热图展示胞间互作和保守配体-受体对

  - IReNA （R）：鉴定转录因子显著调控模块基因（FDR<0.01）

  - CACIMAR （）：多物种 scRNA-seq 整合分析，计算细胞类型、marker、调控网络和互作的保守性分数并识别保守特征

  - Seurat （R）：AUC 分析鉴定所有视网膜细胞类型的 marker

  - CACIMAR （）：跨物种 scRNA-seq 数据中鉴定保守细胞类型、保守 marker、保守胞内调控网络和细胞间相互作用

  - IReNA （）：重建视网膜细胞类型调控网络并鉴定显著调控模块的转录因子

  - LIANA （）：细胞间相互作用分析包，调用 SingleCellSignalR 算法

  - SingleCellSignalR （）：计算细胞-细胞相互作用权重

  - CACIMAR （R）：跨物种 scRNA-seq 数据保守性分析，鉴定保守细胞类型、标记、调控网络和细胞间互作

  - Seurat （R）：作为已有方法，通过直接聚类跨物种单细胞识别保守细胞类型

  - Harmony （R）：作为已有方法，通过直接聚类跨物种单细胞识别保守细胞类型

  - SAMap （Python）：作为已有方法，通过直接聚类跨物种单细胞识别保守细胞类型

  - Ggtree （R）：将关联数据映射并可视化到系统发育树上

  - IReNA （）：单细胞转录组与染色质可及性谱的整合调控网络分析

  - Cytoscape （）：生物网络可视化与分析

  - SingleCellSignalR （R）：从单细胞转录组推断细胞间通讯网络

  - sankeyD3 （R/JavaScript）：从R生成D3 JavaScript桑基图

  - Circlize （R）：在R中实现和增强环形可视化

  - ggplot2 （R）：数据可视化绘图

  - Harmony （R）：单细胞数据快速、灵敏、准确的整合


  ## 关键参数

  - Seurat FindAllMarkers.power threshold = >0.35（marker基因筛选）

  - Seurat FindAllMarkers.log-scale expression difference = >0.1（marker基因筛选）

  - CACIMAR.marker power (MP) = MP = 2 × abs(AUC – 0.5)（由ROC曲线AUC计算marker区分能力）

  - CSCT.shared markers minimum = ≥2（保守细胞类型判定标准）

  - CSCT.CSCT threshold = > non-zero CSCT values third quartile（保守细胞类型判定标准）

  - IReNA/GENIE3.randomly selected cells per cell type = 500（细胞类型特异性调控网络推断）

  - IReNA.top gene regulation pairs = 300（重建细胞类型特异性调控网络）

  - IReNA K-means.modules (mouse/zebrafish) = 10（Müller胶质细胞调控网络模块化）

  - IReNA K-means.modules (chick) = 8（Müller胶质细胞调控网络模块化）

  - TRANSFAC.transcription factor filtering = 至少包含一个转录因子（筛选基因调控对）

  - IReNA.FDR = <0.01（保守调控因子筛选：转录因子显著调控任一模块基因）

  - LIANA/SingleCellSignalR.LRscore = >0.5（保留配体-受体对，阈值可随不同scRNA-seq数据特征调整）

  - CSRN.conservation threshold = 非零CSRN值的第三四分位数（判定调控网络或调控模块保守）

  - CSII.conservation threshold = 第三四分位数（判定胞间互作保守）

  - Seurat.AUC = 用于鉴定所有视网膜细胞类型 marker（marker 鉴定）

  - CACIMAR.CSCT = 共享 marker 统计功效之和 / 全部 marker 统计功效之和（细胞类型保守性评分）

  - CACIMAR.调控网络保守性评分 = 保守基因与调控关系的加权和（调控网络保守性计算）

  - CACIMAR.基因表达细胞比例阈值 = 至少 5% 细胞（用于 marker 鉴定前过滤基因）

  - CACIMAR.CSRN = 保守基因/all genes 与保守调控关系/all regulatory relationships 的加权和（计算跨物种调控网络保守分数）

  - CACIMAR/IReNA.调控模块数 = 小鼠 Müller glia 10 个；斑马鱼 Müller glia 10 个；鸡 Müller glia 8
  个（模块化调控网络保守性分析，Fig.3B/Fig.S2A）

  - IReNA.显著调控转录因子数 = 每个模块 66 个（鸡 Müller glia 模块化调控网络构建，Fig.S2C）

  - CACIMAR.保守 marker 数 = 三物种四类细胞 24 个；小鼠-斑马鱼 157 个；激活 Müller glia 18 个（保守 marker
  鉴定，Fig.2C/2D/Table S1）

  - CACIMAR.保守细胞类型数 = 三物种 4 个；小鼠-斑马鱼 7 个；斑马鱼 11/15 个保守于小鼠（跨物种保守细胞类型鉴定，Fig.2A）

  - CACIMAR.conservation score = 保守特征数 / 全部特征数（计算细胞类型、胞内调控和细胞间互作的保守性得分）


  ## 数据库

  - Mouse Genome Informatics (MGI)：提供脊椎动物同源数据，以HomoloGene ID建立跨物种同源基因

  - TRANSFAC：提供转录因子信息，用于筛选基因调控对

  - Consensus：LIANA中用于配体-受体互作分析的数据库

  - homologous gene database：识别小鼠、斑马鱼和鸡之间的同源基因

  - GitHub：获取处理后的视网膜再生 scRNA-seq 数据与 CACIMAR R 包代码

  - MGI (Mouse Genome Informatics)：实验室小鼠的遗传、基因组和生物学知识库

  - TRANSFAC：转录调控数据库/从模式到谱'
