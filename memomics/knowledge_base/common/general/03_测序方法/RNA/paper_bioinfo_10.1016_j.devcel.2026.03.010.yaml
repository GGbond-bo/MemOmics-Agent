  ## 分析流程

  - 实验诱导小鼠骨骼肌萎缩/肥厚 → 单核/单细胞转录组测序 → 空间转录组/空间profiling → 高分辨率3D成像 → 细胞群与纤维类型特异性转录反应分析
  → 人去神经/运动肌肉样本验证

  - 小鼠跖肌取材：basal、Den、OVL，3或7天

  - 全肌肉snRNA-seq获得75,343个核

  - 无监督聚类与canonical lineage markers注释

  - 分离肌肉scRNA-seq：FACS富集MuSCs、ECs、SCs等，去除Sca1+CD31− FAPs和CD45+免疫细胞，获得19,879个细胞

  - 整合sn/scRNA-seq数据集

  - 细胞状态与差异基因表达分析（Table S1）

  - snRNA-seq肌核转录组聚类与UMAP分析 → 对41,240个肌核重新聚类 → 鉴定Myonuc1-3亚群 → 差异表达分析 → 功能富集分析

  - SynM筛选与再聚类 → Den/OVL SynM差异表达分析 → 功能富集分析

  - 单核/单细胞转录组 + 空间转录组 + 3D成像 → 整合分析NMJ前/后成分的形态、拓扑和基因表达动态

  - CellChat计算建模 → 分析活化tSCs(aSC1)与去神经SynM的细胞通讯

  - 植物肌（plantaris）样本采集 → 机械剪碎 → Liberase/0.3% dispase 37°C 1.5 h消化 → 过滤/离心 → FBS+10%
  DMSO −80°C冻存 → 解冻 → FACS buffer重悬 → CD45/Sca-1/CD31抗体染色 → CMO室温孵育5 min → 洗涤重悬于0.05%
  BSA PBS → BD FACSAria II分选 → scRNA-seq

  - scRNA-seq：Cell Ranger v7.1.0 比对 GRCm39 → Dropkick v1.2.7 识别空滴和低质量 barcode → Solo
  v1.3 拆分 CMO hashtags 并去除 doublets → Seurat v5.0.1 下游分析

  - snRNA-seq：Cell Ranger v7.1.0 比对 GRCm39 → SoupX 去除 ambient RNA → DoubletFinder
  去除 doublets → Seurat v5.0.1 下游分析

  - scRNA-seq Samples A 和 A2：NormalizeData → FindVariableFeatures(1,500 features)
  → ScaleData 回归细胞周期效应 → RunPCA(top 30 PCs) → Harmony(top 30 PCs) 整合 CMO-labeled samples
  → RunUMAP → FindNeighbors/FindClusters(resolution 0.03) → 基于 canonical skeletal
  muscle marker genes 注释细胞类型

  - snRNA-seq：NormalizeData → FindVariableFeatures(2,000 features) → ScaleData 回归细胞周期效应
  → RunPCA(top 40 PCs) → Harmony(top 40 PCs) 整合 → RunUMAP → FindNeighbors/FindClusters(resolution
  0.1)

  - scRNA-seq 与 snRNA-seq 整合：取各数据集 top 4,000 variable features 交集，并补充 myonuclear、NMJ、MTJ
  cluster marker genes → ScaleData 回归细胞周期效应 → RunPCA(top 30 PCs) → Harmony(top 30
  PCs) 整合 → RunUMAP → 转移细胞类型注释

  - 单核细胞类型差异分析：选取每种条件下 scRNA 和 snRNA 均至少有 30 个细胞/核的细胞类型（ECs、FAPs、MuSCs、SCs），以 basal
  为参考，用 Seurat FindMarkers 计算 Den 和 OVL 差异基因，保留两种模态均显著的基因

  - myonuclear、NMJ、Schwann cell cluster 亚聚类：从 snRNA-seq 子集化后重复处理流程

  - snRNA-seq：聚类/UMAP可视化 → marker基因鉴定 → 细胞类型丰度 → 肌核亚群与条件特异性DEG/功能富集 → atrophy/hypertrophy评分

  - spatial transcriptomics：SynM marker表达评分 → 与相邻BTX染色切片重叠注释NMJ阳性spots → NMJ阳性vs阴性DEG/热图/Venn
  → 预测细胞类型贡献 → 突触基因空间表达可视化

  - sc/snRNA-seq整合 → UMAP降维可视化 → SC亚群鉴定 → 条件间亚群比例分析 → 配体-受体相互作用预测 → BMP/TGFβ/activin信号网络推断
  → RNAscope验证 → 空间转录组NMJ阳性/阴性spot分析 → 人肌肉活检/公共数据集热图分析


