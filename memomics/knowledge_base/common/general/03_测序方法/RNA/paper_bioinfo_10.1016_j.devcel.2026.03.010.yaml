  - SoupX （R）：环境 RNA 校正

  - Harmony v1.2.0（R）：批次整合

  - SpaceRanger v2.0.0（）：10X Visium 空间转录组预处理


  ## 关键参数

  - MyoSight.Li thresholding + particle size limits = 200–3000 μm2（肌纤维CSA定量）

  - CUBIC.预固定冷冻肌肉修剪厚度 = 200–500 μm（CUBIC组织透明化前处理）

  - RNAscope.Protease Plus处理 = 7 min at 40°C（多重荧光原位杂交）

  - RNAscope.探针杂交 = 2 h at 40°C（Inhba/Ajap1/Col3a1探针杂交）

  - 共聚焦成像.3D图像栈视野与深度 = 426.78 × 426.78 μm，深度50–100 μm（全装/RNAscope三维分析）

  - NMJ分析.二维NMJ面积 = 最大强度投影+阈值掩膜（NMJ面积与支配面积定量）

  - SoupX.rho = min(auto-estimated value, 0.154)（snRNA-seq ambient RNA 去除）

  - DoubletFinder.doublet rate = well-specific estimated doublet rate based on nearest
  10X multiplet-rate prediction（snRNA-seq doublet 去除）

  - Seurat.FindVariableFeatures nfeatures = 1,500（scRNA-seq Samples A 和 A2）

  - Seurat.RunPCA npcs = 30（scRNA-seq）

  - Harmony.npcs = 30（scRNA-seq CMO-labeled samples 整合）

  - Seurat.FindClusters resolution = 0.03（scRNA-seq 聚类）

  - Seurat.FindVariableFeatures nfeatures = 2,000（snRNA-seq）

  - Seurat.RunPCA npcs = 40（snRNA-seq）

  - Harmony.npcs = 40（snRNA-seq 整合）

  - Seurat.FindClusters resolution = 0.1（snRNA-seq 聚类）

  - Seurat.top variable features = 4,000 from each dataset（scRNA-seq 与 snRNA-seq 整合）

  - Seurat.FindMarkers marker gene thresholds = adjusted p < 0.001; log2 fold change
  > 3.0; expression > 20% nuclei within cluster（myonuclear/NMJ/MTJ cluster marker
  定义）

  - Seurat.RunPCA npcs = 30（scRNA-seq 与 snRNA-seq 整合数据集）

  - Harmony.npcs = 30（scRNA-seq 与 snRNA-seq 整合数据集）

  - Seurat.FindMarkers DE thresholds = adjusted p < 0.05; |log2 fold change| > 0.15;
  expression ≥ 5% cells/nuclei within enriched group（Den/OVL 与 basal 差异表达分析）


