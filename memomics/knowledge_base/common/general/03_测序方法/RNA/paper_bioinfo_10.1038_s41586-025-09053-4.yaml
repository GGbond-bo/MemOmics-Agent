  ## 分析流程

  - 严格质控（stringent quality control） → 使用scIB平台评估多种数据整合工具 → 选择BBKNN进行数据整合 → UMAP降维嵌入
  → 基于细胞丰度协方差识别细胞模块 → 原位空间/体内扰动数据验证模块内细胞间通讯

  - 多组织 scRNA-seq 细胞类型/亚群注释 → 细胞亚群频率协方差分析 → NMF鉴定因子并取top亚群作为共现节点 → 确定显著相关亚群对作为候选边
  → 构建多个CM网络并进行拓扑/统计评估 → 鉴定12个CM → 按样本中最丰富CM划分CMT → 整合约12,000 GTEx RNA-seq profiles验证CMT/标志物一致性
  → cell2location将CM映射到Visium空间转录组

  - Visium空间分布分析 → CellCharter鉴定cellular niches → Xenium基因panel区分CM02/CM03细胞亚群 → CellPhoneDB计算CM内CCI
  → Immune Dictionary推断细胞因子响应 → Visium检测细胞因子基因表达与空间分布

  - 单细胞/空间转录组数据获取 → 细胞亚群注释与频率统计 → 按绝经状态/年龄分组比较 → CM05/CM06/CM12 regulon活性与MCP基因表达分析
  → PHATE轨迹嵌入与拟时序推断 → Visium空间区域注释 → LOESS平滑成纤维细胞炎症评分趋势

  - 构建跨组织/泛癌单细胞转录组图谱

  - CoVarNet识别共现多细胞群落（CMs）

  - 关联CM活性与绝经状态及相关表型

  - 成纤维细胞亚群频率与空间定位分析

  - 构建绝经轨迹并外部队列重复

  - 泛癌TME中鉴定cCMs并分析cCM02活性

  - 细胞因子分析与DIALOGUE识别MCP

  - TCGA外部验证及临床结局关联

  - 收集并筛选成人新鲜样本scRNA-seq数据集（10x Genomics单细胞，非单核；无/混合/免疫或非免疫富集）

  - 统一至21,812个共同基因（GRCh38 Ensembl 84/93、GENCODE v32/Ensembl 98）

  - 质控：500–8,000 genes、1,000–100,000 counts、<20%线粒体、Scrublet去双细胞、排除<50高质量细胞样本

  - 归一化：每细胞总计数scale factor 10,000 + log转换

  - HVG选择：去除免疫球蛋白/TCR/核糖体/热休克/线粒体基因

  - 回归总基因计数、线粒体百分比和细胞周期

  - 中心化和缩放

  - PCA提取50个主成分

  - BBKNN以dataset为批次变量整合

  - UMAP可视化

  - Leiden聚类resolution=0.1

  - DEG鉴定：log2FC>1、FDR<0.05、Student’s t-test

  - 基于canonical markers/DEGs和CellTypist注释八种大类

  - 进一步上下文特异性聚类非上皮细胞，排除上皮细胞，得到76个非上皮亚群和26个上皮细胞类型

  - pseudo-bulk平均表达

  - 相关距离ward.D层次聚类，dendextend可视化

  - CoVarNet输入频率矩阵、min-max归一化、nsNMF ranks 2–20识别共现网络

  - NMF 30次运行获得一致性输出 → 基于CCC选择最佳rank → 计算细胞亚群共现Pearson相关与特异性 → 筛选特异相关亚群对 → 构建CM网络并置换检验
  → 按样本最丰富CM活性分配CMT标签 → GTEx RNA-seq预处理与CMT签名评分 → 对RNA-seq样本分类CMT → Ro/e组织富集分析 → cell2location空间去卷积
  → 聚合CM活性与共定位评分

  - 计算CM内subset pairs的Spearman相关系数集合S → 计算CM内中位相关系数r → 共定位分数为S中≤r的比例

  - 使用spdep全局双变量Moran’s I计算空间转录组中CM细胞亚群组分的区域聚集分数

  - 使用CellCharter基于基因表达和空间信息聚类Visium spots鉴定细胞生态位 → 按样本独立分析以减少批次效应

  - 使用已发表肠道Xenium数据设计基因panel区分CM02和CM03内多个细胞亚群 → 以转录本密度作为CM强度代理 → k-means(k=2)识别上皮/固有层区域
  → 在肠黏膜6个区域测量CM强度

  - 使用CellPhoneDB进行配体–受体介导的细胞–细胞通讯分析 → 对每个细胞亚群下采样至1000细胞 → 统计推断细胞–细胞相互作用特异性 → 按细胞类型或CM平均相互作用计数
  → 用CellChat验证

  - 按CM高/低活性分组进行CellPhoneDB比较分析 → 聚焦各CM组分的细胞亚群

  - 使用Immune Dictionary细胞因子签名数据库 → 通过clusterProfiler enricher进行细胞类型感知的免疫响应富集分析

  - 构建CM特异性细胞因子网络 → 考虑细胞因子产生和响应 → 用igraph可视化

  - CM活性与组织、性别、年龄组及其他表型因素关联分析

  - 使用 CoVarNet 相关性分析模块，按 coefficients>0.5、FDR<0.05、specificity>0.95 筛选每个癌症类型中特异相关的细胞亚群对
  → 仅用这些细胞亚群对在八种癌症类型间比较

  - 为泛癌图谱生成 91 个亚群 × 955 个样本的频率矩阵 → 使用 CoVarNet 识别 cCM，单 CM 网络中每个因子的 top 15 亚群作为共发生节点候选

  - 用与健康 CM 相同流程量化不同条件下的 cCM02 活性

  - 构建 cCM02 共发生网络：保持原始节点，分别在健康/邻近非肿瘤样本和肿瘤/邻近非肿瘤样本中重新计算边

  - 对 cCM02 每个细胞亚群成分，在肿瘤 vs 邻近非肿瘤中鉴定 DEGs（log2-transformed fold changes > log2(1.2)、FDR<0.05、Student’s
  t-test），并用于 cytokine analysis

  - 仅用肿瘤和邻近非肿瘤样本进行 MCP 识别 → 计算 TCGA RNA-seq 和侵袭前肺病变微阵列数据中 MCP 总体表达

  - 下载 TCGA 数据使用 TCGAbiolinks R 包；仅纳入肿瘤或邻近非肿瘤样本数 >10 的项目；下载侵袭前肺病变数据

  - QC前后统计 → 取三种常用10x Genomics基因注释的交集基因集 → 数据整合 → 在总图谱和子集图谱上使用多种Python整合方法进行基准测试 →
  用scIB计算总体评分（批次校正40% + 生物保守性60%） → 按总体评分排名 → UMAP可视化（按compartment或tissue着色）

  - CM/cCM鉴定 → cCM拓扑和统计评估（connectivity score） → NMF权重排序top 20细胞亚群 → CM网络图 → 按主导cCM分配cCMT并展示cCM活性
  → Ro/e组织偏好分析 → cCM02响应细胞因子热图 → cCM02 MCP整体表达分布比较


