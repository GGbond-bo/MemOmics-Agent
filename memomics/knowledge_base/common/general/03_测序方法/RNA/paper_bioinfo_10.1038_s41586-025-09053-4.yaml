  - Tabula Sapiens：multiple-organ, single-cell transcriptomic atlas of humans

  - GTEx：Genotype-Tissue Expression project

  - GTEx Portal (V8 release)：Retrieve gene TPM and metadata for 17,382 bulk RNA-seq
  samples to validate CMs defined by single-cell data.

