  ## 关键参数

  - Chi-squared test.P-value = <2.2×10−16（细胞类型组成在不同组织间差异）

  - Ro/e.metric = observed/expected cell number ratio（成纤维细胞亚群组织偏好）

  - Shannon equitability.ordering = 从S01最普遍到S12最特异（成纤维细胞亚群排序）

  - CoVarNet.CM数量 = 12（泛组织分析）

  - CellCharter.空间聚类 = CM05与C2 niche对齐；CM02/CM03与C1 niche对齐（回肠切片空间验证）

  - 样本设计.供体数量 = 6（CM稳健性验证）

  - 样本设计.连续回肠切片数 = 4（单供体空间模式验证）

  - Kruskal–Wallis tests.test type = non-parametric（age group comparisons in panels
  a and b）

  - two-tailed unpaired Wilcoxon tests.test type = two-tailed unpaired（pre- versus
  post-menopausal comparisons in panels a and f）

  - Permutation test.P value = 0.00042（convergent regulons in CM05）

  - LOESS.error band = 95% confidence interval（trend lines in panel j）

  - Box plots.whiskers = 1.5× interquartile range（box plots in panels a and f）

  - Scanpy.gene filter = 500–8,000 genes（QC保留细胞）

  - Scanpy.gene counts filter = 1,000–100,000 counts（QC保留细胞）

  - Scanpy.mitochondrial gene counts = <20%（QC保留细胞）

  - Scrublet.doublet score threshold = >90th percentile removed（各队列去除双细胞）

  - Scanpy.min high-quality cells per sample = >=50（排除样本）

  - Scanpy.normalize_total scale factor = 10,000（文库大小标准化）

  - Scanpy.highly_variable_genes = n_top_genes=2000; flavor=cell_ranger; batch_key=datasetID（HVG选择）

  - Scanpy.PCA components = 50（降维）

  - BBKNN.batch variable = datasetID（数据集整合）

  - Scanpy.leiden resolution = 0.1（第一级无监督聚类）

  - Scanpy.DEG thresholds = log2FC >1; FDR <0.05; Student''s t-test（差异表达基因鉴定）

  - CellTypist.models = Immune_All_High; Immune_All_Low（自动细胞注释）

  - NMF R package.method; ranks = nsNMF; 2–20（CoVarNet共现程序解析）

  - hclust.method; distance = ward.D; correlation distance（非上皮细胞亚群层次聚类）

  - CoVarNet.frequency matrix = 76 subsets × 510 samples（泛组织图谱细胞亚群频率矩阵）

  - NMF.runs = 30（Consensus output robustness）

  - NMF.optimal rank = 12（Pan-tissue atlas rank selection）

  - CoVarNet.correlation = Pearson correlation coefficient（Assess whether two cell
  subsets co-occur）

  - CoVarNet.specificity cutoff = Cutoff(n,N)=1−((n−1)×2−1)/((N−1)×2−1)（Automatic
  specificity cutoff for specifically correlated subset pairs）

  - CM network.permutation test n = 10,000（Statistical significance of connectivity
  score on node labels）

  - CMT classification.CM activity sum per sample = 1（NMF coefficient matrix activities）

  - CMT classification.CMT groups = 12（Healthy single-cell samples stratified）

  - GTEx RNA-seq preprocessing.library size = 10,000（Re-normalization for comparability
  with single-cell data）

  - GTEx RNA-seq preprocessing.log transformation = log-transformed（Gene expression
  normalization）

  - CMT signature.top DEGs = 10（Ranked by fold change among pseudo-bulk CMT samples）

  - Seurat AddModuleScore.negative score adjustment = zero（All negative scores adjusted
  to zero）

  - Seurat AddModuleScore.sample exclusion threshold = highest score < 0.2（Excluded
  278/12,240 (2.3%) samples for robust classification）

  - GTEx CMT classification.final samples = 11,962（Classified into 12 CMTs）

  - cell2location.subsampling = 1,000 cells per cell subset（scRNA-seq reference preparation;
  all available if fewer than 1,000）

  - cell2location.N = 5（Expected cell abundance per spot）

  - cell2location.αy = 20（Regularize within-experiment variation in RNA detection
  sensitivity）

  - Spatial CM activity.scaling = 99th percentile = 1（Scale CM activities for relative
  magnitude comparison）

  - Tissue prevalence.Ro/e enrichment = Ro/e > 1（Enrichment definition）

  - CellPhoneDB.subsampling cell number = 1,000 cells per cell subset（equalize contribution
  of each cell subset in global analysis; include all cells if total <1,000）

  - k-means clustering.k = 2（identify spatial regions epithelium or lamina propria
  in Xenium analysis）

  - DEG analysis (Scanpy).log2-transformed fold change = >log2(1.2)（CM-dependent DEGs
  of immune subsets）

  - DEG analysis (Scanpy).FDR = <0.05（CM-dependent DEGs of immune subsets）

  - DEG analysis (Scanpy).statistical test = Student’s t-test（CM-dependent DEGs of
  immune subsets）

  - clusterProfiler enricher.FDR = <0.05（hypergeometric test for cytokine response
  enrichment）

  - cytokine network.normalized cytokine gene expression = >0.1（in at least one non-responsive
  cell subset for inclusion in CM-specific network）

  - association analysis.minimum samples per tissue = ≥5（exclude tissues with fewer
  than five samples）

  - age association.age groups = <35, 35–39, 40–49, 50–59, 60–69, 70–85 years（age
  group categorization）

  - breast dataset D03.age categories = <50 or ≥50 years（dataset with over 100 samples）

  - linear model.adjusted R2 = proportion of variance explained（CM activity vs tissue
  association）

  - linear model.FDR of F test = reported（robustness of tissue association）

  - sex comparison.FDR-adjusted significance = （CM activities between male and female
  participants in non-reproductive tissues）

  - additional phenotype association.specific CM-phenotype pairs = CM09-alcohol (lymph
  node), CM06/CM11-childhood tuberculosis (lung), CM12-menopause (breast), CM07-menstrual
  cycle phases (uterus)（phenotype association analyses）

  - CoVarNet.coefficient cutoff = >0.5（Derivation of specifically correlated cell-subset
  pairs for each cancer type）

  - CoVarNet.FDR cutoff = <0.05（Derivation of specifically correlated cell-subset
  pairs for each cancer type）

  - CoVarNet.specificity cutoff = >0.95（Derivation of specifically correlated cell-subset
  pairs for each cancer type）

  - CoVarNet.top subsets per factor = 15（Co-occurring node candidates in a single
  CM network for pan-cancer analysis）

  - CoVarNet.frequency matrix dimensions = 91 subsets x 955 samples（Pan-cancer atlas
  cCM identification）

  - DEG analysis.log2-transformed fold change = >log2(1.2)（Tumour versus adjacent
  non-tumour samples for cCM02 cell-subset components）

  - DEG analysis.FDR = <0.05（Tumour versus adjacent non-tumour samples for cCM02 cell-subset
  components）

  - DEG analysis.statistical test = Student’s t-test（Tumour versus adjacent non-tumour
  samples for cCM02 cell-subset components）

  - MCP analysis.minimum sample count per project = >10 tumour or adjacent non-tumour
  samples（TCGA project inclusion）

  - scIB.overall score weighting = batch correction 40%, bio-conservation 60%（benchmarking
  integration methods on total atlas and subset atlas）

  - 10x Genomics gene annotations.gene set intersection = three commonly used versions（data
  integration）

  - NMF.rank = 12（Final rank chosen based on cophenetic correlation coefficients and
  consistency）

  - NMF.top cell subsets ranked by NMF weights = 15（Top 15 cell subsets ranked per
  factor/CM）

  - CM network.connectivity score = ratio of observed edges to total possible edges
  among all nodes within CM network（Topological/statistical evaluation of CMs）

  - CMT assignment.dominant CM = sample assigned to CMT based on its dominant CM（scRNA-seq
  and GTEx RNA-seq samples）

  - CM Shannon equitability.metric = Shannon equitability across tissues（CM diversity
  across tissues）

  - GTEx validation.tissues = 23（GTEx RNA-seq samples across 23 tissues）

  - scRNA-seq cohort.tissues = 34（CM activities in scRNA-seq samples across 34 tissues）

  - Tissue prevalence.Ro/e = Ro/e（CM tissue prevalence measured for tissues profiled
  by single-cell and bulk RNA-seq）

  - Spatial aggregation.Moran’s I = Moran’s I（Spatial aggregation among cell subsets
  within CM08 or CM10; averaged across six Visium sections from six donors）

  - Spatial metrics.colocalization score = extent to which two cell subsets colocalize
  within the same spots（10x Visium data）

  - Spatial metrics.aggregation score = spatial adjacency of two cell subsets, including
  colocalization and broader spatial relationships（10x Visium data）

  - CM composition.lineage proportion thresholds = None = 0 < Low < 0.2 ≤ Medium <
  0.4 ≤ High（Proportion of different cell lineages in all cell-subset nodes within
  individual CM networks）

  - CM cytokine responsiveness.CM FDR = minimum FDR value among all subsets within
  the CM（Cytokine responsiveness in CMs）

  - Breast analysis.age-group cutoff = under 50 years old vs over 50 years old（CM12
  activity and S10/S06 fibroblast frequencies）

  - Breast menopause validation.FDR dotted line = 0.05（Association between menopausal
  status and nonepithelial subset frequencies）

  - Statistical tests.significance thresholds = *P < 0.05, **P < 0.01, ***P < 0.001,
  ****P < 0.0001（One-tailed unpaired Wilcoxon tests in GTEx validation）

  - Box plots.box plot definition = center line median; box limits upper/lower quartiles;
  whiskers 1.5× interquartile range（Used in multiple panels）

  - CM05 analysis.convergent regulons = 17（Regulatory network of convergent regulons
  in CM05）

  - CM05 analysis.shared key regulator TFs = 8（Shared TFs between SCENIC regulon TFs
  and signature TFs）

  - CM05 analysis.CM05 subsets = 4（Venn overlap of four CM05 subsets in all signature
  genes and signature TFs）

  - connectivity score.定义 = observed edges / total possible edges among all nodes
  within the cCM network（cCM拓扑与统计评估）

  - NMF.展示细胞亚群数 = top 20（每个cCM因子的NMF权重排序）

  - Ro/e.组织流行度度量 = Ro/e（cCMs的组织流行度）

  - Wilcoxon test.检验类型 = two-tailed unpaired（健康、癌旁非肿瘤和肿瘤样本比较）

