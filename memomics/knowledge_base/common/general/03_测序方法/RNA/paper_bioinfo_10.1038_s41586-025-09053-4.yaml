  ## 分析流程

  - Stringent quality control to obtain 2,293,951 high-quality cells from 706 healthy
  samples across 35 human tissues

  - Evaluation of widely used data integration tools using scIB

  - Selection of BBKNN as top-performing integration method

  - UMAP embedding for visualization

  - Covariance in cellular abundance to identify 12 cellular modules

  - In situ spatial and in vivo perturbation data to demonstrate coordinated intercellular
  communication within cellular modules

  - Analysis of ageing dynamics, breast menopausal trajectory and cancer rewiring
  across cancer types

  - 数据整合 → 无监督细胞聚类 → 层级细胞注释 → UMAP降维可视化 → 细胞类型组成分析（卡方检验） → 非上皮细胞亚群层级聚类 → 成纤维细胞亚群Ro/e组织偏好分析
  → Visium空间分布映射

  - 细胞类型/状态/亚群注释 → 将多细胞协调表示为共发生细胞网络 → CoVarNet使用NMF识别因子并取top亚群作为共发生节点 → 确定特异相关亚群对作为潜在边
  → 连接节点和边构建多个CM网络 → 拓扑与统计评估 → 应用泛组织图谱鉴定12个CM → 以NMF系数矩阵作为CM活性并分类样本为CMT → 整合scRNA-seq与GTEx约12,000
  RNA-seq验证 → 用cell2location将CM映射到Visium空间转录组

  - 样本-细胞亚群归一化频率 → 成对相关性 rij 计算 → 特异性评分 Spec(rij) → 拓扑评估/置换检验 → NMF → 鉴定12个跨组织CMs
  → Ro/e评估组织富集 → CellCharter空间聚类验证C1/C2 niche → Xenium高分辨率原位基因表征

  - Integration of single-cell and spatial data → dissect multicellular ecosystems

  - Visium spatial data → spatial organization analysis of CM components

  - Single-cell data → CellPhoneDB ligand–receptor-mediated cell–cell communication
  analysis

  - Immune Dictionary in vivo perturbation data → identify cell-type-specific cytokines
  inducing cellular phenotypes

  - SCENIC → uncover regulators/regulons of CM05 subsets

  - DIALOGUE → identify CM12-related coordinated multicellular programmes (MCPs)

  - Cell subset frequency summarization → CM05/CM06 regulon activity by age group
  → CM12 MCP gene expression by menopausal status → CM12 activity and fibroblast subset
  frequency comparison → Visium spatial mapping of S10/S06 → PHATE trajectory embedding
  → pseudotime ordering → LOESS smoothing of fibroblast inflammatory scores → statistical
  testing (Kruskal–Wallis, Wilcoxon, permutation)

  - CoVarNet applied to eight cancer types to identify cancer-associated CMs (cCMs)

  - DIALOGUE analysis to identify an MCP associated with increased cCM02 activity
  in tumour samples

  - External breast dataset replication of menopausal trajectory and fibroblast changes

  - TCGA validation of the S100-family TME programme

  - Curation of pan-cancer single-cell datasets

  - Generation of pan-tissue and pan-cancer cell atlases

  - Identification/characterization of cancer-associated CMs by CoVarNet

  - Interrogation of healthy CMs in matched tumour and adjacent non-tumour samples

  - Spatial mapping of CM activities

  - Evaluation across eight cancer types with matched healthy, tumour and adjacent
  non-tumour samples

  - 数据收集：筛选成人新鲜样本、非单核、10x Genomics单细胞数据 → QC：统一基因注释至21,812基因，排除低质量/生殖系细胞，保留500–8,000
  genes、1,000–100,000 counts、<20% mito，Scrublet去双细胞，排除<50高质量细胞样本 → 预处理：total-count
  normalization scale factor 10,000 → log transform → HVG选择(n_top_genes=2000, flavor=cell_ranger,
  batch_key=datasetID) → 去除免疫球蛋白/TCR/核糖体/热休克/线粒体基因 → regress_out confounders → scaling
  → PCA 50 PCs → BBKNN整合 → UMAP → Leiden resolution=0.1 → DEG鉴定 → CellTypist注释 → 多级聚类。

  - CoVarNet：输入细胞亚群频率矩阵 → min-max normalization → NMF(nsNMF, ranks 2–20)识别共现节点 → 识别相关亚群对作为潜在边
  → 构建CM网络 → 拓扑与统计评估。

  - NMF consensus: 30 runs → derive consensus k factors and sample activities

  - Rank selection: compute CCC across ranks → apply criteria ρk−2 < ρk−1 < ρk and
  ρk > ρk+1 → choose rank with maximum CCC; pan-tissue rank = 12

  - CoVarNet co-occurrence: Pearson correlation on subset frequency matrix → s×s correlation
  matrix R → compute specificity index Spec(rij) and cutoff Cutoff(n,N) → identify
  specifically correlated subset pairs (147 pan-tissue pairs)

  - CM network construction: top subsets as nodes → connect specifically correlated
  subset pairs → remove isolated nodes → calculate connectivity score → permutation
  test n=10,000 → visualize with igraph

  - CMT classification of samples: use NMF coefficient matrix activities (sum = 1
  per sample) → label each sample by most abundant CM → 12 CMT groups

  - GTEx RNA-seq preprocessing: retrieve TPM and metadata for 17,382 samples (V8)
  → exclude cell lines → merge Cervix uteri into Uterus → retain 12,240 samples across
  23 tissues → renormalize to library size 10,000 and log-transform

  - CMT classification of RNA-seq samples: identify DEGs among pseudo-bulk CMT samples
  → top ten DEGs by fold change as CMT signature genes → AddModuleScore in Seurat
  → set negative scores to zero → exclude samples with highest score <0.2 → classify
  remaining 11,962 samples into 12 CMTs

  - Tissue prevalence: compare observed vs expected cell numbers using Chi-square
  → Ro/e = observed/expected → enrichment Ro/e > 1 → average CM activity per tissue
  → compare bulk and single-cell Ro/e across 23 tissues → visualize with ComplexHeatmap

  - Spatial transcriptomics deconvolution: collect Visium/Xenium datasets → use integrated
  scRNA-seq reference subsampled to 1,000 cells per subset → run cell2location with
  N=5 and αy=20 → obtain expected cell abundance per cell subset per spot

  - Spatial CM activity: aggregate component cell-subset abundances within each CM
  using NMF-derived weights → scale CM activities so 99th percentile across all CMs
  = 1

  - Colocalization scores: calculate cell-subset component colocalization within CMs
  across Visium spots for individual spatial sections

  - Colocalization score: Spearman correlations between subset pairs where at least
  one subset is within CM → median r → proportion of correlations ≤ r. Aggregation
  score: global bivariate Moran’s I via spdep. Cellular niches: CellCharter clustering
  Visium spots using gene expression and spatial information per sample. Xenium: design
  gene panel → k-means (k=2) to identify epithelium/lamina propria → select six mucosal
  areas → measure CM intensities. Cell–cell communication: subsample each cell subset
  to 1,000 cells → CellPhoneDB statistical inference → average interaction counts
  among cell types/CMs → validate with CellChat. Comparative analysis: high vs low
  CM activity groups → CellPhoneDB on CM component subsets. Cytokine response: identify
  CM-dependent DEGs with Scanpy (log2FC>log2(1.2), FDR<0.05, Student’s t-test) → build
  cytokine signatures from Immune Dictionary → MGI ortholog conversion → hypergeometric
  enrichment via clusterProfiler enricher (FDR<0.05) → construct CM-specific cytokine
  networks (cytokine expression >0.1 in non-responsive subsets) → visualize with igraph.
  Association analysis: linear model for CM activity vs tissue (≥5 samples, adjusted
  R2, F-test FDR) → sex/age group comparisons → additional phenotype associations.

  - For each cancer type, derive specifically correlated cell-subset pairs using CoVarNet
  correlation analysis module with coefficients >0.5, FDR <0.05 and specificity >0.95
  → compare identified specifically correlated subset pairs across eight cancer types

  - Generate a frequency matrix consisting of 91 subsets and 955 samples for the pan-cancer
  atlas → identify cCMs using CoVarNet with the top 15 subsets of each factor as co-occurring
  node candidates in a single CM network

  - Measure cCM02 activities across different conditions using the same procedure
  as in healthy CMs

  - Construct two cCM02 co-occurring networks with nodes same as original cCM02 nodes
  and edges recalculated in healthy+adjacent non-tumour samples and tumour+adjacent
  non-tumour samples

  - For each cCM02 cell-subset component, identify DEGs in tumour samples compared
  with adjacent non-tumour samples using log2-transformed fold changes >log2(1.2),
  FDR <0.05 and Student’s t-test → perform cytokine analysis using identified DEGs

  - Identify MCPs using only tumour and adjacent non-tumour samples → calculate overall
  expression of MCP for TCGA RNA-seq datasets and microarray data of pre-invasive
  lung lesions → download TCGA datasets with TCGAbiolinks and include only projects
  with more than ten tumour or adjacent non-tumour samples

  - QC → data integration (intersecting gene sets from three 10x Genomics gene annotations)
  → benchmarking data integration methods (scIB) → UMAP visualization

  - NMF rank selection using cophenetic correlation coefficients and consistency →
  choose final rank 12 → generate consensus plot for rank 12 → rank top 15 cell subsets
  by NMF weights per factor/CM → evaluate CM topology/statistics with connectivity
  score → calculate CM activities in scRNA-seq samples across 34 tissues → assign
  CMT by dominant CM → calculate CM Shannon equitability across tissues

  - GTEx RNA-seq validation: GTEx analysis pipeline → intersect tissues between GTEx
  RNA-seq and curated scRNA-seq cohorts → calculate CM activities in RNA-seq samples
  across 23 tissues → assign CMT by dominant CM → compare average expression of CMT
  signature genes and selected cell subset markers between scRNA-seq and GTEx RNA-seq
  grouped by CMT → measure tissue prevalence of CMs by Ro/e

  - Spatial characterization: 10x Visium spatial distribution of CM08/CM10 and component
  cell subsets in skin → calculate Moran’s I spatial aggregation within CMs across
  sections → H&E staining, CM spatial distribution, and CellCharter cellular niches
  in ileum Visium sections → CODEX imaging of intestinal Peyer’s patches → scRNA-seq
  dot plot of gene panel differentiating CM02 and CM03 among colon cell subsets

  - Cell-cell interaction and spatial metrics: define colocalization and aggregation
  scores for CMs using 10x Visium → calculate CM aggregation scores and cellular composition
  → CellPhoneDB cell-cell interaction analysis → CellChat interaction counts stratified
  by ligand-receptor pair types → heat map of responsive cytokines among cell subsets
  within CMs → assess cytokine responsiveness in CMs

  - Association analysis: linear models for variance in CM activities explained by
  tissue (adjusted R2) → Wilcoxon tests for sex associations in non-reproductive tissues
  → Kruskal-Wallis tests for age-group associations → analyze CM09 activity and subset
  frequencies in thymus by age → analyze immune subset frequencies in spleen by age
  → analyze B08 subset frequency in spleen by age

  - CM05 spleen analysis: Venn overlap of four CM05 subsets signature genes and signature
  TFs → analyze NR4A1/NR4A2/NR4A3 expression in CM05 subsets and other cells within
  same cell types → overlap SCENIC regulon TFs with signature TFs → build regulatory
  network of 17 convergent regulons with key regulators highlighted → compare regulon
  targets among cell types by hypergeometric tests

  - CM12 breast analysis: compare inflammatory scores of CM12 subsets pre- and post-menopause
  → associate menopausal status with nonepithelial subset frequencies → dot plot selected
  signature genes of CM12-related specialized fibroblast subsets → spatial distribution
  of CM12 cell subsets in breast spatial transcriptomics → compare CM12 activity and
  S10/S06 fibroblast frequencies in under 50 and over 50 years → validate menopausal
  trajectory in another breast dataset using PHATE and pseudotime → LOESS-smooth fibroblast
  inflammatory scores along pseudotime

  - Pan-cancer dataset overview: report donor, sample and cell numbers before and
  after QC for scRNA-seq datasets → count samples per cohort → count cells per cancer
  type

  - CM/cCM活性分析 → cCM拓扑与统计评估（connectivity score） → NMF权重排序细胞亚群（top 20） → CM网络图展示 →
  泛癌cCM活性分析与cCMT分配 → Ro/e组织流行度分析 → cCM02细胞因子响应热图 → cCM02 MCP总体表达分布分析


