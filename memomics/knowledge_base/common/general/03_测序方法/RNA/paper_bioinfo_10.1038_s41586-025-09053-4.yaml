  ## 关键参数

  - Xenium.n = 6（CM02和CM03在肠道黏膜切片的成像定量）

  - Visium.n = 34（CM共定位评分跨样本分析）

  - CellPhoneDB.样本数 = CM02 n=90; CM04 n=90; CM05 n=90; CM06 n=72; CM08 n=72; CM09
  n=90（高/低CM活性单细胞样本中CM内CCI计数）

  - 统计分析.检验 = two-tailed paired Wilcoxon tests（Fig. 3e,g）

  - 统计分析.检验 = Kruskal−Wallis, P < 2.2 × 10−16（CM共定位评分相关分析）

  - Immune Dictionary.CM-level FDR = CM内所有亚群中的最小FDR值（CM02、CM03和CM05细胞因子响应性推断）

  - Visium.细胞谱系比例阈值 = None: 0; 0 < low < 0.2; 0.2 ≤ medium < 0.4; high ≥ 0.4（CM网络内细胞谱系组成）

  - Kruskal–Wallis.P = 0.00028；0.00044；6×10^-4；0.019；0.0022（CM05/CM06 activity across
  age groups）

  - two-tailed unpaired Wilcoxon.P = 0.022；0.00041；4.1×10^-5；<2×10^-16（pre- vs post-menopausal
  CM12/S06/S10及MCP表达比较）

  - permutation test.P = 0.00042（CM05 convergent regulons）

  - LOESS.confidence interval = 95% CI（fibroblast inflammatory score along pseudotime）

  - Scanpy.n_top_genes = 2000（HVG选择）

  - Scanpy.flavor = cell_ranger（HVG选择）

  - Scanpy.batch_key = datasetID（HVG选择）

  - Scanpy.resolution = 0.1（Leiden第一层聚类）

  - DEG鉴定.log2FC = >1（差异表达基因筛选）

  - DEG鉴定.FDR = <0.05（差异表达基因筛选）

  - DEG鉴定.检验方法 = Student’s t-test（差异表达基因筛选）

  - PCA.主成分数 = 50（降维与整合前处理）

  - scIB.总体评分权重 = 40/60（批次校正与生物变异保留的加权平均）

  - scIB.排除指标 = kBET、HVG和trajectory的生物保守性（整合方法基准测试）

  - BBKNN.batch变量 = dataset（数据整合）

  - NMF.方法 = nsNMF（CoVarNet频率矩阵分解）

  - NMF.ranks = 2–20（CoVarNet频率矩阵分解）

  - CoVarNet.归一化 = min-max（频率矩阵校正至0–1）

  - CoVarNet.频率矩阵 = 76 subsets × 510 samples（泛组织图谱输入频率矩阵）

  - 层次聚类.距离 = correlation（非上皮亚群层次聚类）

  - 层次聚类.方法 = ward.D（非上皮亚群层次聚类）

  - NMF/CoVarNet.runs = 30（一致性输出，获得k个因子及各样本活性）

  - NMF/CoVarNet.optimal rank = 12（pan-tissue atlas最佳rank，基于CCC最大化）

  - CCC.criteria = ρk−2<ρk−1<ρk 且 ρk>ρk+1（NMF rank选择稳定性标准）

  - CoVarNet.correlation = Pearson相关系数（评估细胞亚群共现）

  - CM网络.permutation test = n=10,000（评估连接性score统计显著性）

  - CMT分类.activity normalization = 每样本所有CM活性总和=1（按最丰富CM分配CMT标签）

  - GTEx RNA-seq预处理.library size = 10,000（重归一化并与单细胞数据可比）

  - GTEx RNA-seq预处理.transform = log转换（表达数据标准化）

  - Seurat AddModuleScore.CMT signature genes = 按fold change排序的前10个DEG（定义CMT签名基因并评分RNA-seq样本）

  - Seurat AddModuleScore.negative scores = 负分调整为0（CMT评分计算）

  - GTEx CMT分类.score threshold = 最高分<0.2（排除278/12,240 (2.3%)样本）

  - 组织流行度.Ro/e = observed/expected，富集>1（细胞亚群和CM组织分布）

  - 空间去卷积.scRNA-seq subsampling = 每个细胞亚群1,000细胞；不足则全部（cell2location参考）

  - cell2location.N = 5（每个spot预期细胞丰度）

  - cell2location.αy = 20（正则化RNA检测灵敏度实验内变异）

  - 空间CM活性.scaling = 第99百分位设为1（比较CM相对大小）

  - CellPhoneDB.每个细胞亚群下采样细胞数 = 1,000（全局分析中平衡各细胞亚群贡献；不足1,000则全部纳入）

  - Scanpy.DEG阈值 = log2-transformed fold changes > log2(1.2), FDR < 0.05, Student’s
  t-test（鉴定CM依赖性细胞亚群DEGs）

  - clusterProfiler.hypergeometric test FDR = < 0.05（细胞因子响应富集分析）

  - 细胞因子网络.标准化表达阈值 = > 0.1（至少一个非响应细胞亚群中细胞因子基因标准化表达超过该值才纳入CM）

  - k-means.k = 2（Xenium数据中识别上皮或固有层组织区域）

  - 线性模型.adjusted R2/FDR = adjusted R2；F检验FDR（CM活性与组织关联分析）

  - 年龄分组关联分析.年龄组 = <35, 35–39, 40–49, 50–59, 60–69, 70–85；乳腺数据集<50或≥50（CM活性与年龄组关联分析）

  - CoVarNet.coefficients = >0.5（每个癌症类型中筛选特异相关细胞亚群对）

  - CoVarNet.FDR = <0.05（每个癌症类型中筛选特异相关细胞亚群对）

  - CoVarNet.specificity = >0.95（每个癌症类型中筛选特异相关细胞亚群对）

  - CoVarNet.top subsets per factor = 15（泛癌分析中单 CM 网络的共发生节点候选）

  - CoVarNet.frequency matrix dimensions = 91 subsets × 955 samples（泛癌图谱 cCM 识别）

  - DEG analysis.log2-transformed fold changes = >log2(1.2)（cCM02 肿瘤 vs 邻近非肿瘤）

  - DEG analysis.FDR = <0.05（cCM02 肿瘤 vs 邻近非肿瘤）

  - DEG analysis.test = Student’s t-test（cCM02 肿瘤 vs 邻近非肿瘤）

  - MCP analysis.minimum samples per project = >10 tumour or adjacent non-tumour samples（TCGA
  数据集纳入标准）

  - scIB.overall score weighting = 批次校正40%；生物保守性60%（Extended Data Fig.2a 总图谱和子集图谱基准测试）

  - 10x Genomics gene annotations.gene set = 三种常用版本基因注释的交集（Extended Data Fig.1b 用于数据整合）

  - cCM network.connectivity score = observed edges / total possible edges among all
  nodes within the cCM network（cCMs的拓扑和统计评估（Extended Data Fig. 11b））

  - cCMT assignment.dominant cCM = each sample assigned to cCMT by its dominant cCM（cCM
  activities across cancer types（Extended Data Fig. 12a））

  - Ro/e.tissue prevalence = measured by Ro/e（cCM组织流行度（Extended Data Fig. 12b））

  - Wilcoxon test.test = two-tailed unpaired Wilcoxon tests（健康、癌旁非肿瘤和肿瘤样本间比较（Extended
  Data Fig. 11a; Extended Data Fig. 12c,f））

  - box plot.whiskers = 1.5× interquartile range（箱线图展示（Extended Data Fig. 11a,b; Extended
  Data Fig. 12c））


  ## 参考基因组

  GRCh38 (Ensembl 84, Ensembl 93, GENCODE v32/Ensembl 98)


