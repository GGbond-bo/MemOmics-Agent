  ## 分析流程

  - 计算细胞-细胞相似度 → 构建相似度图 → 识别信息基因 → 组织为基因模块 → 结合多模态相似度检测对应基因模块

  - 构建细胞间相似图/相似度映射 → 基于相似图进行特征选择，筛选非随机表达模式基因 → 对候选基因进行成对评估，构建 Z score 矩阵 → 聚类 Z score
  矩阵形成基因模块

  - 选择细胞相似性定义（空间邻近/谱系树/表达谱相似性等） → 计算细胞间K最近邻相似图 → 对每个基因计算局部自相关统计量Hx → 使用零模型标准化表达并转换Z分数进行显著性检验
  → 筛选显著基因 → 对基因对计算局部相关统计量Hxy → 使用UPGMA层次聚类合并高Z分数模块 → Z分数低于阈值或模块基因数超过配置上限时停止合并

  - SymSim 模拟单细胞 RNA-seq 表达数据 → scVI 推断低维隐空间 → Hotspot 在 scVI 隐空间中以欧氏距离构建最近邻图 → 基于负二项零模型计算
  Hx/Hxy 统计量 → 特征选择与基因模块识别 → 与 HVG、NBDisp、PCA、WGCNA、ICA、Grnboost 等方法比较 → 用 precision-recall、模块分配准确度、GR
  评分及 UMAP 可视化评估

  - scVI 重训练于所选基因 → 生成相似性图 → 使用表面蛋白丰度计算 autocorrelation 评估特征选择质量

  - Hotspot 选择 top 500 显著基因 → 模块识别 → 分析各模块基因表达程序

  - 按细胞将 CD4+ T 细胞样本一分为二生成伪重复 → 在第一半计算 Hotspot Z scores 和 Pearson 相关系数 → 用 Spearman
  相关比较其与 held-out 第二半 Pearson 相关

  - 使用相同输入基因列表（top 1,000 highly variable genes）评估各方法模块分配跨重复一致性

  - 空间转录组：Hotspot Bernoulli 模式 → 二维空间 K=300 最近邻图 → 鉴定 560 个显著空间自相关基因（FDR<0.05）→ 与
  Seurat HVG 比较

  - 在 CD14+ 单核细胞亚群重复伪重复/模块一致性分析

  - CD4+ T 细胞特征选择：Hotspot/HVG/NBDisp/PCA → 变化选择阈值计算 MSigDB CD4+ T 细胞相关基因集平均基因相关性 →
  选 top 1,000 基因 → scVI 构建潜在空间 → 计算 15 个表面蛋白局部自相关 Z 分数比较细胞状态

  - CD4+ T 细胞模块评估：各方法 top 2,000 基因 → 比较局部自相关分布；Hotspot top 500 基因 → 基于成对局部相关分 12 模块；按细胞二分数据集
  → 评估模块重复性、模块数、分配基因数

  - 小鼠小脑空间转录组：Hotspot 鉴定显著空间自相关基因（845 genes, FDR<0.05）→ 基于成对空间相关分 6 个基因模块 → 计算模块评分可视化；用细胞类型
  marker 基因富集关联细胞类型

  - Hotspot 与 SpatialDE 比较：已知阳性检测（Saunders et al., 2018 marker genes）→ IDR 样本间重复性比较
  → 运行时间随细胞/位置数增加比较

  - 构建细胞-细胞相似性图（空间邻近、谱系树关系或表达 PCA 邻近的 KNN 图） → 局部自相关检验识别信息基因（FDR<0.05） → 基于局部表达相似性将基因分组为模块
  → 与注释发育簇/表达空间比较解释模块

  - 计算细胞-细胞度量（可来自基因表达或替代模态）

  - Hotspot 识别与表达空间相关的特征

  - 计算局部自相关分数

  - 对多个区域或 guide RNA 重复检测并排序，筛选感兴趣特征用于后续分析

  - 将 FDR<0.05 的 lineage autocorrelation 基因基于 pairwise lineage correlation 分为 5 个模块

  - 将模块 summary scores 投影到表达数据 UMAP

  - 用 Chan et al. (2019) 的 42 个手动注释 kernel 注释 lineage 来源模块

  - 比较基因表达来源模块与 lineage 来源模块，识别 angioblast 等转录支持信号并展示 Pecam1

  - 选择 informative genes（基于细胞-细胞相似性度量） → 将表达投射到细胞流形可视化（如 tSNE/UMAP）识别非随机视觉模式 → 使用
  Geary''s C 作为检验统计量 → 通过置换进行显著性检验

  - 标准化每个细胞的表达值：基于负二项（NBDisp）或伯努利零模型估计 E[xi] 和 E[xi^2] → 计算局部自相关统计量 H=Σ_(i,j)∈E wij
  xi xj → 计算 E[H]、E[H^2]、var(H) 和 Z 分数 → 与正态分布比较得到 p 值 → Benjamini-Hochberg 校正 FDR

  - Hotspot 基因模块构建：寻找高局部自相关的 informative genes → 评估基因间局部相关 local correlation → 对基因-基因亲和矩阵进行改进层次聚类

  - 基因预过滤：去除少于50个细胞中检测到的基因 → Hotspot特征选择：邻域大小300，bernoulli模型建模基因检测概率 → 成对相关与模块识别：FDR<0.05，邻域大小降至30以识别更细空间模块
  → spatialDE分析：预过滤少于50个细胞，最小length scale=50，模块length scale=350，10个components → 使用DropViz标记基因列表评估特征选择
  → 使用IDR评估样本对间基因排序可重复性

  - 小鼠胚胎发生谱系追踪数据：下载GEO GSE117542 Embryo 3 → Cassiopeia-Greedy推断发育谱系 → Hotspot tree
  metric：基于推断谱系的30个最近邻构建KNN图；Hotspot transcription metric：对log2(x+1) counts-per-10,000进行PCA，基于30个最近邻构建KNN图

  - 下载10x Genomics 5k_pbmc_protein_v3的DGE → 基于表面蛋白丰度过滤PBMC提取CD4+ T细胞和CD14+单核细胞 → 丢弃UMI<3000或线粒体基因比例>16%的细胞
  → 蛋白丰度log(x+1)转换并按细胞均值中心化 → 手动阈值选择CD4+ T细胞(CD4>3, CD3>2.5, CD14<2)和CD14+单核细胞(CD14>2)

  - HVG：counts以scale factor 10,000进行log-normalization → Seurat FindVariableGenes(x.low.cutoff=.01,
  x.high.cutoff=3.04, y.cutoff=.5) → 按gene.dispersion.scaled降序排序

  - NBDisp：M3Drop NBumiFitModel默认设置处理raw gene counts → 使用20 counts/10,000高表达截断 → 按q.value升序排序

  - PCA：对log-transformed、scaled counts/10,000运行5个主成分 → 基因得分=前5主成分系数绝对值之和 → 按得分降序排序

  - GR评分：下载MSigDB c7免疫签名集 → 筛选CD4相关基因集(含Th1/Th2/Tfh/Treg/Tconv/T/Th17/Tcell/NKTcell/CD4/Thymocyte且不含DC/PDC/Macrophage/BMDM/Monocyte/Neutrophil/Mast/B/BCell/NKCell/NK)
  → 基因GR=出现于CD4相关基因集的数目 → 基因集GR=集合内平均GR

  - 蛋白局部自相关评估：raw counts子集到待评估基因 → scVI运行10个latent components → Hotspot评估表面蛋白局部自相关
  → 与简单阈值选择基因(至少在10个细胞表达)的第五次运行比较蛋白Z-score

  - Hotspot蛋白建模与基因选择：蛋白丰度使用depth-adjusted normal model，先log转换，再线性回归去除每细胞总蛋白计数，按蛋白标准化；选基因时先用PCA
  20 components构建细胞相似潜在空间；所有过程取top1000报告基因；过滤CD4 T细胞中不表达的表面蛋白(95百分位<100 counts/10,000)

  - CD4 T细胞模块识别：对top1000高变基因运行scVI 10 components → 以该潜在空间输入Hotspot → 基于局部自相关从top500基因创建模块(fdr_threshold=0.05,
  min_cluster_genes=15)

  - UMAP投影：先运行PCA(top 20 components) → 再在转换空间运行UMAP(n_neighbors=30)

  - Hotspot模块评估：使用Chan et al. (2019)数据，从NCBI GEO GSE122187下载Cell State Kernels → 对每个Hotspot模块，取712
  kernel genes与模块基因交集 → 跨细胞类型标准化后绘制kernel值

  - 模拟数据评估：使用SymSim三参数转录动力学模型生成模拟单细胞图谱，评估Hotspot在仅转录组数据中的性能

  - SymSim: phylogenetic tree Newick 输入 → 生成 EVF → 动力学参数(on-rate/off-rate/synthesis
  rate)分布匹配参考单细胞数据集 → Master Equation 采样稳态 mRNA 计数 → 下采样模拟 mRNA capture → 模拟 PCR 扩增与
  variable reads/cell → 生成 synthetic full 和 observed transcriptomes

  - 特征选择评估: 模拟数据中 EVF 耦合基因作为阳性集 → 运行 Seurat FindVariableGenes、NBDisp、PCA、Hotspot →
  评估特征选择与 gene-to-EVF 真实模块

  - 局部相关性与 Pearson 相关性比较: SymSim full profiles 作为 true correlations → observed profiles
  计算 Pearson/local correlation → 将 pairwise gene correlation 展开为向量 → Spearman correlation
  比较；10x PBMC 分半 → 参考半 Pearson 与 held-out half local/Pearson 比较 → UMI 下采样重复

  - 基因计数矩阵输入 → NBDisp特征选择（NBumiFitModel → NBumiFeatureSelectionCombinedDrop method=''fdr''，按q.value升序）
  → PCA特征选择（irlbaPcaFS，前5个主成分载荷绝对值之和排序） → 备选模块识别（WGCNA、Grnboost2、ICA、Pearsons） → 与Hotspot比较（真实转录谱用高变基因过滤后的同一输入基因；模拟谱用偶联到EVF的基因；PBMC数据按细胞对半分评估模块可重复性）
  → K近邻参数敏感性分析


