  ## 关键参数

  - Hotspot.K = 约30（可配置）（构建K最近邻相似图，每个细胞连接至K个最相似细胞）

  - Hotspot.权重归一化 = 每个细胞的权重总和为1（相似图中K近邻权重计算）

  - Hotspot.零模型 = 负二项（均值依赖文库大小）或 Bernoulli（极稀疏数据）（基因表达零分布，用于标准化和计算Z分数）

  - Hotspot.Z分数阈值 = 输入阈值（未给出具体数值）（UPGMA模块合并停止条件）

  - Hotspot.模块基因数上限 = 可配置（未给出具体数值）（超过一定基因数的模块保持不合并）

  - SymSim.cells = 3000（模拟数据集）

  - SymSim.subpopulations = 5（模拟层次树中的细胞亚群数）

  - SymSim.biologically_varying_genes = 500（与 EVF 耦合的基因，构成基因模块）

  - SymSim.EVFs = 5（模拟协调生物变异的 extrinsic variation factors）

  - SymSim.negative_control_genes = 4500（独立变异基因，作为阴性对照）

  - Hotspot.null_model = negative binomial distribution（定义 Hx 和 Hxy 统计量的零模型）

  - Hotspot.distance_metric = Euclidean distance in scVI latent space（构建最近邻图）

