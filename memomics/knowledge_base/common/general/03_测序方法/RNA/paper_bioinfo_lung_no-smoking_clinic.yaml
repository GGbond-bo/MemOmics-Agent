  ## 关键参数

  - WES.read depth = tumor ~300X; NAT ~100X（variant discovery）

  - bulk RNA-seq.read depth = approximately 120 M reads per sample（deep coverage）

  - transcriptomic analysis.transcript filtering = 60,688 transcripts acquired; 20,088
  selected（low-count genes across samples）

  - proteomics/phosphoproteomics/acetylproteomics.quantification threshold = observed
  in at least 30% of samples（protein, phosphosite, and acetylation site quantification）

  - TMT proteomics.normalization = log2 ratio to common reference（protein/phosphosite/acetylation
  quantification）

  - TMB.score = 2.7（229 tumors）

  - NMF.number of subtypes = 5（multiomics clustering）

  - Fisher''s exact test.odds ratio and P value = CDKN2A loss OR 3.63, P = 2.35 ×
  10−2; lower TP53 mutation OR 0.04, P = 3.1 × 10−9（mutation enrichment comparisons）

  - Wilcoxon rank-sum test.P value = Subtype 2 TMB = 0.9 vs others = 3.2, P = 3.6
  × 10−10; pathway adjusted P values reported（clinical and molecular comparisons）

  - NMF.number of clusters = 5（识别多组学亚型）

  - Fisher''s exact test.P value = <0.05 (two-sided)（临床变量富集显著性）

  - GSVA/PTM-SEA.FDR = <0.05 (permutation)（通路富集显著性）

  - GSVA/PTM-SEA.enrichment score = positive z-score（展示显著正富集通路）

  - Copy number analysis.copy number loss = absolute copy number <0.5（定义为纯合缺失）

  - permutation.FDR = <0.001（DEG sets of all five subtypes significantly upregulated
  in tumor cell types）

  - permutation.FDR = <0.01（DEGsubtype enrichment for cell types in Subtypes 1 and
  3）

  - Fisher''s exact test.OR = 8.4（Association between Subtype 3 and CN14 signature）

  - Fisher''s exact test.OR = 16.4（Co-occurrence of SOX2 amplification and TP53 mutations
  in Subtype 3 vs other subtypes）

  - Wilcoxon rank-sum test.P = 5.7 × 10−11（Greater TMB in Subtype 3 in Korean NSCLC
  cohort）

  - Wilcoxon rank-sum test.P = 6.9 × 10−6（Greater TMB in Subtype 3 in previous studies）

  - log-rank test.P = 8.4 × 10−3（Poorer survival of Subtype 4 vs other subtypes in
  Korean NSCLC cohort）

  - log-rank test.P = 9.5 × 10−1（No survival variation between Subtype 4 patients
  with and without metastasis）

  - log-rank test.P = 2.6 × 10−2（Survival disadvantage for non-metastatic Subtype
  4 patients）

  - log-rank test.P = 7.9 × 10−1（No significant overall survival difference between
  Subtype 4 and other subtypes in combined CPTAC cohort）

  - GSEA.gene set = MSigDB hallmark v7.4（protein-level GSEA in Subtype 3）

  - kinase activity estimation.FDR threshold = <0.05（significantly up- and downregulated
  kinases）

  - DE/GSEA analysis.FDR threshold = <0.1（DNA repair/autophagy-related kinases upregulated;
  phosphoproteome features displayed）

  - immune DEG enrichment.top DEGs = 300（HTE and CTE clusters）

  - copy number signature overlap.test = one-sided Fisher''s exact test（odds ratio
  for copy number signatures）

  - co-mutation analysis.test = one-sided Fisher''s exact test（enriched co-mutations
  in each subtype）

  - linear regressions.FDR threshold = <0.1（top CNVs in Subtype 3）

  - XPO1 expression comparison.test = Kruskal-Wallis test（Subtype 3 vs other subtypes）

  - drug response assay.replicates = 3 technical replicates（each organoid sample）

  - cryptic MAP confirmation.expression threshold = previously determined expression
  threshold（identification of confirmed cryptic MAPs）

  - marker gene definition.top overexpressed genes = top 300 for HTE and top 30 for
  highly cell type-enriched samples（marker genes for HTE and 10 cell types）

  - survival analysis.log-rank Mantel-Cox test = n = 174（overall survival and relapse-free
  survival related to cell types）

  - linear regression.covariates = sample batches and histological diagnosis（Correlation
  between cryptic MAP number and enrichment scores of 10 cell types/immune cluster.）

  - log-rank Mantel-Cox test.p-value = 0.017（Overall survival of patients with versus
  without recurrent cryptic MAPs (n = 204).）

  - log-rank Mantel-Cox test.p-value = 0.021（Overall survival of four groups stratified
  by cryptic MAP load and immune cluster (Red versus Purple).）

  - log-rank Mantel-Cox test.p-value = 0.0016（Recurrence-free survival of Subtype
  5 by CTx or CRTx treatment status.）

  - two-sided Fisher''s exact test.adjustment = Benjamini-Hochberg（Enrichment analysis
  of multiomics subtypes across four groups.）

  - Kaplan-Meier.n = 204（Survival analysis by recurrent cryptic MAP status.）

  - Kaplan-Meier.n = 174（Survival analysis by cryptic MAP load and immune cluster.）

  - BWA.algorithm = BWA-MEM（Alignment of Illumina sequences 70 bp to 1 mbp）

  - GATK4 HaplotypeCaller.-ERC = GVCF（Reference confidence scores in GVCF mode）

  - GATK4 HaplotypeCaller.-G = StandardAnnotation（Variant annotation）

  - GATK4 HaplotypeCaller.-G = AS_StandardAnnotation（Variant annotation）

  - GATK4 Mutect2.mode = tumor with paired normal; tumor-only for one sample without
  matching normal（Exclude germline variants）

  - GATK4 Mutect2.panel-of-normals = somatic-hg38_1000g_pon.hg38.vcf.gz（Somatic variant
  calling）

  - GATK4 Mutect2.germline resource = somatic-hg38_af-only-gnomad.hg38.vcf.gz（Germline
  variant removal）

  - GATK4 GetPileupSummaries.common somatic mutation sites VCF = somatic-hg38_small_exac_common_3.hg38.vcf.gz（Contamination
  estimation）

  - GATK4 Funcotator.transcript-selection-mode = CANONICAL（Annotation with custom
  transcript list）

  - GATK4 Funcotator.dataSources = funcotator_dataSources.v1.7.20200521s for somatic;
  funcotator_dataSources.v1.7.20200521g for germline（Annotation）

  - CNVkit.amplification threshold = absolute copy number >=4（CNV labeling）

  - CNVkit.gain threshold = absolute copy number >=2.5 and <4（CNV labeling）

  - CNVkit.loss threshold = absolute copy number 0.5–1.5（CNV labeling; fragment truncated）

  - centrifuge.speed/temperature/time = 14,500 g / 4 °C / 5 min（protein lysate centrifugation）

  - reduction.DTT concentration/temperature/time = 20 mM / 95 °C / 10 min（protein
  lysate reduction）

  - alkylation.iodoacetamide concentration/temperature/time = 40 mM / RT / 30 min
  dark（protein lysate alkylation）

  - S-Trap digestion.trypsin/Lys-C ratio/temperature/time = 1:25 w/w / 37 °C / 6 h（tryptic
  digestion）

  - TMTpro labeling.peptide amount/reagent amount/incubation = 250 μg peptide / 1
  mg reagent / 1 h shaking（16-plex labeling）

  - mid-pH RP fractionation.flow rate = 0.5 mL/min（peptide fractionation）

  - mid-pH RP fractionation.mobile phase B gradient = 5% in 8 min, 40% in 65 min,
  44% in 69 min, 60% 74–88 min, 5% in 90 min（peptide fractionation）

  - mid-pH RP fractionation.fraction collection/pooling = 96 fractions pooled into
  24 non-consecutive fractions; 12 fractions for PTM（sample complexity reduction）

  - IMAC.Ni-NTA slurry volume = 300 μL（phosphopeptide enrichment）

  - IMAC.EDTA incubation = 100 mM / 30 min RT（Ni-NTA bead preparation）

  - IMAC.FeCl3 incubation = 10 mM / 30 min RT（Fe3+ charging）

  - IMAC.phosphopeptide binding = 30 min RT gentle mixing（phosphopeptide enrichment）

  - acetylpeptide enrichment.antibody incubation = 4 °C / 3 h end-over-end turning（Ac-K
  motif enrichment）

  - acetylpeptide enrichment.elution = 0.15% TFA / RT / 10 min（acetyl peptide elution）

  - LC-MS/MS.flow rate = 0.3 μL/min（nano-LC separation）

  - LC-MS/MS.solvent B gradient = 2% in 12 min, 8% in 16 min, 25% in 140 min, 35%
  in 150 min, 85% 155–163 min, 2% 165–185 min（nano-LC separation）

  - LC-MS/MS.spray voltage = 1.5 kV（data-dependent acquisition）

  - LC-MS/MS.MS1 resolution/mass range = 120,000 / 350–1500 m/z（MS1 spectra）

  - LC-MS/MS.AGC target/max injection time/isolation window = 3e6 / 50 ms / 0.7 m/z（MS1/MS2
  acquisition）

  - LC-MS/MS.Top N precursors = Top 15（MS/MS triggering）

  - 肽段鉴定.动态修饰 = oxidation +15.995 Da on Met（肽段搜索）

  - 肽段鉴定.动态修饰 = deamidation +0.984 Da on Asn/Gln（肽段搜索）

  - 肽段鉴定.minimum peptide length = 8 residues（肽段搜索）

  - Percolator.FDR = 1%（PSM验证）

  - BLAST.allowed amino acid substitution = ≤1（novel peptide过滤）

  - Proteome Discoverer v2.4/SequestHT.co-isolation threshold = 50%（TMT定量低质量值过滤）

  - Proteome Discoverer v2.4/SequestHT.average reporter S/N threshold = 10%（TMT定量低质量值过滤）

  - 缺失值过滤.missing values = <30%（global/phospho/acetyl proteomics across tumors）

  - impute R package.k = 5（KNN插补）

  - NMF.factorization ranks = 2-10（选择最佳聚类数k）

  - NMF.max iterations = 2000（秩选择的收敛）

  - NMF.repeats = 50（计算聚类统计）

  - NMF.robust runs = 200（最佳k下的稳健聚类）

  - NMF.max iterations = 5000（最佳k下的稳健聚类）

  - NMF.core sample membership score = ≥0.5（定义core sample）

  - NMF combined.rank = 5（整合本队列与CPTAC LUAD/LSCC）

  - NMF combined.runs = 200（联合NMF稳健聚类）

  - NMF combined.max iterations = 5000（联合NMF稳健聚类）

  - NMF validation Gillette study.ranks/runs/max iterations = 4/200/5000（既往研究亚型特征重聚类）

