  - non-negative matrix factorization (NMF) （）：clustering to identify multiomics subtypes

  - NMF （R）：多组学亚型聚类

  - GSVA （R）：通路富集分析

  - PTM-SEA （）：PTM 富集分析

  - PHONEMeS （）：Kinase-substrate network database used for kinase activity score estimation

  - bcl2fastq （）：Convert Illumina BCL binary files to Fastq

