  ## 关键参数

  - WES.read depth = 肿瘤~300X，NAT~100X（变异发现）

  - bulk RNA-seq.read depth = 约120 M reads/样本（深度覆盖，基因表达定量和可变剪接异构体发现）

  - 蛋白质组/磷酸化蛋白质组/乙酰化蛋白质组.检测阈值 = 至少在30%样本中观察到（保留并定量蛋白、磷酸化位点、乙酰化位点）

  - 转录组.转录本选择 = 从60,688个转录本中保留20,088个（过滤低计数基因后进行后续分析）

  - 特征过滤.missing values = <30%（在229个样本中保留缺失率<30%的特征）

  - 临床变量富集.P值 = <0.05（双侧Fisher精确检验）

  - GSVA/PTM-SEA.FDR = <0.05（置换检验，正富集z-score）

  - NMF.聚类数 = 5（鉴定五个多组学亚型）

  - Fisher exact test.adjustment = Benjamini-Hochberg（亚型重叠显著性调整，adjusted P ≤0.05）

  - Survival analysis.test = log-rank（生存曲线P值）

  - Expression comparison.test = Wilcoxon rank-sum（Subtype 4与其他亚型标志物表达差异）

