content: '## 测序方法

  - whole-exome sequencing (WES) | 平台 — | 建库 — | 深度 肿瘤~300X，NAT~100X

  - bulk RNA-seq | 平台 — | 建库 — | 深度 约120 M reads/样本

  - single-cell RNA sequencing (scRNA-seq) | 平台 — | 建库 — | 深度 —

  - scRNA-seq (integrated single-cell RNA sequencing dataset) | 平台 — | 建库 — | 深度 —

  - single-cell（未指定技术） | 平台 — | 建库 — | 深度 —

  - Whole exome sequencing (WES) | 平台 Illumina NovaSeq | 建库 SureSelect V6-Post (Agilent,
  CA, USA) | 深度 肿瘤文库平均300x；NAT和blood buffy coat文库平均100x

  - RNA-Seq | 平台 — | 建库 — | 深度 —

  - RNA-seq（Salmon 转录本定量） | 平台 — | 建库 — | 深度 —


  ## 分析流程

  - WES/RNA-seq/蛋白质组/磷酸化蛋白质组/乙酰化蛋白质组数据生成 → 转录本过滤(60,688→20,088) → 蛋白质组/磷酸化/乙酰化整合 →
  非负矩阵分解(NMF)聚类 → 鉴定5个多组学亚型

  - 临床/组织学/TNM/生存/治疗反应注释与亚型特征关联分析

  - 整合单细胞RNA-seq数据集评估亚型细胞特异性与组织病理学相关性

  - 临床信息整理（组织学、TNM分期、病理N、复发、辅助治疗）

  - 全局蛋白质组/磷酸化蛋白质组/乙酰化蛋白质组定量

  - 缺失值过滤：保留在229个样本中缺失<30%的特征

  - NMF聚类鉴定5个多组学亚型

  - 临床变量富集分析（Fisher精确检验，P<0.05）

  - GSVA和PTM-SEA通路富集分析（FDR<0.05，permutation）

  - CPTAC NSCLC多组学数据 → 联合NMF亚型聚类

  - 亚型特征与既往NSCLC多组学亚型进行Fisher精确检验重叠分析

  - 磷酸化蛋白组数据 + 激酶-底物网络数据库(PHONEMeS) → 激酶活性评分

  - Subtype 4 vs 其他亚型差异表达/磷酸化分析

  - Wilcoxon rank-sum检验比较标志物表达

  - log-rank检验进行癌症特异性总生存分析

  - 各亚型 vs NAT的差异表达基因（DEG）计算 → 各亚型 vs 其他亚型的DEG（DEGsubtype）比较 → 与细胞类型特异性基因进行置换富集分析
  → 与组织病理学特征相关分析 → 拷贝数签名/WGD分析 → TMB比较 → 蛋白质/PTM/激酶通路分析

  - UMAP 展示 Subtypes 1–5 特异性细胞类型 → 使用 DEGsubtype 计算模块评分 → 组织学与临床特征比较 → 联合 NMF 分析 →
  WGD 相关 CN15/CN16 信号富集分析 → 激酶/突变/拷贝数分析

  - 基因表达/蛋白活性与细胞类型或免疫簇富集评分进行回归分析

  - 免疫调节因子与HTE肿瘤及免疫细胞的相关性分析

  - 免疫调节因子与TILs的相关性分析

  - 在本队列及CPTAC、Satpathy、Gillette等外部肺癌多组学队列中比较相关性方向

  - 免疫簇/细胞类型与总生存/无复发生存的HR分析

  - cryptic MAP负荷/免疫簇/APM/TIL分组 → 多组学亚型富集分析（Fisher精确检验，Benjamini-Hochberg校正） → Kaplan-Meier生存分析（log-rank
  Mantel-Cox检验） → 相关性分析（线性回归，协变量为样本批次和组织学诊断） → 单细胞和组织病理TIL分析

  - FFPE肿瘤和正常样本(NAT或血沉棕黄层)提取基因组DNA → SureSelect V6-Post构建WES文库 → Illumina NovaSeq测序
  → bcl2fastq转换BCL为Fastq

  - FastQC (v0.11.9) 质控/检查adaptor和overrepresented sequence → BWA-MEM (v0.7.17) 比对到GENCODE
  GRCh38.p13 v32 primary assembly → Picard SortSam坐标排序和MarkDuplicates (v2.23.1) 标记重复

  - GATK4 BQSR (v4.1.8.0) 使用dbSNP、Mills和1000G已知变异进行碱基质量重校准

  - GATK4 Mutect2 (v4.1.8.0) 体细胞变异检测：肿瘤-配对正常模式，一个无配对正常样本用tumor-only模式；panel-of-normals
  somatic-hg38_1000g_pon.hg38.vcf.gz；germline去除 somatic-hg38_af-only-gnomad.hg38.vcf.gz

  - GATK4 GetPileupSummaries计算read支持参考 → GATK4 CalculateContamination计算交叉样本污染 → GATK4
  FilterMutectCalls过滤 → GATK4 funcotator (v4.2.0.0) 注释 → maftools (v2.8.0570) 合并MAF

  - GATK4 HaplotypeCaller (v4.1.8.0) 胚系变异检测 (-ERC GVCF, -G StandardAnnotation, -G
  AS_StandardAnnotation) → GenomicsDBImport → GenotypeGVCFs联合基因分型 → VariantRecalibrator/ApplyVQSR对SNP和indel进行VQSR
  → funcotator注释

  - CNVkit (v0.9.871) 检测DNA体细胞拷贝数变异；绝对拷贝数≥4为amplification，≥2.5且<4为gain，0.5-1.5为原文截断的拷贝数状态标注

  - 蛋白裂解液离心（14,500 g, 4 °C, 5 min）→ BCA法测蛋白浓度

  - DTT还原（95 °C, 10 min, 20 mM）→ 碘乙酰胺烷基化（40 mM, 室温暗处30 min）

  - 加入12%磷酸和S-trap结合缓冲液形成胶体→上S-Trap柱离心捕获→洗涤→Trypsin/Lys-C消化（37 °C, 6 h）

  - 依次用消化缓冲液、0.2%甲酸、0.2%甲酸/50%乙腈离心洗脱肽段→C18脱盐干燥→NanoDrop A205测肽浓度

  - 构建common reference pool：从各样本取10 μg混合，用于每个TMT batch的134N通道

  - TMTpro 16-plex标记：每样本250 μg肽，1 mg试剂，孵育1 h，取1.8 μg标记肽LC-MS/MS确认标记效率≥95%，羟胺淬灭，合并脱盐

  - Mid-pH RP fractionation：Shimadzu LC20A，XBridge BEH C18，流速0.5 mL/min，梯度洗脱，收集96个fraction并合并为24个非连续fraction；取95%合并为12个非连续fraction用于PTM分析

  - 磷酸肽富集：IMAC，Ni-NTA琼脂糖，EDTA剥离，FeCl3加载，肽段结合30 min，上清用于后续乙酰肽富集，磷酸肽洗脱脱盐

  - 乙酰赖氨酸肽富集：PTMScan Ac-K kit，IMAC洗脱物合并为4个fraction，IAP缓冲液溶解，乙酰赖氨酸抗体孵育4 °C 3 h，洗涤，0.15%
  TFA洗脱，C18脱盐

  - LC-MS/MS：Ultimate 3000 RSLC nano + Q Exactive HF-X，数据依赖采集，MS1 120,000分辨率，350–1500
  m/z，AGC 3e6，Top15 MS2，用于全局蛋白质组和PTM分析

  - 多阶段蛋白质组数据库搜索：1) 主数据库搜索鉴定 canonical peptides；2) 使用 CustomProDB 生成突变蛋白序列并结合 Unimod
  2355 种修饰鉴定 variant/modified peptides；3) 从上一阶段未鉴定谱图中鉴定 novel peptides（假基因/lncRNA/UTR/新异构体/融合基因）→
  每个阶段独立用 target-decoy 计算 FDR，仅保留 1% FDR 鉴定结果 → 上一阶段未鉴定谱图进入下一阶段

  - PSM重打分与验证：MS-GF+/Comet搜库 → Percolator重打分 → 1% FDR验证 → 剔除冲突PSM → BLAST比对（Uniprot/RefSeq/Gencode，允许≤1个氨基酸替换）
  → 去除移码肽 → 要求≥1条RNA-Seq read和可定量PSM → 获得1045条新序列

  - 蛋白定量：Proteome Discoverer v2.4/SequestHT搜库（UniProt human v2021.01+179污染物） → 过滤共隔离50%、reporter
  S/N 10% → 批次内按common reference归一化 → log2 ratio

  - 修饰位点定量：汇总修饰位点对应肽丰度 → 同全局蛋白TMT归一化 → 两组分归一化 → log2 ratio

  - 缺失值处理：保留所有肿瘤中缺失<30%的特征 → 使用impute R包KNN填补（k=5）

  - NMF分型：拼接全局蛋白、磷酸化蛋白、乙酰化蛋白矩阵 → 剔除标准差最低5%特征 → scale/z-score → NMF rank 2-10，Brunet算法，2000
  max iterations，重复50次 → 根据cophenetic correlation coefficient选最佳k → 200 runs、5000
  max iterations稳健聚类 → 样本分配，cluster membership ≥0.5为核心样本

  - 联合NMF与既往NSCLC比较：整合本研究与CPTAC LUAD/LSCC队列 → 取共同特征 → NMF rank 5、200 runs、5000 max
  iterations → 比较各研究亚型

  - 既往研究分型稳健性比较：按各研究参数重新聚类（Gillette: 4 ranks/200 runs/5000 iterations；Satpathy: 5
  ranks/500 runs/5000 iterations；Lehtio: 6 ranks/100 runs/5000 iterations；Xu 2020使用上调蛋白列表）
  → Fisher exact检验OR/p

  - 富集分析：磷酸化蛋白用PTM-SEA，全局/磷酸化/乙酰化蛋白用GSVA；使用MSigDB hallmark/KEGG/Reactome/WikiPathways/GO中200-1000个基因的通路；PTM-SEA使用±7
  aa flanking序列、NES、nperm=100

  - 选择 MSigDB Hallmark 通路基因集和 PTMsigDB 修饰位点特征 → ssGSEA/PTM signature 分析识别 NMF 亚型特征通路

  - CNVkit 基因级拷贝数 → 计算 cytoband 均值 → 线性回归（Subtype + DX）→ BH 校正 → adj p<0.05 显著 CNV

  - Salmon 转录本定量 → tximport 转为基因级表达矩阵 → DESeqDataSetFromTximport → DESeq2 负二项模型（Group
  + DX + rna:batch）→ BH 校正 → adj p<0.05 显著 DEG

  - 蛋白/磷酸化/乙酰化特征 → 线性回归（Group + DX + Batch）→ BH 校正 → adj p<0.05 显著 DEP

  - 229 例 NSCLC OS 数据 → Kaplan-Meier 生存曲线 → log-rank 比较五个 NMF 亚型 → BH 校正两两比较；feature-wise
  top50% vs bottom50% → CPH 判定预后方向，log-rank nominal p<0.001

  - 磷酸化蛋白质组数据 → DEPP分析 → 使用PHONEMeS先验网络与decoupleR run_mlm推断激酶活性 → BH校正

  - 单细胞数据集local_extended.rds → 基于DEGs生成subtype-specific基因集 → 与tumor_primary（及NAT比较时normal_adjacent）细胞类型特异性基因比较

  - NSCLC转录组 → Xcell推断64种细胞类型富集分数 → z-score标准化 → CancerSubtypes共识聚类 → PAM三聚类 → 按NAT匹配和Xcell免疫分数划分HTE/CTE

  - NSCLC肿瘤转录组 → GSVA七条免疫相关通路 → z-score标准化 → k-means二聚类 → 高通路富集为HTE

  - 细胞类型富集/免疫簇状态 → MASS/GLM回归分析TILs；CoxPHFitter Cox回归分析OS/RFS，校正临床组织学和样本批次

  - 患者转录组 → ARACNe肺癌regulon网络 → viper推断蛋白活性 → 与免疫调节因子、细胞富集/免疫簇相关性分析；整合驱动突变数据库

  - Satpathy/Gillette/本队列 → 64种细胞类型富集分数z-score → 整合 → 共识聚类 → PAM三聚类映射NAT/HTE/CTE

  - 突变肽（9-12mer）→ OptiType鉴定HLA → MHCflurry/NetMHCpan预测结合 → MS确认为confirmed neoantigen；非经典肽来自假基因/lncRNA/UTR/新异构体
  → 肿瘤表达过滤（FPKM<1为不表达）→ 出现于>2肿瘤且未在至少1正常样本中预测为cryptic peptide


