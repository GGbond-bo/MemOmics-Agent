  - SequestHT （）：蛋白数据库搜索

  - Percolator （）：PSM重打分

  - MS-GF+ （）：PSM冲突检测

  - Comet （）：PSM冲突检测

  - BLAST （）：novel peptide序列比对过滤

  - impute R package （R）：KNN缺失值插补

  - NMF R-package （R）：多组学NMF聚类分析

  - GSVA （R）：global/phospho/acetyl蛋白质组通路富集

  - PTM-SEA （R）：磷酸化蛋白质组PTM特征富集

  - ssGSEA2.0 （R）：通过ssgsea-cli.R运行PTM-SEA

  - Salmon （）：transcript-level quantification

  - tximport （R）：import Salmon transcript-level estimates and convert to gene-level
