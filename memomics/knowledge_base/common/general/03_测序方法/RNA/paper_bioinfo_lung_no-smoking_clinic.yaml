  - Xcell （R）：Gene set enrichment analysis to infer enrichment scores of 64 cell types

  - CancerSubtypes （R）：Consensus clustering

  - MASS （R）：Regression analysis for TIL patterns

  - GLM （R）：Regression analysis for TIL patterns

  - CoxPHFitter （Python）：Cox proportional hazards regression for overall survival
  and relapse-free survival

  - ARACNe （R）：Obtain regulon networks of lung cancer

  - viper （R）：Calculate protein activity from regulon networks

  - GSVA （R）：Pathway enrichment scoring for immune-related pathways

  - MHCflurry （）：Predict binding affinity of mutated peptides to patient HLAs

  - NetMHCpan （）：Predict binding affinity of mutated peptides to patient HLAs

  - OptiType （）：Identify patient HLAs

  - GraphPad Prism （）：determination of IC50 values

  - BLAST （）：Basic local alignment search tool

  - NMF （R）：Nonnegative matrix factorization

  - Non-smooth Non-negative Matrix Factorization （）：Biclustering of gene expression
