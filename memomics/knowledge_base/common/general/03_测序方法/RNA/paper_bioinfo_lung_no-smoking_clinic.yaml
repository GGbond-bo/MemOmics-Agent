  - GATK4 HaplotypeCaller v4.1.8.0（Java）：Germline variant calling

  - GATK4 GenomicsDBImport v4.1.8.0（Java）：Import single-sample GVCFs into GenomicsDB

  - GATK4 GenotypeGVCFs v4.1.8.0（Java）：Joint genotyping

  - GATK4 VariantRecalibrator v4.1.8.0（Java）：VQSR recalibration

  - GATK4 ApplyVQSR v4.1.8.0（Java）：Apply VQSR

  - CNVkit v0.9.8（Python）：Somatic copy number variation detection

