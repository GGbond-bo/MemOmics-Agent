  check

  - BWA v0.7.17（C）：Alignment to reference genome using BWA-MEM

  - Picard SortSam/MarkDuplicates v2.23.1（Java）：Coordinate sorting and duplicate marking

  - GATK4 BQSR v4.1.8.0（Java）：Base quality score recalibration

  - GATK4 Mutect2 v4.1.8.0（Java）：Somatic variant calling

  - GATK4 GetPileupSummaries v4.1.8.0（Java）：Read support reference for contamination
