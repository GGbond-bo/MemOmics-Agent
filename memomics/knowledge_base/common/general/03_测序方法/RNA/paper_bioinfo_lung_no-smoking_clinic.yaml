content: '## 测序方法

  - whole-exome sequencing (WES) | 平台 — | 建库 — | 深度 228 NAT-matched tumors and 1 tumor-only
  sample; tumor ~300X, NAT ~100X; sufficient for variant discovery

  - bulk RNA-seq | 平台 — | 建库 — | 深度 205 tumors and 85 matched NATs; approximately
  120 M reads per sample

  - tandem mass tag (TMT)-based isobaric labeling proteomics | 平台 — | 建库 — | 深度 229
  tumor samples and 26 matched NATs; 10,788 proteins

  - phosphoproteomics | 平台 — | 建库 — | 深度 40,738 phosphosites observed in at least
  30% of samples

  - acetylproteomics | 平台 — | 建库 — | 深度 5,975 acetylation sites observed in at least
  30% of samples

  - single-cell RNA sequencing (scRNA-seq) | 平台 — | 建库 — | 深度 large-scale NSCLC dataset;
  details not provided in fragment

  - scRNA-seq | 平台 — | 建库 — | 深度 —

  - WES | 平台 — | 建库 — | 深度 —

  - single-cell | 平台 — | 建库 — | 深度 —

  - exome sequencing | 平台 — | 建库 — | 深度 —

  - Whole exome sequencing (WES) | 平台 Illumina NovaSeq | 建库 SureSelect V6-Post (Agilent,
  CA, USA) | 深度 average 300x per tumor library; 100x per NAT and blood buffy coat
  library

  - RNA-Seq | 平台 — | 建库 — | 深度 ≥1 RNA-Seq read（用于支持novel peptide筛选）

  - RNA-seq | 平台 — | 建库 — | 深度 —


  ## 分析流程

  - WES → somatic small mutation detection → copy-number alteration detection → TMB
  calculation

  - bulk RNA-seq → gene expression quantification → alternative splicing isoform discovery
  → transcript filtering (60,688 to 20,088 transcripts)

  - TMT proteomics/phosphoproteomics/acetylproteomics → log2 ratio quantification
  to common reference

  - proteomic/phosphoproteomic/acetylproteomic integration → non-negative matrix factorization
  clustering → five multiomics subtypes

  - multiomics subtype characterization by genetic mutations, clinical phenotypes,
  and molecular pathways

  - single-cell RNA-seq integration → cellular specificity and histopathological relevance
  assessment

  - histological review for tumor-infiltrating lymphocytes → neoantigen and cryptic
  peptide identification → adjuvant therapy efficacy assessment

  - Global/phospho/acetylproteomic quantification → 过滤 <30% 缺失特征 (229 样本) → NMF 聚类
  → 临床变量富集 (Fisher 精确检验) → GSVA/PTM-SEA 通路富集

  - NMF clustering of proteome, phosphoproteome, and acetylome datasets to identify
  NSCLC subtypes

  - Feature overlap analysis between NMF subtypes and previous NSCLC studies using
  Fisher’s exact test

  - Combined NMF analysis integrating 447 patients from our and previous studies

  - Comparison with and without Korean cohort to assess subtype classification stability

  - Extraction of distinct NMF features (proteins, phosphorylation, acetylation) for
  Subtype 4

  - Kinase activity analysis using phosphoproteomic data

  - Correlation analysis between kinase activity and expression levels

  - Survival analysis based on feature expression using log-rank test

  - ROC curve analysis to evaluate SLK (S347) as a Subtype 4 marker

  - Combined NMF subtyping

  - Phosphoproteomic kinase activity estimation using PHONEMeS

  - Differential expression analysis between Subtype 4 and other subtypes

  - Survival analysis using log-rank tests

  - Subtype overlap analysis using Fisher''s exact test

  - DEGs for each subtype compared to NAT samples

  - DEGsubtype analysis (each subtype vs other subtypes)

  - Permutation-based enrichment of DEG/DEGsubtype sets against cell type-specific
  genes from integrated scRNA-seq dataset

  - Correlation of DEGsubtype findings with histopathological features

  - Multiomics/NMF analysis integrating CPTAC LUAD and LSCC datasets to identify Subtype
  3

  - Copy-number signature analysis and WGD assessment

  - TMB comparison between Subtype 3 and other subtypes

  - Protein, PTM, and kinase pathway analysis

  - copy number signature overlap → CNV enrichment → co-mutation analysis → protein-level
  GSEA → kinase activity estimation → drug response/IC50 in organoids

  - cell type- and pathway-based clustering → immune cluster identification (HTE,
  CTE, NAT-enriched) → scRNA-seq validation using top-300 DEGs → survival analysis
  → pathway enrichment analysis comparing HTE and CTE

  - Regression analysis of gene expression or protein activity and enrichment scores
  for cell type or immune clusters → correlation with HTE tumors, immune cells, epithelial
  cells, and TILs → cross-cohort validation in this cohort and other lung cancer multiomics
  studies

  - Immune subtyping based on cell type and pathway enrichment scores → cell type-based
  clustering with tumor and NAT samples and pathway-based clustering with tumor samples

  - WES-derived somatic mutations in coding regions → neoantigen prediction → MS confirmation
  of confirmed neoantigen candidates

  - Identification of peptides from non-coding and non-annotated transcripts → selection
  of cryptic MHC class I-associated peptides (MAPs) → confirmation of cryptic MAPs
  based on expression threshold

  - UMAP visualization of scRNA-seq data using DEGHTE and DEGCTE

  - Linear regression model with sample batch and histological diagnosis covariates
  for correlations between cryptic MAP number and immune/cell type enrichment scores

  - Kaplan-Meier survival analysis with log-rank Mantel-Cox test

  - Enrichment analysis of multiomics subtypes using two-sided Fisher''s exact test
  with Benjamini-Hochberg adjustment

  - Multiomics profiling (phosphoproteome/global proteome/acetylome) → subtype identification
  → validation in 462 NSCLC patients → clinical/histopathological association → patient-derived
  organoid drug testing

  - MHC-binding prediction → immunopeptidomics validation for recurrent cryptic MAPs

  - WES preprocessing: DNA isolation from FFPE tumor and normal samples (NATs or blood
  buffy coat if NAT unavailable) → SureSelect V6-Post WES library generation → Illumina
  NovaSeq sequencing → bcl2fastq BCL-to-Fastq → FastQC v0.11.9 QC → BWA v0.7.17 BWA-MEM
  alignment to GENCODE GRCh38.p13 v32 → Picard SortSam → Picard MarkDuplicates v2.23.1
  → GATK4 BQSR v4.1.8.0

  - Somatic variant calling: GATK4 Mutect2 v4.1.8.0 (paired normal mode; tumor-only
  for one sample without matching normal) → GATK4 GetPileupSummaries → GATK4 CalculateContamination
  → GATK4 FilterMutectCalls → GATK4 Funcotator v4.2.0.0 annotation → maftools v2.8.0
  MAF merge

  - Germline variant calling: GATK4 HaplotypeCaller v4.1.8.0 in GVCF mode → GATK4
  GenomicsDBImport v4.1.8.0 → GATK4 GenotypeGVCFs v4.1.8.0 → GATK4 VariantRecalibrator
  and ApplyVQSR for SNP and indel recalibration → GATK4 Funcotator annotation

  - Copy number alteration identification: CNVkit v0.9.8; amplification if absolute
  copy number >=4; gain if absolute copy number >=2.5 and <4; genes with absolute
  copy number 0.5–1.5 labeled by copy number status

  - Protein lysate centrifugation (14,500 g, 4 °C, 5 min) → BCA protein quantification
  → storage at -80 °C

  - Reduction with 20 mM DTT at 95 °C for 10 min → alkylation with 40 mM iodoacetamide
  in dark at RT for 30 min

  - S-Trap colloidal protein capture → tryptic digestion with Trypsin/Lys-C (1:25
  w/w) at 37 °C for 6 h → peptide elution and C18 desalting

  - Common reference pool preparation and TMTpro 16-plex labeling with 250 μg peptide
  per sample and 1 mg TMT reagent

  - Labeling efficiency check by LC-MS/MS (≥95% fully labeled) → quenching with 5%
  hydroxylamine → pooling and C18 desalting

  - Mid-pH reversed-phase fractionation (96 fractions pooled to 24; 12 non-consecutive
  fractions for PTM analysis)

  - IMAC phosphopeptide enrichment using Fe3+-charged Ni-NTA beads → acetylpeptide
  enrichment using Ac-K antibody beads

  - LC-MS/MS on Ultimate 3000 RSLC nano coupled to Q Exactive HF-X

  - 肽段鉴定（动态修饰、最小长度、Percolator重打分、1% FDR） → 冲突PSM剔除 → novel peptide BLAST过滤（UniProt/RefSeq/Gencode，≤1个氨基酸替换）
  → 去移码肽段 → 保留至少1条RNA-Seq read且可定量PSM的肽段 → 蛋白/磷酸化/乙酰化定量（Proteome Discoverer v2.4 +
  SequestHT，TMT归一化） → 缺失值过滤（<30%）和KNN插补（k=5） → NMF多组学亚型聚类（秩2-10，稳健聚类） → 与CPTAC LUAD/LSCC联合NMF及既往NSCLC研究验证
  → PTM-SEA和GSVA通路/特征富集

  - Select Hallmark pathway gene sets (MSigDB) for ssGSEA and PTM signatures database
  (PTMsigDB) for modification site-specific signatures → identify differentially enriched
  CNVs: convert gene-level copy numbers from CNVkit to cytoband-level by mean copy
  numbers → linear regression with Subtype and DX covariates → BH-adjusted p < 0.05
  → identify DEGs: import Salmon transcript-level estimates with tximport to gene-level
  expression matrix → DESeqDataSetFromTximport → DESeq negative binomial model with
  design Group + DX + rna:batch → BH-adjusted p < 0.05 → identify DEPs: linear regression
  with Group, DX, and Batch covariates → BH-adjusted p < 0.05 → survival analysis:
  Kaplan-Meier for five NMF subtypes with OS and NSCLC-death event, log-rank test,
  pairwise BH adjustment → feature-wise survival: top 50% vs bottom 50% expression
  for each protein/PTM using Kaplan-Meier, prognostic direction by Cox proportional-hazards
  coefficient sign, log-rank nominal p < 0.001

  - Select top 1% of features by statistical significance for survival-associated
  features

  - Estimate kinase activity from differentially expressed phosphorylation using decoupleR::run_mlm
  with PHONEMeS prior knowledge network

  - Compare subtype-specific genes with cell type-specific genes from local_extended.rds
  for single-cell subtype distribution

  - Perform cell type-based immune microenvironment clustering using Xcell enrichment
  scores, z-score normalization, consensus clustering, and PAM

  - Perform pathway-based immune clustering using GSVA on seven curated immune-related
  pathways, z-score normalization, and k-means

  - Test TIL patterns, overall survival, and relapse-free survival with cell types
  and immune clusters using regression/Cox models

  - Infer putative regulators associated with immune landscape using ARACNe regulon
  networks, viper protein activity, immunomodulator correlation, and driver mutations

  - Validate immune landscape in integrated NSCLC cohorts using z-score normalization,
  consensus clustering, and PAM

  - Predict neoantigens and cryptic peptides from mutated peptides and non-canonical
  peptides using HLA typing, binding affinity prediction, and MS evidence

  - HLA binding prediction for neoantigen candidates → confirmed cryptic peptides
  with FPKM >= 1 in tumor samples

  - Patients separated by high/low cryptic peptide load and by HTE/CTE or high/low
  APM → four categories → over-representation of each multi-omics subtype calculated
  by two-sided Fisher''s exact test

  - CPTAC data preprocessing: discard features with >30% missing values across all
  tumors → k-NN imputation using k=5 → downstream analyses


