content: '- 基因数 = 500–8,000（保留细胞标准）

  - 基因计数 = 1,000–100,000（保留细胞标准）

  - 线粒体基因计数比例 = <20%（保留细胞标准）

  - 双细胞评分 = >第90百分位数（Scrublet去除双细胞）

  - 样本高质量细胞数 = <50（排除样本）

  - 共同基因集 = 21,812（统一不同版本人类基因组注释）

  - 低质量或生殖系细胞 = 排除（基于原始研究注释）

  - NMF一致性运行 = 30 runs（CM识别稳健性）

  - CCC稳定性标准 = ρk−2<ρk−1<ρk 且 ρk>ρk+1，选CCC最大（pan-tissue atlas最佳rank=12）

  - GTEx样本过滤 = 排除细胞系样本；仅保留单细胞队列覆盖的23种组织的12,240样本（GTEx RNA-seq预处理）

  - CMT低评分样本过滤 = 最高CMT评分<0.2，排除278/12,240 (2.3%)（GTEx RNA-seq CMT分类）

  - 空间参考亚采样 = 每细胞亚群最多1,000细胞，不足则全部（cell2location去卷积）

  - CM网络置换检验 = n=10,000（连接性显著性）

  - Ro/e富集阈值 = Ro/e>1（组织富集定义）

  - 空间CM活性缩放 = 第99百分位值设为1（空间CM可视化）'
