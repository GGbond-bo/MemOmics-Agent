content: '- 蛋白/磷酸化位点/乙酰化位点检测率 = 至少30%样本（质量控制后保留用于定量的特征）

  - 低表达基因过滤 = 60,688→20,088转录本（bulk RNA-seq后续分析）

  - WES覆盖深度 = 肿瘤~300X，NAT~100X（变异发现覆盖度）

  - 缺失率 = <30%（在229个样本中保留特征）

  - 样本数 = 229（多组学分析队列）

  - Adapter sequence = <1% in all samples（FastQC检查后未进行额外trimming）

  - Overrepresented sequence (ORS) = 无质量问题的ORS（FastQC(v0.11.9)检查）

  - 平均测序深度 = 肿瘤300x；NAT和blood buffy coat 100x（Illumina NovaSeq WES）

  - Nucleic acid quality = 排除21例核酸质量指标不合格病例（患者入组前质控）

  - 标记效率 = 每样本≥95% fully labeled MS/MS spectra（TMTpro 16-plex标记后、混合前）

  - 蛋白浓度 = BCA法测定（裂解液离心后）

  - 肽段浓度 = NanoDrop One A205（C18脱盐干燥后）

  - FDR = 1%（每个搜索阶段分别用 target-decoy 策略计算）

  - ptmRS probability = greater than 0.95（磷酸化/乙酰化位点定位可信阈值）

  - TMT reporter ion intensity = at least 20% of total intensity of all reporter ions（neoantigen
  candidate 过滤）

  - FPKM = greater than 0（选择假基因/lncRNA/UTR 转录本用于 novel peptide 搜索）

  - peptide length = primary >=6 residues; novel >=8 residues（最小肽段长度）

  - mass tolerance = +/- 10 ppm（动态排除质量容差）

  - PSM FDR = 1%（Percolator验证）

  - co-isolation threshold = 50%（TMT定量低质量值过滤）

  - average reporter S/N threshold = 10%（TMT定量低质量值过滤）

  - missing values = <30% across all tumors（保留全局蛋白/磷酸化/乙酰化特征）

  - minimum peptide length = 8 residues（搜库）

  - adjusted p-value = <0.05（subtype-specific DEGs筛选）

  - FPKM = <1（视为不表达）

  - novel peptide occurrence = >2 tumor samples and not in at least one normal sample（cryptic
  peptide预测）

  - adjusted p-value = Benjamini-Hochberg（激酶活性p值校正）'
